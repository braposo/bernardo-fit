name: Tests

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build admin components
        run: npm run build

      - name: Install browser for PDF and admin checks
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Verify admin components and accessibility
        run: npm run test:admin-ui

      - name: Verify realtime task notifications
        run: npm run test:task-ui

      - name: Verify distinct fit page titles
        run: node scripts/verify-fit-titles.mjs

      - name: Verify admin chat
        run: npm run test:chat-ui
