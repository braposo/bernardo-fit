<div class="reviewbar"><strong>DESIGN STUDY · JOB PIPELINE</strong><nav aria-label="Mockup views"><button data-view="pipeline">01 Pipeline</button><button data-view="role">02 Role & documents</button><button data-view="mobile">03 Mobile</button><a href="https://github.com/shadcnstudio/shadcn-nextjs-admincn-admin-template-free" target="_blank" rel="noopener">Reference ↗</a></nav></div>
<div id="app"></div>
<dialog id="preview"><h2 id="preview-title">Design preview</h2><p id="preview-text"></p><button class="btn dark" id="close-preview">Close preview</button></dialog>
<script>
const icons={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',archive:'<rect x="3" y="3" width="18" height="5" rx="1"/><path d="M5 8v12h14V8M10 12h4"/>',chart:'<path d="M4 3v17h17M9 15v-4M14 15V7M19 15V4"/>',settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="white"/><circle cx="16" cy="17" r="3" fill="white"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',chevron:'<path d="m9 5 7 7-7 7"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',back:'<path d="M20 12H4m6-6-6 6 6 6"/>',external:'<path d="M14 3h7v7M21 3 11 13M10 3H4v17h17v-7"/>',location:'<path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',file:'<path d="M14 3H5v18h14V8l-5-5Zm0 0v5h5M8 12h8M8 16h6"/>',letter:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/>',brief:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 14h6"/>',globe:'<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',check:'<path d="m5 12 4 4L19 6"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/>',link:'<path d="m10 13 4-4M8 15l-2 2a4 4 0 0 1-5-5l4-4a4 4 0 0 1 5 0m4 1 2-2a4 4 0 0 1 5 5l-4 4a4 4 0 0 1-5 0"/>',plus:'<path d="M12 5v14M5 12h14"/>',building:'<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 7h1m6 0h1M8 11h1m6 0h1M10 21v-5h4v5"/>'};
const icon=name=>'<svg aria-hidden="true" viewBox="0 0 24 24">'+(icons[name]||icons.file)+'</svg>';
const jobs=[
 {id:'sanity',company:'Sanity',role:'Engineering Manager, Developer Experience',location:'London · Hybrid',salary:'£120k–£145k',score:86,status:'Interviewing',age:'2 days ago',docs:[1,1,1]},
 {id:'linear',company:'Linear',role:'Engineering Manager, Product Platform',location:'Europe · Remote',salary:'£130k–£160k',score:82,status:'Applied',age:'4 days ago',docs:[1,1,0]},
 {id:'intercom',company:'Intercom',role:'Senior Engineering Manager, AI Products',location:'London · Hybrid',salary:'Salary not listed',score:78,status:'Reviewing',age:'6 hours ago',docs:[1,0,0]},
 {id:'monzo',company:'Monzo',role:'Engineering Manager, Core Platform',location:'London · Remote',salary:'£110k–£140k',score:74,status:'Offer',age:'2 weeks ago',docs:[1,1,1]},
 {id:'notion',company:'Notion',role:'Engineering Manager, Developer Platform',location:'London · Hybrid',salary:'Salary not listed',score:null,status:'New',age:'30 minutes ago',docs:[0,0,0]}
];
const app=document.getElementById('app');let currentView=new URLSearchParams(location.search).get('view')||'pipeline';let selected=jobs[0];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function badge(j){return '<span class="status '+j.status.toLowerCase()+'">'+j.status+'</span>'}
function score(j){return '<button class="score '+(j.score===null?'empty':j.score<80?'mid':'')+'" data-score="'+j.id+'" aria-label="'+(j.score===null?'No fit analysis yet':j.score+' out of 100 fit score. Open assessment')+'">'+(j.score??'—')+'</button>'}
function brand(){return '<div class="brand"><span class="brand-mark">b.</span>bernardo<small>fit</small></div>'}
function nav(){return '<aside class="sidebar">'+brand()+'<div><div class="side-section-label">Workspace</div><nav class="sidenav"><button class="active" data-view="pipeline">'+icon('grid')+'Pipeline<span class="count">5</span></button><button data-notice="Archive">'+icon('archive')+'Archive</button><button data-notice="AI activity & usage">'+icon('chart')+'AI activity</button></nav></div><div class="sidebar-foot"><div class="avatar">BR</div><div>Bernardo Raposo<small>Personal workspace</small></div></div></aside>'}
function chrome(){return '<header class="workspace-nav">'+brand()+'<nav aria-label="Workspace"><button class="active" data-view="pipeline">Pipeline</button><button data-notice="Archive">Archive</button><button data-notice="AI activity & usage">AI activity</button></nav><div class="avatar">BR</div></header><main class="mail-layout"><aside class="job-pane" aria-label="Jobs">'+pipeline()+'</aside><section class="reading-pane" aria-label="Selected job">'+roleView()+'</section></main>'}
function jobCard(j){return '<button class="job-card '+(selected.id===j.id?'selected':'')+'" data-job="'+j.id+'" aria-pressed="'+(selected.id===j.id)+'"><span class="card-top"><span class="card-copy"><span class="company-line"><span class="monogram '+j.id+'">'+j.company[0]+'</span>'+j.company+'</span><span class="role-name">'+j.role+'</span></span><span class="score '+(j.score===null?'empty':j.score<80?'mid':'')+'" aria-label="'+(j.score===null?'Not scored':j.score+' out of 100 fit score')+'">'+(j.score??'—')+'</span></span><span class="card-location">'+j.location+'</span><span class="card-status">'+badge(j)+'<span class="added">'+icon('clock')+'Added '+j.age+'</span></span><span class="card-docs">'+['Analysis','Letter','Brief'].map((name,i)=>'<span class="'+(!j.docs[i]?'unavailable':'')+'">'+icon(j.docs[i]?'check':'file')+name+'</span>').join('')+'</span></button>'}
function pipeline(){return '<div class="inbox-heading"><div><h1>Job pipeline</h1><p class="sub">5 opportunities</p></div><button class="btn" data-notice="Add opportunity" aria-label="Add opportunity">'+icon('plus')+'</button></div><div class="toolbar"><label class="search">'+icon('search')+'<input aria-label="Search jobs" placeholder="Search company or role…" id="search"></label><div class="filter-row"><select id="filter" aria-label="Filter by stage"><option value="all">All stages</option><option>Interviewing</option><option>Applied</option><option>Reviewing</option><option>Offer</option><option>New</option></select><select id="sort" aria-label="Sort roles"><option value="score">Highest score</option><option value="recent">Recently added</option></select></div></div><div class="job-list" id="job-list">'+jobs.map(jobCard).join('')+'</div><div class="list-foot"><span>5 opportunities · sorted by score</span></div>'}
function docCard(title,type,color,meta,available=true){const d=documentState(title,available),live=d.versions.find(v=>v.id===d.live),latest=d.versions[0];return '<article class="document-card"><div class="document-top"><div class="document-identity"><div class="file-icon '+color+'">'+icon(type)+'</div><h3>'+title+'</h3></div><span class="document-state">'+(live?'Live · v'+live.id:latest?'Draft ready':'Not created')+'</span></div>'+(latest?'<div class="version-summary"><strong>'+ (live?'Version '+live.id:'Version '+latest.id+' · Draft')+'</strong><span>'+esc((live||latest).model)+'</span></div><p class="document-age">'+icon('clock')+'Created '+(live||latest).age+'</p>'+(latest.id!==d.live?'<p class="draft-note">'+(live?'v'+latest.id+' draft ready to review':'Review and publish your first version')+'</p>':'<p class="draft-note muted">'+d.versions.length+' saved versions</p>')+'<div class="document-actions"><button class="btn dark" data-open-version="'+title+'">Open '+(live?'live':'draft')+icon('external')+'</button><button class="btn" data-generate="'+title+'">'+icon('spark')+'Generate new version</button></div>'+inlineVersions(title,d):'<div class="document-empty"><strong>Your '+title.toLowerCase()+' starts here</strong><p>Choose a model and generate the first version. Review it before making it live.</p></div><button class="btn dark generate-first" data-generate="'+title+'">'+icon('spark')+'Generate document</button>')+'</article>'}

function documentsView(){return '<div class="section-head"><h2>Documents</h2><span class="sub">Everything you need for this opportunity</span></div><div class="doc-grid">'+docCard('Fit analysis','file','blue','Saved document',selected.docs[0])+docCard('Cover letter','letter','','Saved document',selected.docs[1])+docCard('Interview brief','brief','green','Saved document',selected.docs[2])+docCard('Company research','globe','gray','Saved document',selected.docs[2])+'</div><div class="docs-foot"><span>'+icon('lock')+'Letter, brief and research are private. Only the fit page is shareable.</span><span>Live selects the current version; private documents stay private.</span></div>'}
function roleView(){return '<button class="focus-back" data-view="pipeline">'+icon('back')+'Back to pipeline</button><div class="role-hero"><div class="score-actions">'+score(selected)+'<a class="btn dark listing-link" href="https://example.com/jobs/'+selected.id+'" target="_blank" rel="noopener noreferrer" title="Illustrative URL — production uses the saved job posting URL">View listing '+icon('external')+'</a></div><div class="hero-text"><div class="company-line"><span class="monogram '+selected.id+'">'+selected.company[0]+'</span>'+selected.company+'</div><h1>'+selected.role+'</h1><div class="hero-meta"><span>'+icon('location')+selected.location+'</span><span>'+selected.salary+'</span><span>'+icon('clock')+'Added '+selected.age+'</span></div></div><div class="hero-right">'+badge(selected)+'<button class="btn quiet status-edit" data-notice="Change stage" aria-label="Change status" title="Change status">'+icon('settings')+'</button></div></div>'+roleTabs()+'<p class="prototype-note">Design proposal · Illustrative roles, scores, documents and dates</p>'}

function overview(){if(selected.id!=='sanity')return '<section class="panel"><h2>Role overview</h2><p class="sub">Assessment details and recorded activity for '+selected.company+' will appear here. The Sanity example shows the proposed populated layout.</p></section>';return '<div class="detail-grid"><section class="panel"><h2>Why this role</h2><div class="reason">'+icon('check')+'<div><strong>A strong match for your developer experience background</strong><p>Platform leadership, developer tooling and building products for technical teams.</p></div></div><div class="reason">'+icon('check')+'<div><strong>Leadership with room to stay close to the product</strong><p>Own the team’s direction while partnering with engineering and design.</p></div></div><div class="reason">'+icon('check')+'<div><strong>Location and working pattern fit</strong><p>London-based with a hybrid setup and a relevant compensation range.</p></div></div><div class="attention"><b>Worth exploring</b><br>Clarify the team’s remit and the balance between people management and hands-on work.</div></section><aside class="panel"><h2>Recent activity</h2><ol class="timeline"><li>Interview brief updated<small>3 hours ago</small></li><li>Moved to Interviewing<small>Yesterday</small></li><li>Cover letter generated<small>Yesterday</small></li><li>Added to your pipeline<small>2 days ago</small></li></ol><div class="next-step"><strong>Ready for the conversation</strong><p>Your brief and company research are ready to open.</p></div></aside></div>'}
function show(view,push=true){currentView=view;document.body.classList.toggle('mobile-preview',view==='mobile');document.body.classList.toggle('show-role',view==='role');const html=chrome();app.innerHTML=view==='mobile'?'<div class="mobile-wrap">'+html+'</div>':html;if(push)history.replaceState(null,'','?view='+view);wireFilters();window.scrollTo(0,0)}
function selectJob(id){selected=jobs.find(j=>j.id===id);document.querySelector('.reading-pane').innerHTML=roleView();document.querySelectorAll('[data-job]').forEach(b=>{const active=b.dataset.job===id;b.classList.toggle('selected',active);b.setAttribute('aria-pressed',active)});document.body.classList.add('show-role');document.querySelector('.reading-pane').scrollTop=0;}
function wireFilters(){const search=document.getElementById('search'),filter=document.getElementById('filter'),sort=document.getElementById('sort');if(!search)return;const refresh=()=>{let shown=jobs.filter(j=>(filter.value==='all'||filter.value===j.status)&&(j.company+' '+j.role).toLowerCase().includes(search.value.toLowerCase()));if(sort.value==='recent'){const order=['notion','intercom','sanity','linear','monzo'];shown.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id))}document.getElementById('job-list').innerHTML=shown.map(jobCard).join('')||'<div class="empty-state">No matching opportunities.</div>';document.querySelector('.list-foot span').textContent=shown.length+' opportunities · '+(sort.value==='score'?'sorted by score':'recently added')};search.oninput=refresh;filter.onchange=refresh;sort.onchange=refresh}
function preview(title,content){const d=document.getElementById('preview');document.getElementById('preview-title').textContent=title;document.getElementById('preview-text').textContent=content;d.showModal()}
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.view)show(button.dataset.view);if(button.dataset.job){selectJob(button.dataset.job)}if(button.dataset.score)preview('Assessment score', 'The large number is the existing fit score out of 100. The proposed design removes repeated “Fit” and tier labels, while keeping this accessible explanation.');if(button.dataset.doc)preview(button.dataset.doc,'This opens the saved document directly. In this design prototype it shows a placeholder; no generation or live data is involved.');if(button.dataset.notice)preview(button.dataset.notice,'This is a design preview. This control would use the existing application behavior when implemented.');if(button.dataset.filter){document.getElementById('filter').value=button.dataset.filter;document.getElementById('filter').dispatchEvent(new Event('change'));document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===button))}if(button.dataset.panel)selectPanel(button.dataset.panel);});

document.getElementById('close-preview').onclick=()=>document.getElementById('preview').close();
if(new URLSearchParams(location.search).has('capture'))document.body.classList.add('capture');

const documentFixtures=new Map();
let activeDocument='';
function documentState(title,available=true){const key=selected.id+':'+title;if(!documentFixtures.has(key)){const count=title==='Fit analysis'?3:2;const versions=available?Array.from({length:count},(_,i)=>({id:count-i,model:i===0?'Sol':'Sonnet',age:i===0?'3 hours ago':i===1?'yesterday':'2 days ago'})):[];documentFixtures.set(key,{versions,live:versions.length?count:0});}return documentFixtures.get(key)}
const manager=document.createElement('dialog');manager.className='version-dialog';manager.setAttribute('aria-label','Manage document versions');document.body.append(manager);
function managerContent(title,body){manager.innerHTML='<div class="dialog-heading"><h2>'+title+'</h2><button class="btn quiet" data-close-manager aria-label="Close document manager">✕</button></div>'+body;if(!manager.open)manager.showModal();}
function refreshDocuments(){const open=new Set(Array.from(document.querySelectorAll('.inline-versions[open]')).map(el=>el.dataset.document));document.querySelector('.reading-pane').innerHTML=roleView();document.querySelectorAll('.inline-versions').forEach(el=>{el.open=open.has(el.dataset.document)});}
function inlineVersions(title,d){return '<details class="inline-versions" data-document="'+title+'"><summary>Versions <span class="version-count">'+d.versions.length+'</span>'+icon('chevron')+'</summary><div class="version-list">'+d.versions.map(v=>'<div class="version-row '+(d.live===v.id?'live':'')+'"><div class="version-row-head"><strong>Version '+v.id+'</strong><span class="document-state">'+(d.live===v.id?'Live':v.id===d.versions[0].id?'Latest draft':'Saved')+'</span></div><p>'+v.model+' · Created '+v.age+'</p><div class="version-row-actions"><button class="btn" data-preview-version="'+v.id+'">Preview</button>'+(d.live!==v.id?'<button class="btn dark" data-publish-version="'+v.id+'">Publish live</button>':'<span class="saved-dot">Current version</span>')+'</div></div>').join('')+'</div></details>';}
function historyView(title,notice=''){activeDocument=title;manager.close();refreshDocuments();const section=Array.from(document.querySelectorAll('.inline-versions')).find(el=>el.dataset.document===title);if(section){section.open=true;if(notice){const message=document.createElement('div');message.className='version-notice';message.setAttribute('role','status');message.textContent=notice;section.querySelector('.version-list').prepend(message);}section.querySelector('summary').focus({preventScroll:true});}}

function generationView(title){activeDocument=title;const d=documentState(title);managerContent(d.versions.length?'Generate a new version':'Generate '+title,'<p class="intro">'+title+' · '+selected.company+'. Choose a model for this version. '+(d.live?'Your current live version stays in place until you publish the new one.':'The result will be saved as a draft for review.')+'</p><label for="generation-model">Model</label><select id="generation-model"><option>Sol</option><option>Astra</option><option>Sonnet</option><option>Opus</option></select><label for="generation-instructions">Instructions <span class="sub">(optional)</span></label><textarea id="generation-instructions" placeholder="What should this version improve?"></textarea><p class="demo-note">Design preview — no AI call or charge. Production uses configured models and generation cost confirmation.</p><div class="dialog-actions"><button class="btn" data-close-manager>Cancel</button><button class="btn dark" data-create-version>Generate draft '+icon('spark')+'</button></div>');}
function versionPreview(id){const d=documentState(activeDocument),v=d.versions.find(v=>v.id===id);managerContent(activeDocument+' · v'+id,'<p class="intro">'+v.model+' · Created '+v.age+' · '+(d.live===id?'Live version':'Saved version')+'</p><div class="preview-copy"><strong>'+selected.company+' — '+activeDocument+'</strong><p>This is an illustrative document preview for version '+id+'. The application will show the actual saved content here so you can review it before publishing.</p></div><div class="dialog-actions"><button class="btn" data-history="'+activeDocument+'">Back to versions</button>'+(d.live!==id?'<button class="btn dark" data-publish-version="'+id+'">Publish live</button>':'')+'</div>');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close-manager'))manager.close();if(b.dataset.history)historyView(b.dataset.history);if(b.dataset.generate)generationView(b.dataset.generate);if(b.dataset.openVersion){activeDocument=b.dataset.openVersion;const d=documentState(activeDocument);versionPreview(d.live||d.versions[0].id);}if(b.closest('.inline-versions'))activeDocument=b.closest('.inline-versions').dataset.document;if(b.dataset.previewVersion)versionPreview(Number(b.dataset.previewVersion));if(b.hasAttribute('data-create-version')){const d=documentState(activeDocument),model=document.getElementById('generation-model').value;d.versions.unshift({id:(d.versions[0]?.id||0)+1,model,age:'just now'});historyView(activeDocument,'New draft created. Preview it, then publish when ready.');}if(b.dataset.publishVersion){const d=documentState(activeDocument);d.live=Number(b.dataset.publishVersion);historyView(activeDocument,'Version '+d.live+' is now live in this preview.');}});


let activePanel=new URLSearchParams(location.search).get('panel')||'overview';
if(!['overview','documents','details','activity'].includes(activePanel))activePanel='overview';
function panelContent(){return activePanel==='overview'?overview():activePanel==='documents'?documentsView():activePanel==='details'?'<section class="panel"><h2>Role details</h2><p class="sub">The full description, original posting, private notes and AI instructions belong here, in individually labelled editors.</p></section>':'<section class="panel"><h2>Activity</h2><p class="sub">Recorded run outcomes, stage changes and costs belong here. Document version history is available within each document card.</p></section>';}
function roleTabs(){return '<nav class="role-tabs" role="tablist" aria-label="Job sections">'+[['overview','Overview'],['documents','Documents'],['details','Role details'],['activity','Activity']].map(([id,label])=>'<button role="tab" id="tab-'+id+'" aria-controls="role-content" aria-selected="'+(activePanel===id)+'" tabindex="'+(activePanel===id?'0':'-1')+'" class="'+(activePanel===id?'active':'')+'" data-panel="'+id+'">'+label+'</button>').join('')+'</nav><div id="role-content" role="tabpanel" tabindex="0" aria-labelledby="tab-'+activePanel+'">'+panelContent()+'</div>';}
function selectPanel(panel){activePanel=panel;document.querySelectorAll('[data-panel]').forEach(b=>{const active=b.dataset.panel===panel;b.classList.toggle('active',active);b.setAttribute('aria-selected',active);b.tabIndex=active?0:-1});const content=document.getElementById('role-content');content.setAttribute('aria-labelledby','tab-'+panel);content.innerHTML=panelContent();}
document.addEventListener('keydown',e=>{if(!e.target.matches('[role="tab"]'))return;const tabs=Array.from(document.querySelectorAll('[role="tab"]'));let index=tabs.indexOf(e.target);if(e.key==='ArrowRight')index=(index+1)%tabs.length;else if(e.key==='ArrowLeft')index=(index+tabs.length-1)%tabs.length;else if(e.key==='Home')index=0;else if(e.key==='End')index=tabs.length-1;else return;e.preventDefault();selectPanel(tabs[index].dataset.panel);tabs[index].focus();});

show(currentView,false);
</script>
</body>
</html>
