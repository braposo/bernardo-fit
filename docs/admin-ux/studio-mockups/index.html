const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function badge(j){return '<span class="status '+j.status.toLowerCase()+'">'+j.status+'</span>'}
function score(j){return '<button class="score '+(j.score===null?'empty':j.score<80?'mid':'')+'" data-score="'+j.id+'" aria-label="'+(j.score===null?'No fit analysis yet':j.score+' out of 100 fit score. Open assessment')+'">'+(j.score??'—')+'</button>'}
function brand(){return '<div class="brand"><span class="brand-mark">b.</span>bernardo<small>fit</small></div>'}
function nav(){return '<aside class="sidebar">'+brand()+'<div><div class="side-section-label">Workspace</div><nav class="sidenav"><button class="active" data-view="pipeline">'+icon('grid')+'Pipeline<span class="count">5</span></button><button data-notice="Archive">'+icon('archive')+'Archive</button><button data-notice="AI activity & usage">'+icon('chart')+'AI activity</button></nav></div><div class="sidebar-foot"><div class="avatar">BR</div><div>Bernardo Raposo<small>Personal workspace</small></div></div></aside>'}
function chrome(content,role=false){return '<div class="shell">'+nav()+'<main class="main"><header class="topbar"><div class="crumb">Workspace '+icon('chevron')+'<b>Pipeline</b>'+(role?icon('chevron')+'<span>'+selected.company+'</span>':'')+'</div><div class="topright"><span>Personal workspace</span><div class="avatar">BR</div></div></header><header class="mobile-brand">'+brand()+'<div class="avatar">BR</div></header><div class="content">'+content+'</div></main></div>'}
function jobCard(j){const names=['Fit analysis','Cover letter','Interview brief'];const files=['file','letter','brief'];return '<article class="job-card"><div class="job-main">'+score(j)+'<div><button class="job-title" data-job="'+j.id+'"><span class="company-line"><span class="monogram '+j.id+'">'+j.company[0]+'</span>'+j.company+'</span><span class="role-name">'+j.role+'</span></button><div class="job-meta"><span>'+icon('location')+j.location+'</span><span>'+j.salary+'</span></div></div><div class="job-right">'+badge(j)+'<button class="open-role" data-job="'+j.id+'">View role '+icon('arrow')+'</button></div></div><footer class="job-footer"><div class="doc-links">'+names.map((name,i)=>'<button class="doc-link '+(!j.docs[i]?'missing':'')+'" '+(j.docs[i]?'data-doc="'+name+'"':'disabled')+' aria-label="'+(j.docs[i]?'Open '+name:name+' not generated')+'">'+icon(files[i])+(j.docs[i]?name:i===0?'No analysis yet':i===1?'No letter yet':'No brief yet')+(j.docs[i]?'<span class="arrow">↗</span>':'')+'</button>').join('')+'</div><time class="added" title="Illustrative relative date">'+icon('clock')+'Added '+j.age+'</time></footer></article>'}
function pipeline(){return '<div class="page-heading"><div><div class="eyebrow">Opportunities</div><h1>Job pipeline</h1><p class="sub">A clearer view of every opportunity.</p></div><div class="heading-actions"><button class="btn" data-notice="Sort & display preferences">'+icon('settings')+'Display</button><button class="btn dark" data-notice="Add opportunity">'+icon('plus')+'Add opportunity</button></div></div><div class="collection-switch"><button class="active" data-filter="all">All opportunities <span>5</span></button><button data-filter="Interviewing">Interviewing <span>1</span></button><span class="spacer">Private workspace</span></div><div class="toolbar"><label class="search">'+icon('search')+'<input aria-label="Search jobs" placeholder="Search company or role…" id="search"><kbd>/</kbd></label><select id="filter" aria-label="Filter by stage"><option value="all">All stages (5)</option><option>Interviewing</option><option>Applied</option><option>Reviewing</option><option>Offer</option><option>New</option></select><select class="sort" id="sort" aria-label="Sort roles"><option value="score">Highest score first</option><option value="recent">Recently added</option></select></div><div class="job-list" id="job-list">'+jobs.map(jobCard).join('')+'</div><div class="list-foot"><span>5 opportunities · sorted by score</span><span>Illustrative data</span></div><p class="prototype-note">Design proposal · Illustrative roles, scores, documents and dates</p>'}
function docCard(title,type,color,meta,available=true){if(!available)return '<article class="document-card"><div class="document-top"><div class="file-icon '+color+'">'+icon(type)+'</div></div><h3>'+title+'</h3><small>Not generated yet</small><button class="doc-open" data-notice="Generate '+title+'">Generate '+icon('spark')+'</button></article>';return '<article class="document-card"><div class="document-top"><div class="file-icon '+color+'">'+icon(type)+'</div><span class="saved-dot">Ready</span><button class="more" data-notice="'+title+' options" aria-label="'+title+' options">'+icon('more')+'</button></div><h3>'+title+'</h3><small>'+meta+'</small><button class="doc-open" data-doc="'+title+'">Open '+(title==='Fit analysis'?'fit page':title==='Cover letter'?'letter':title==='Interview brief'?'brief':'research')+icon('external')+'</button></article>'}
function roleView(){return '<button class="focus-back" data-view="pipeline">'+icon('back')+'Back to pipeline</button><div class="role-hero">'+score(selected)+'<div class="hero-text"><div class="company-line"><span class="monogram '+selected.id+'">'+selected.company[0]+'</span>'+selected.company+'</div><h1>'+selected.role+'</h1><div class="hero-meta"><span>'+icon('location')+selected.location+'</span><span>'+selected.salary+'</span><span>'+icon('clock')+'Added '+selected.age+'</span></div></div><div class="hero-right">'+badge(selected)+'<button class="btn quiet" data-notice="Change stage">Change stage '+icon('settings')+'</button></div></div><div class="section-head"><h2>Documents</h2><span class="sub">Everything you need for this opportunity</span></div><div class="doc-grid">'+docCard('Fit analysis','file','blue','Saved document',selected.docs[0])+docCard('Cover letter','letter','','Saved document',selected.docs[1])+docCard('Interview brief','brief','green','Saved document',selected.docs[2])+docCard('Company research','globe','gray','Saved document',selected.docs[2])+'</div><div class="docs-foot"><span>'+icon('lock')+'Letter, brief and research are private. Only the fit page is shareable.</span><span>Versions & generation in each document menu</span></div><nav class="role-tabs" aria-label="Role sections"><button class="active" data-panel="overview">Overview</button><button data-panel="context">Role & context</button><button data-panel="activity">Activity</button></nav><div id="role-content">'+overview()+'</div><p class="prototype-note">Design proposal · Illustrative roles, scores, documents and dates</p>'}
function overview(){if(selected.id!=='sanity')return '<section class="panel"><h2>Role overview</h2><p class="sub">Assessment details and recorded activity for '+selected.company+' will appear here. The Sanity example shows the proposed populated layout.</p></section>';return '<div class="detail-grid"><section class="panel"><h2>Why this role</h2><div class="reason">'+icon('check')+'<div><strong>A strong match for your developer experience background</strong><p>Platform leadership, developer tooling and building products for technical teams.</p></div></div><div class="reason">'+icon('check')+'<div><strong>Leadership with room to stay close to the product</strong><p>Own the team’s direction while partnering with engineering and design.</p></div></div><div class="reason">'+icon('check')+'<div><strong>Location and working pattern fit</strong><p>London-based with a hybrid setup and a relevant compensation range.</p></div></div><div class="attention"><b>Worth exploring</b><br>Clarify the team’s remit and the balance between people management and hands-on work.</div></section><aside class="panel"><h2>Recent activity</h2><ol class="timeline"><li>Interview brief updated<small>3 hours ago</small></li><li>Moved to Interviewing<small>Yesterday</small></li><li>Cover letter generated<small>Yesterday</small></li><li>Added to your pipeline<small>2 days ago</small></li></ol><div class="next-step"><strong>Ready for the conversation</strong><p>Your brief and company research are ready to open.</p></div></aside></div>'}
function show(view,push=true){currentView=view;document.body.classList.toggle('mobile-preview',view==='mobile');const html=chrome(view==='role'?roleView():pipeline(),view==='role');app.innerHTML=view==='mobile'?'<div class="mobile-wrap">'+html+'</div>':html;if(push)history.replaceState(null,'','?view='+view);wireFilters();window.scrollTo(0,0)}
function wireFilters(){const search=document.getElementById('search'),filter=document.getElementById('filter'),sort=document.getElementById('sort');if(!search)return;const refresh=()=>{let shown=jobs.filter(j=>(filter.value==='all'||filter.value===j.status)&&(j.company+' '+j.role).toLowerCase().includes(search.value.toLowerCase()));if(sort.value==='recent'){const order=['notion','intercom','sanity','linear','monzo'];shown.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id))}document.getElementById('job-list').innerHTML=shown.map(jobCard).join('')||'<div class="empty-state">No matching opportunities.</div>';document.querySelector('.list-foot span').textContent=shown.length+' opportunities · '+(sort.value==='score'?'sorted by score':'recently added')};search.oninput=refresh;filter.onchange=refresh;sort.onchange=refresh}
function preview(title,content){const d=document.getElementById('preview');document.getElementById('preview-title').textContent=title;document.getElementById('preview-text').textContent=content;d.showModal()}
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.view)show(button.dataset.view);if(button.dataset.job){selected=jobs.find(j=>j.id===button.dataset.job);show('role')}if(button.dataset.score)preview('Assessment score', 'The large number is the existing fit score out of 100. The proposed design removes repeated “Fit” and tier labels, while keeping this accessible explanation.');if(button.dataset.doc)preview(button.dataset.doc,'This opens the saved document directly. In this design prototype it shows a placeholder; no generation or live data is involved.');if(button.dataset.notice)preview(button.dataset.notice,'This is a design preview. This control would use the existing application behavior when implemented.');if(button.dataset.filter){document.getElementById('filter').value=button.dataset.filter;document.getElementById('filter').dispatchEvent(new Event('change'));document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===button))}if(button.dataset.panel){document.querySelectorAll('[data-panel]').forEach(b=>b.classList.toggle('active',b===button));document.getElementById('role-content').innerHTML=button.dataset.panel==='overview'?overview():button.dataset.panel==='context'?'<section class="panel"><h2>Role & context</h2><p class="sub">The full description, posting, private notes and AI instructions belong here, in individually labelled editors.</p></section>':'<section class="panel"><h2>Activity & versions</h2><p class="sub">Available run outcomes, saved versions and recorded costs belong here. Exact history depends on the data the backend stores.</p></section>'}});
document.getElementById('close-preview').onclick=()=>document.getElementById('preview').close();
if(new URLSearchParams(location.search).has('capture'))document.body.classList.add('capture');
show(currentView,false);
</script>
</body>
</html>
