<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc"><title id="title">Generation review and material states</title><desc id="desc">A review explicitly includes research refresh and brief rewrite, model, inputs and unavailable cost estimate. Adjacent state cards describe missing, outdated, running, failed and changed-scope behaviour.</desc><rect x="0" y="0" width="1200" height="960" rx="0" fill="#f0eee8" stroke="#f0eee8"/>
<text x="30" y="40" font-family="Arial, sans-serif" font-size="26" fill="#211f1a" font-weight="700">04 / Review generation and preserve truthful states</text>
<text x="30" y="69" font-family="Arial, sans-serif" font-size="16" fill="#666258" font-weight="400">Illustrative review. Effective scope comes from the server; a changed scope requires a new review.</text>
<rect x="30" y="98" width="585" height="665" rx="8" fill="#fffefa" stroke="#d8d3c8"/>
<text x="55" y="140" font-family="Arial, sans-serif" font-size="25" fill="#211f1a" font-weight="700">Rewrite interview brief</text>
<text x="55" y="170" font-family="Arial, sans-serif" font-size="16" fill="#666258" font-weight="400">Sanity · Engineering Manager</text>
<path d="M55 189H590" stroke="#d8d3c8"/>
<text x="55" y="221" font-family="Arial, sans-serif" font-size="17" fill="#211f1a" font-weight="700">Work to run</text>
<text x="55" y="253" font-family="Arial, sans-serif" font-size="16" fill="#211f1a" font-weight="400">1. Refresh company research</text>
<text x="55" y="278" font-family="Arial, sans-serif" font-size="16" fill="#211f1a" font-weight="400">2. Write a new interview brief</text>
<text x="55" y="322" font-family="Arial, sans-serif" font-size="15" fill="#666258" font-weight="400">Research is outdated; this request includes both steps.</text>
<text x="55" y="366" font-family="Arial, sans-serif" font-size="15" fill="#211f1a" font-weight="700">Model</text>
<rect x="55" y="380" width="270" height="38" rx="7" fill="#fffefa" stroke="#d8d3c8"/>
<text x="67" y="405" font-family="Arial, sans-serif" font-size="14" fill="#211f1a" font-weight="600">Current allowed default ▾</text>
<text x="55" y="453" font-family="Arial, sans-serif" font-size="17" fill="#211f1a" font-weight="700">Inputs</text>
<text x="55" y="482" font-family="Arial, sans-serif" font-size="15" fill="#211f1a" font-weight="400">Saved job description, fit analysis, private notes</text>
<text x="55" y="507" font-family="Arial, sans-serif" font-size="15" fill="#211f1a" font-weight="400">and explicit AI instructions.</text>
<text x="55" y="552" font-family="Arial, sans-serif" font-size="18" fill="#211f1a" font-weight="700">Cost estimate unavailable</text>
<text x="55" y="580" font-family="Arial, sans-serif" font-size="15" fill="#666258" font-weight="400">This action may incur AI and research costs.</text>
<text x="55" y="621" font-family="Arial, sans-serif" font-size="15" fill="#666258" font-weight="400">Previous output stays readable during generation.</text>
<text x="55" y="648" font-family="Arial, sans-serif" font-size="15" fill="#666258" font-weight="400">Describe actual version/publication effects here.</text>
<rect x="55" y="691" width="108" height="38" rx="7" fill="#fffefa" stroke="#d8d3c8"/>
<text x="67" y="716" font-family="Arial, sans-serif" font-size="14" fill="#211f1a" font-weight="600">Cancel</text>
<rect x="184" y="691" width="405" height="38" rx="7" fill="#fff0d4" stroke="#7a4810"/>
<text x="196" y="716" font-family="Arial, sans-serif" font-size="14" fill="#7a4810" font-weight="600">✦  Refresh research &amp; rewrite brief</text>
<text x="650" y="137" font-family="Arial, sans-serif" font-size="14" fill="#666258" font-weight="700">MATERIAL STATES</text>
<rect x="650" y="160" width="520" height="96" rx="8" fill="#faf8f4" stroke="#d8d3c8"/>
<text x="670" y="190" font-family="Arial, sans-serif" font-size="18" fill="#211f1a" font-weight="700">Missing</text>
<text x="670" y="219" font-family="Arial, sans-serif" font-size="14" fill="#666258" font-weight="400">Explain prerequisites; show Generate when eligible.</text>
<rect x="650" y="273" width="520" height="96" rx="8" fill="#faf8f4" stroke="#d8d3c8"/>
<text x="670" y="303" font-family="Arial, sans-serif" font-size="18" fill="#211f1a" font-weight="700">Outdated</text>
<text x="670" y="332" font-family="Arial, sans-serif" font-size="14" fill="#666258" font-weight="400">Keep Open; explain what changed; offer Rewrite.</text>
<rect x="650" y="386" width="520" height="96" rx="8" fill="#faf8f4" stroke="#d8d3c8"/>
<text x="670" y="416" font-family="Arial, sans-serif" font-size="18" fill="#211f1a" font-weight="700">Running</text>
<text x="670" y="445" font-family="Arial, sans-serif" font-size="14" fill="#666258" font-weight="400">Keep Open previous; disable duplicate submissions.</text>
<rect x="650" y="499" width="520" height="96" rx="8" fill="#faf8f4" stroke="#d8d3c8"/>
<text x="670" y="529" font-family="Arial, sans-serif" font-size="18" fill="#211f1a" font-weight="700">Failed</text>
<text x="670" y="558" font-family="Arial, sans-serif" font-size="14" fill="#666258" font-weight="400">Keep output and error context; recover safely.</text>
<rect x="650" y="612" width="520" height="96" rx="8" fill="#faf8f4" stroke="#d8d3c8"/>
<text x="670" y="642" font-family="Arial, sans-serif" font-size="18" fill="#211f1a" font-weight="700">Scope changed</text>
<text x="670" y="671" font-family="Arial, sans-serif" font-size="14" fill="#666258" font-weight="400">Stop submission and ask for a refreshed review.</text>
<rect x="35" y="801" width="28" height="28" rx="14" fill="#155a99" stroke="#155a99"/>
<text x="44" y="821" font-family="Arial, sans-serif" font-size="15" fill="#fff" font-weight="700">1</text>
<text x="75" y="820" font-family="Arial, sans-serif" font-size="17" fill="#211f1a" font-weight="700">Review is not dispatch</text>
<text x="75" y="847" font-family="Arial, sans-serif" font-size="15" fill="#666258" font-weight="400">Opening or cancelling this dialog runs no AI.</text>
<text x="75" y="872" font-family="Arial, sans-serif" font-size="15" fill="#666258" font-weight="400">Use one explicit submit and preserve idempotency.</text>
<rect x="650" y="801" width="28" height="28" rx="14" fill="#155a99" stroke="#155a99"/>
<text x="659" y="821" font-family="Arial, sans-serif" font-size="15" fill="#fff" font-weight="700">2</text>
<text x="690" y="820" font-family="Arial, sans-serif" font-size="17" fill="#211f1a" font-weight="700">No silent expansion</text>
<text x="690" y="847" font-family="Arial, sans-serif" font-size="15" fill="#666258" font-weight="400">Server validates the reviewed scope at submission.</text>
<text x="690" y="872" font-family="Arial, sans-serif" font-size="15" fill="#666258" font-weight="400">Bulk work also locks the reviewed set of roles.</text></svg>
