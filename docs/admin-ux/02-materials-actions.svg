<text x="55" y="376" font-family="Arial, sans-serif" font-size="18" fill="#211f1a" font-weight="700">Interview brief</text>
<text x="55" y="402" font-family="Arial, sans-serif" font-size="14" fill="#666258" font-weight="400">Outdated: research changed · Previous brief remains readable</text>
<text x="635" y="384" font-family="Arial, sans-serif" font-size="15" fill="#155a99" font-weight="600">Open</text>
<text x="725" y="384" font-family="Arial, sans-serif" font-size="15" fill="#155a99" font-weight="600">Versions</text>
<rect x="890" y="358" width="245" height="38" rx="7" fill="#fff0d4" stroke="#7a4810"/>
<text x="902" y="383" font-family="Arial, sans-serif" font-size="14" fill="#7a4810" font-weight="600">✦  Rewrite brief</text>
