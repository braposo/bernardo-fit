<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Materials and action styling</title><desc id="desc">Four outputs with separate blue Open and Versions links and amber sparkle generation buttons. A single cost legend explains the convention.</desc><rect x="0" y="0" width="1200" height="900" rx="0" fill="#f0eee8" stroke="#f0eee8"/>
<text x="30" y="40" font-family="Arial, sans-serif" font-size="26" fill="#211f1a" font-weight="700">02 / Materials: visual action vocabulary</text>
<text x="30" y="69" font-family="Arial, sans-serif" font-size="16" fill="#666258" font-weight="400">No repeated Paid AI labels. Amber + sparkle + an explicit verb identify generation actions.</text>
<rect x="30" y="95" width="1140" height="510" rx="8" fill="#faf8f4" stroke="#d8d3c8"/>
<text x="55" y="133" font-family="Arial, sans-serif" font-size="22" fill="#211f1a" font-weight="700">Sanity / Materials</text>
<text x="55" y="167" font-family="Arial, sans-serif" font-size="15" fill="#7a4810" font-weight="400">✦  Sparkle actions run AI and may incur costs.</text>
<path d="M55 185H1145" stroke="#d8d3c8"/>
<text x="55" y="210" font-family="Arial, sans-serif" font-size="18" fill="#211f1a" font-weight="700">Fit analysis</text>
<text x="55" y="236" font-family="Arial, sans-serif" font-size="14" fill="#666258" font-weight="400">Shareable page · Current</text>
<text x="635" y="218" font-family="Arial, sans-serif" font-size="15" fill="#155a99" font-weight="600">Open</text>
<text x="725" y="218" font-family="Arial, sans-serif" font-size="15" fill="#155a99" font-weight="600">Versions</text>
<rect x="890" y="192" width="245" height="38" rx="7" fill="#fff0d4" stroke="#7a4810"/>
<text x="902" y="217" font-family="Arial, sans-serif" font-size="14" fill="#7a4810" font-weight="600">✦  Regenerate analysis</text>
<path d="M55 256H1145" stroke="#d8d3c8"/>
<text x="55" y="293" font-family="Arial, sans-serif" font-size="18" fill="#211f1a" font-weight="700">Cover letter</text>
<text x="55" y="319" font-family="Arial, sans-serif" font-size="14" fill="#666258" font-weight="400">Saved letter · Current</text>
<text x="635" y="301" font-family="Arial, sans-serif" font-size="15" fill="#155a99" font-weight="600">Open</text>
<text x="725" y="301" font-family="Arial, sans-serif" font-size="15" fill="#155a99" font-weight="600">Versions</text>
<rect x="890" y="275" width="245" height="38" rx="7" fill="#fff0d4" stroke="#7a4810"/>
<text x="902" y="300" font-family="Arial, sans-serif" font-size="14" fill="#7a4810" font-weight="600">✦  Rewrite letter</text>
