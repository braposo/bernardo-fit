<text x="55" y="459" font-family="Arial, sans-serif" font-size="18" fill="#211f1a" font-weight="700">Company research</text>
<text x="55" y="485" font-family="Arial, sans-serif" font-size="14" fill="#666258" font-weight="400">30 sources · Current</text>
<text x="635" y="467" font-family="Arial, sans-serif" font-size="15" fill="#155a99" font-weight="600">Open</text>
<text x="725" y="467" font-family="Arial, sans-serif" font-size="15" fill="#155a99" font-weight="600">Versions</text>
<rect x="890" y="441" width="245" height="38" rx="7" fill="#fff0d4" stroke="#7a4810"/>
<text x="902" y="466" font-family="Arial, sans-serif" font-size="14" fill="#7a4810" font-weight="600">✦  Refresh research</text>
<path d="M55 505H1145" stroke="#d8d3c8"/>
<text x="55" y="552" font-family="Arial, sans-serif" font-size="18" fill="#211f1a" font-weight="700">Application questions</text>
<text x="55" y="578" font-family="Arial, sans-serif" font-size="14" fill="#666258" font-weight="400">Question text, word limits, saved answers and draft actions</text>
<text x="905" y="565" font-family="Arial, sans-serif" font-size="15" fill="#155a99" font-weight="600">Open questions →</text>
<rect x="35" y="640" width="28" height="28" rx="14" fill="#155a99" stroke="#155a99"/>
<text x="44" y="660" font-family="Arial, sans-serif" font-size="15" fill="#fff" font-weight="700">1</text>
<text x="75" y="659" font-family="Arial, sans-serif" font-size="17" fill="#211f1a" font-weight="700">Navigation</text>
<text x="75" y="686" font-family="Arial, sans-serif" font-size="15" fill="#666258" font-weight="400">Blue links open saved content.</text>
<text x="75" y="711" font-family="Arial, sans-serif" font-size="15" fill="#666258" font-weight="400">Opening outdated content is still allowed.</text>
<rect x="435" y="640" width="28" height="28" rx="14" fill="#155a99" stroke="#155a99"/>
<text x="444" y="660" font-family="Arial, sans-serif" font-size="15" fill="#fff" font-weight="700">2</text>
<text x="475" y="659" font-family="Arial, sans-serif" font-size="17" fill="#211f1a" font-weight="700">Editing / utilities</text>
<text x="475" y="686" font-family="Arial, sans-serif" font-size="15" fill="#666258" font-weight="400">Neutral buttons save, copy and edit.</text>
<text x="475" y="711" font-family="Arial, sans-serif" font-size="15" fill="#666258" font-weight="400">Use field-level save feedback.</text>
<rect x="830" y="640" width="28" height="28" rx="14" fill="#155a99" stroke="#155a99"/>
<text x="839" y="660" font-family="Arial, sans-serif" font-size="15" fill="#fff" font-weight="700">3</text>
<text x="870" y="659" font-family="Arial, sans-serif" font-size="17" fill="#211f1a" font-weight="700">Generation</text>
<text x="870" y="686" font-family="Arial, sans-serif" font-size="15" fill="#666258" font-weight="400">Amber actions open a review.</text>
<text x="870" y="711" font-family="Arial, sans-serif" font-size="15" fill="#666258" font-weight="400">Only review submission runs AI.</text>
<text x="75" y="777" font-family="Arial, sans-serif" font-size="15" fill="#155a99" font-weight="600">Open letter →</text>
<rect x="465" y="751" width="155" height="38" rx="7" fill="#fffefa" stroke="#d8d3c8"/>
<text x="477" y="776" font-family="Arial, sans-serif" font-size="14" fill="#211f1a" font-weight="600">Copy fit link</text>
<rect x="870" y="751" width="220" height="38" rx="7" fill="#fff0d4" stroke="#7a4810"/>
<text x="882" y="776" font-family="Arial, sans-serif" font-size="14" fill="#7a4810" font-weight="600">✦  Rewrite letter</text>
<text x="35" y="854" font-family="Arial, sans-serif" font-size="15" fill="#666258" font-weight="400">Stale notices use descriptive neutral text; do not reuse the amber generation treatment for warnings or stage filters.</text></svg>
