<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>bernardo-fit — admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" href="/favicon.svg" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: oklch(0.52 0.14 250);
    --accent-deep: oklch(0.42 0.14 250);
    --good: oklch(0.52 0.11 155);
    --warn: oklch(0.64 0.13 70);
    --weak: oklch(0.54 0.15 25);
    --weak-soft: oklch(0.54 0.15 25 / 0.10);
    --paper: #faf8f4;
    --ink: #211f1a;
    --sub: #78746a;
    --hair: rgba(33, 31, 26, 0.11);
    --hair-strong: rgba(33, 31, 26, 0.2);
    --sans: 'IBM Plex Sans', 'Helvetica Neue', sans-serif;
    --display: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
    --maxw: 1080px;
    --pad: clamp(20px, 5vw, 60px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  .frame { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--pad); }

  .masthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 28px 0 20px; flex-wrap: wrap; }
  .mark { font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .mark .dot { color: var(--accent); }
  .kicker { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--sub); }

  /* Gate */
  .gate { max-width: 360px; margin: 15vh auto 0; text-align: center; }
  .gate h1 { font-family: var(--display); font-size: 26px; font-weight: 600; margin: 0 0 8px; }
  .gate p { color: var(--sub); font-size: 14px; margin: 0 0 22px; }
  input[type="password"] {
    width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--hair-strong);
    padding: 12px 2px; font-family: var(--mono); font-size: 15px; color: var(--ink); text-align: center;
  }
  input[type="password"]:focus { outline: none; border-bottom-color: var(--accent); }
  button {
    appearance: none; border: none; background: var(--ink); color: var(--paper); font-family: var(--sans);
    font-weight: 500; font-size: 14px; padding: 11px 22px; border-radius: 100px; cursor: pointer;
  }
  button:hover { background: var(--accent-deep); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .ghost {
    appearance: none; background: transparent; border: 1px solid var(--hair-strong); color: var(--ink);
    font-family: var(--sans); font-weight: 500; font-size: 12.5px; padding: 7px 14px; border-radius: 100px;
    cursor: pointer; text-decoration: none; display: inline-block; line-height: 1.4;
  }
  .ghost:hover { border-color: var(--accent); color: var(--accent-deep); background: transparent; }
  .danger { color: var(--weak); }
  .danger:hover { border-color: var(--weak); color: var(--weak); }
  .gate .row { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
  .gate .err { color: var(--weak); font-size: 13px; margin-top: 14px; }

  /* Toolbar */
  .toolbar { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 30px 0 22px; flex-wrap: wrap; }
  .toolbar h1 { font-family: var(--display); font-size: clamp(24px, 3.4vw, 32px); font-weight: 600; margin: 0; letter-spacing: -0.02em; }
  .toolbar .count { font-family: var(--mono); font-size: 12px; color: var(--sub); }
  .toolbar .right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

  .searchbox {
    appearance: none; background: transparent; border: 1px solid var(--hair-strong); color: var(--ink);
    font-family: var(--sans); font-size: 13px; padding: 8px 14px; border-radius: 100px; width: 220px;
  }
  .searchbox::placeholder { color: var(--sub); }
  .searchbox:focus { outline: none; border-color: var(--accent); }
  .searchbox::-webkit-search-cancel-button { cursor: pointer; }

  /* Stage filter */
  .stagebar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .stagechip {
    appearance: none; background: transparent; border: 1px solid var(--hair); color: var(--sub);
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 6px 12px; border-radius: 100px; cursor: pointer;
  }
  .stagechip:hover { background: transparent; border-color: var(--hair-strong); color: var(--ink); }
  .stagechip.on { border-color: var(--accent); color: var(--accent-deep); }


  /* Reply-owed banner */

  .adoptbanner {
    display: block; width: 100%; text-align: left; background: transparent; border: 1px dashed var(--hair-strong);
    color: var(--sub); font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.06em;
    padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; cursor: pointer;
  }
  .adoptbanner:hover { border-color: var(--accent); color: var(--accent-deep); background: transparent; }

  /* Job description box */
  .jdbox { margin-top: 12px; }
  .jdbox summary {
    font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--accent); cursor: pointer; list-style: none;
  }
  .jdbox summary::-webkit-details-marker { display: none; }
  .jdbox summary:before { content: "+ "; }
  .jdbox[open] summary:before { content: "- "; }
  textarea.jd {
    width: 100%; margin-top: 10px; background: transparent; border: 1px solid var(--hair);
    border-radius: 8px; padding: 12px 14px; font-family: var(--sans); font-size: 13px; line-height: 1.6;
    color: var(--ink); resize: vertical; min-height: 150px;
  }
  textarea.jd:focus { outline: none; border-color: var(--accent); }

  .insbox summary { color: var(--warn); }
  textarea.ins { min-height: 90px; }

  .qabox summary { color: var(--accent-deep); }
  .qa { border-top: 1px solid var(--hair); padding-top: 12px; margin-top: 12px; }
  .qa:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  textarea.qq { min-height: 52px; }
  .qa-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .qa-bar label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--sub); display: flex; align-items: center; gap: 6px; }
  .qa-bar input[type=number] {
    width: 68px; font-family: var(--mono); font-size: 12px; padding: 4px 6px;
    border: 1px solid var(--hair); border-radius: 6px; background: var(--paper); color: var(--ink);
  }
  .qa-answer {
    margin-top: 10px; padding: 12px 14px; border-radius: 8px; background: var(--weak-soft);
    font-size: 14.5px; line-height: 1.6; white-space: pre-wrap;
  }
  .qa-answer.refused { color: var(--warn); }
  .qa-count { font-family: var(--mono); font-size: 10.5px; color: var(--sub); letter-spacing: 0.08em; }
  .qa-count.over { color: var(--warn); }

  .modelpick {
    display: flex; align-items: center; gap: 8px; font-family: var(--mono);
    font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sub);
  }
  .modelpick select {
    font-family: var(--mono); font-size: 11px; padding: 5px 8px; border-radius: 6px;
    border: 1px solid var(--hair); background: var(--paper); color: var(--ink); cursor: pointer;
  }
  .modelpick select.backup { border-color: var(--sub); color: var(--sub); }
  .modelbadge {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--sub);
  }

  .verbox summary { color: var(--sub); }
  .ver { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 7px 0; border-top: 1px solid var(--hair); font-size: 13px; }
  .ver:first-of-type { border-top: none; }
  .ver .vmeta { font-family: var(--mono); font-size: 11px; color: var(--sub); letter-spacing: 0.04em; }
  .ver .vlive { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--good); }
  .verhead { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--sub); margin: 12px 0 2px; }
  .verhead:first-child { margin-top: 0; }

  /* Rows */
  .row-right { display: flex; align-items: center; gap: 12px; flex: none; }
  .scorebadge {
    font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; cursor: help;
  }
  .scorebadge.tieractnow { color: var(--good); }
  .scorebadge.tierworthalook { color: var(--accent); }
  .scorebadge.tierbackground { color: var(--warn); }
  .scorebadge.tierofftarget { color: var(--sub); opacity: 0.6; }
  .owed {
    margin-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--weak);
    letter-spacing: 0.04em;
  }
  .archnote { margin-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--sub); letter-spacing: 0.04em; }
  .rationale { margin-top: 12px; font-size: 14px; line-height: 1.65; color: var(--ink); max-width: 62ch; }
  /* The analysis was built on a different job description than the row now
     holds. Warn-coloured rather than red: nothing is broken, the score is
     just answering an older question. One line of text that wraps, rather
     than a flex row with its own button: on a narrow screen that broke into
     three ragged pieces, and the row already has a Regenerate button. */
  .stalejd {
    margin-top: 12px; font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.04em; line-height: 1.65; color: var(--warn); max-width: 62ch;
  }
  .stalejd b { font-weight: 600; }
  .staledot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--warn); vertical-align: middle; margin-left: 6px;
  }

  .row-item { border-top: 1px solid var(--hair); padding: 22px 0; }
  .row-item:last-child { border-bottom: 1px solid var(--hair); }
  .row-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .row-title { font-family: var(--display); font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .row-title .company { color: var(--accent); }
  .row-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .titlepen {
    appearance: none; background: none; border: none; cursor: pointer; padding: 0;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--sub); opacity: 0.55; transition: opacity 0.12s;
  }
  .row-item:hover .titlepen, .titlepen:focus { opacity: 1; }
  /* Hover does not exist on a touch screen, so it must never be the only
     thing that reveals a control. */
  @media (hover: none) { .titlepen { opacity: 1; } }
  .titlepen:hover { color: var(--accent); }
  .titleedit { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  /* An author display rule outranks the UA display:none that the hidden
     attribute relies on, so both halves stayed visible. */
  .row-title[hidden], .titleedit[hidden] { display: none; }
  .titleedit input {
    font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
    padding: 3px 8px; border: 1px solid var(--hair-strong); border-radius: 6px;
    background: var(--paper); color: var(--ink); min-width: 150px;
  }
  .titleedit input.co { color: var(--accent); }
  .titleedit input:focus { outline: none; border-color: var(--accent); }
  .titleedit .at { color: var(--sub); font-family: var(--mono); font-size: 11px; }
  .row-meta { font-family: var(--mono); font-size: 11px; color: var(--sub); margin-top: 6px; letter-spacing: 0.02em; line-height: 1.6; }
  .row-jd {
    margin-top: 12px; font-size: 13.5px; line-height: 1.6; color: var(--sub); white-space: pre-wrap;
    max-height: 4.8em; overflow: hidden; cursor: pointer;
  }
  .row-jd.expanded { max-height: none; }
  .row-jd::after {
    content: "show more"; display: block; font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--accent); margin-top: 6px;
  }
  .row-jd.expanded::after { content: "show less"; }
  .row-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
  .row-status { font-family: var(--mono); font-size: 11px; color: var(--sub); }
  .row-status.err { color: var(--weak); }
  .row-status.ok { color: var(--good); }

  /* Stage select */
  select {
    appearance: none; background: transparent; border: 1px solid var(--hair-strong); color: var(--ink);
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 7px 30px 7px 13px; border-radius: 100px; cursor: pointer; flex: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%2378746a' stroke-width='1.5'/></svg>");
    background-repeat: no-repeat; background-position: right 12px center;
  }
  select:focus { outline: none; border-color: var(--accent); }
  .stage-new { color: var(--sub); }
  .stage-reviewing { color: var(--accent-deep); border-color: var(--accent); }
  .stage-applied { color: var(--accent-deep); border-color: var(--accent); }
  .stage-interviewing { color: var(--warn); border-color: var(--warn); }
  .stage-offer { color: var(--good); border-color: var(--good); }
  .stage-expired { color: var(--sub); opacity: 0.65; }

  /* Stats */
  .stats { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: var(--sub); }
  .stats b { font-weight: 500; color: var(--ink); }
  .stats .none { opacity: 0.7; }

  textarea.notes {
    width: 100%; margin-top: 12px; background: transparent; border: 1px solid var(--hair);
    border-radius: 8px; padding: 10px 12px; font-family: var(--sans); font-size: 13px; line-height: 1.55;
    color: var(--ink); resize: vertical; min-height: 54px;
  }
  textarea.notes:focus { outline: none; border-color: var(--accent); }

  .empty { text-align: center; color: var(--sub); padding: 70px 0; font-family: var(--display); font-size: 18px; }
  .empty small { display: block; font-family: var(--sans); font-size: 13.5px; margin-top: 10px; }
  .loadmore { text-align: center; margin: 32px 0 60px; }
  .pagefoot { height: 60px; }
</style>
</head>
<body>
  <div class="frame">
    <div class="masthead">
      <div class="mark">bernardo-fit<span class="dot">.</span></div>
      <div class="kicker">Admin</div>
    </div>
  </div>
  <main id="app"></main>

<script type="module">
import { coverCompletion, coverPhaseText, workCompletion, createRunWatcher } from "./admin-run.js";
(function () {
  "use strict";

  var app = document.getElementById("app");
  var SECRET_KEY = "bfit_admin_secret";
  var secret = sessionStorage.getItem(SECRET_KEY) || "";

  var jobs = [];
  var stages = ["new", "reviewing", "applied", "interviewing", "offer", "rejected", "not_a_fit", "expired"];
  // These archive the row on the server, so they only ever describe archived
  // jobs. Filtering by them in the pipeline view would always come back empty.
  // Which model writes the next analysis, letter or answer. Kept in
  // localStorage so a reload does not quietly send generations back to the
  // default halfway through a comparison.
  var MODELS = [
    { id: "claude-opus-5", label: "Opus" },
    { id: "claude-sonnet-5", label: "Sonnet" }
  ];
  var MODEL_KEY = "fit.model";
  var model = localStorage.getItem(MODEL_KEY) || "claude-opus-5";
  if (!MODELS.some(function (m) { return m.id === model; })) model = "claude-opus-5";
  function modelLabel(id) {
    for (var i = 0; i < MODELS.length; i++) if (MODELS[i].id === id) return MODELS[i].label;
    return "";
  }

  var ARCHIVE_ON_STAGE = ["expired", "not_a_fit", "rejected"];
  var stageFilter = null;
  var searchQuery = "";
  var searchMatches = null;
  var searchRequested = "";
  var searchTimer = null;
  var searchSequence = 0;
  var unlinked = 0;
  var archivedCount = 0;
  var showArchived = false;
  var attachedCoverWatches = {};
  var activeRuns = {};
  var coverDispatchEnabled = true;
  var screenDispatchEnabled = true;

  var reports = [];
  var total = 0;
  var offset = 0;
  var LIMIT = 20;

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function fmtDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }
  function fmtDateTime(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return fmtDate(iso) + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "x-admin-secret": secret }, opts.headers || {});
    return fetch(path, opts)
      .then(function (res) {
        if (res.status === 204) return { ok: res.ok, status: res.status, d: {} };
        return res.json()
          .catch(function () { return { error: "Unexpected response from server." }; })
          .then(function (d) { return { ok: res.ok, status: res.status, d: d }; });
      })
      .catch(function () {
        return { ok: false, status: 0, d: { error: "Network error — check your connection and try again." } };
      });
  }

  // ---------- Work that outlives the connection ----------

  function newRequestId() {
    return (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now()).replace(/-/g, "");
  }

  var watchRun = createRunWatcher({
    request: function (runId) {
      return api("/api/admin/cover?run=" + encodeURIComponent(runId), { method: "GET" });
    }
  });

  function watchCover(id, runId, status, openWhenDone) {
    status.textContent = "Queued…";
    status.className = "row-status";
    return watchRun(runId, function (run) {
      status.textContent = coverPhaseText(run);
    }).then(function (out) {
      var done = coverCompletion(out);
      status.textContent = done.text;
      status.className = "row-status" + (done.tone ? " " + done.tone : "");
      loadJobs(false);
      if (done.open && openWhenDone) openLetter(id);
    });
  }

  function watchWork(id, runId, status, kind, openWhenDone) {
    status.textContent = "Queued…";
    if (status.classList.contains("row-status")) status.className = "row-status";
    return watchRun(runId, function (run) { status.textContent = coverPhaseText(run); }).then(function (out) {
      var done = workCompletion(out);
      status.textContent = done.text;
      if (status.classList.contains("row-status")) status.className = "row-status" + (done.tone ? " " + done.tone : "");
      if (kind !== "answer") loadJobs(false);
      if (done.open && openWhenDone) openArtifact(id, kind === "research" ? "research" : "brief");
      return out;
    });
  }

  function unauthorised(out, firstTry) {
    if (out.status === 401) {
      sessionStorage.removeItem(SECRET_KEY);
      renderGate(firstTry ? "Wrong secret." : "Session expired.");
      return true;
    }
    return false;
  }

  // ---------- Gate ----------

  function renderGate(err) {
    app.innerHTML =
      '<div class="frame"><div class="gate">' +
        "<h1>Locked</h1>" +
        "<p>Enter the admin secret to continue.</p>" +
        '<input type="password" id="secret" placeholder="Admin secret" autofocus />' +
        (err ? '<div class="err">' + esc(err) + "</div>" : "") +
        '<div class="row"><button id="unlock">Unlock</button></div>' +
      "</div></div>";

    var input = document.getElementById("secret");
    function tryUnlock() {
      secret = input.value.trim();
      if (!secret) return;
      loadJobs(true);
    }
    document.getElementById("unlock").addEventListener("click", tryUnlock);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });
  }

  // ---------- Pipeline ----------

  // Extra questions an application form asks. Kept on the row so the whole set
  // can be reread, and so each answer knows what the earlier ones already said.
  // Loaded when the box is opened rather than with the list, since most rows
  // have one version of each and nobody looks at them.
  function versionsHtml(j) {
    var n = j.letterVersionCount != null ? j.letterVersionCount : (j.coverLetterVersions || []).length;
    var label = j.fitReportId || n ? "Versions" : "";
    if (!label) return "";
    return '<details class="jdbox verbox" data-act="verbox">' +
      "<summary>Versions</summary>" +
      '<div class="verlist">Loading…</div>' +
    "</details>";
  }

  function versionRow(v, kind) {
    var bits = [fmtDateTime(v.at), modelLabel(v.model) || v.model];
    if (kind === "letter" && v.words) bits.push(v.words + " words");
    if (kind === "fit" && v.score != null) bits.push("score " + v.score);
    return '<div class="ver">' +
      '<span class="vmeta">' + esc(bits.join(" · ")) + "</span>" +
      (v.active || !v.vid
        ? '<span class="vlive">live</span>'
        : '<button class="ghost" data-act="veruse" data-kind="' + kind + '" data-vid="' + esc(v.vid) + '">Use this</button>') +
    "</div>";
  }

  function questionsHtml(j) {
    var qs = j.questions || [];
    var body = qs.map(function (q) {
      var answered = q.a || q.refused;
      var over = q.a && countWords(q.a) > q.limit;
      return '<div class="qa" data-qid="' + esc(q.id) + '">' +
        '<textarea class="jd qq" data-act="qtext" placeholder="Paste the question from the application form…">' + esc(q.q || "") + '</textarea>' +
        '<div class="qa-bar">' +
          '<label>max <input type="number" data-act="qlimit" min="20" max="500" step="10" value="' + (q.limit || 120) + '"> words</label>' +
          '<button class="ghost" data-act="qdraft">' + (answered ? "Draft again" : "Draft answer") + '</button>' +
          (q.a ? '<button class="ghost" data-act="qcopy">Copy</button>' : "") +
          '<button class="ghost" data-act="qdel">Remove</button>' +
          (q.a ? '<span class="qa-count' + (over ? " over" : "") + '">' + countWords(q.a) + " / " + q.limit + '</span>' : "") +
        '</div>' +
        (q.refused
          ? '<div class="qa-answer refused">Needs you: ' + esc(q.reason || "something my profile does not cover.") + '</div>'
          : q.a ? '<div class="qa-answer">' + esc(q.a) + '</div>' : "") +
      '</div>';
    }).join("");

    var n = qs.filter(function (q) { return q.a; }).length;
    var label = qs.length
      ? "Application questions (" + n + " of " + qs.length + " answered)"
      : "Application questions";
    return '<details class="jdbox qabox"' + (qs.length ? " open" : "") + '>' +
      '<summary>' + label + '</summary>' +
      body +
      '<div class="qa-bar"><button class="ghost" data-act="qadd">Add a question</button></div>' +
    '</details>';
  }

  function countWords(s) {
    return String(s || "").trim().split(/\s+/).filter(Boolean).length;
  }

  function statsHtml(j) {
    if (!j.fitReportId) return "";
    var s = j.stats;
    if (!s || (!s.view && !s.copy_link && !s.cv_download)) {
      return '<div class="stats"><span class="none">No views yet</span></div>';
    }
    var bits = ['<span><b>' + s.view + "</b> view" + (s.view === 1 ? "" : "s") + "</span>"];
    if (s.copy_link) bits.push("<span><b>" + s.copy_link + "</b> link copied</span>");
    if (s.cv_download) bits.push("<span><b>" + s.cv_download + "</b> CV download" + (s.cv_download === 1 ? "" : "s") + "</span>");
    if (s.lastAt) bits.push("<span>last " + fmtDateTime(s.lastAt) + "</span>");
    return '<div class="stats">' + bits.join("") + "</div>";
  }

  // Says what changed and by how much, so the flag can be judged rather than
  // just obeyed. A row whose description grew tenfold is a different case from
  // one that lost its posting and kept a summary, and both show up here.
  function staleHtml(j) {
    if (!j.jd || !j.jd.stale) return "";
    var pct = Math.round(((j.jd.now - j.jd.was) / Math.max(1, j.jd.was)) * 100);
    return '<div class="stalejd"><b>Analysis is out of date.</b> Scored on ' +
      fmtChars(j.jd.was) + ", now " + Number(j.jd.now).toLocaleString() +
      " (" + (pct > 0 ? "+" : "") + pct + "%). Regenerate to rescore.</div>";
  }

  function fmtChars(n) {
    return Number(n || 0).toLocaleString() + " characters";
  }

  function tierClass(t) {
    return "tier-" + String(t || "").toLowerCase().replace(/[^a-z]/g, "");
  }

  function jobHtml(j) {
    var detailed = Object.prototype.hasOwnProperty.call(j, "jobDescription");
    var hasDescription = detailed ? !!j.jobDescription : !!j.hasDescription;
    var hasLetter = !!j.hasCoverLetter;
    var coverActive = !!(j.coverRun && j.coverRun.runId &&
      (j.coverRun.status === "dispatching" || j.coverRun.status === "queued"));
    var screenActive = !!(j.prepareRun && j.prepareRun.runId &&
      (j.prepareRun.status === "dispatching" || j.prepareRun.status === "queued"));
    var fitLink = j.fitReportId ? location.origin + "/?r=" + encodeURIComponent(j.fitReportId) : "";
    var mailLink = j.threadId ? "https://mail.google.com/mail/u/0/#all/" + encodeURIComponent(j.threadId) : "";
    var meta = [];
    if (j.source) meta.push(esc(j.source));
    if (j.location) meta.push(esc(j.location));
    if (j.salary) meta.push(esc(j.salary));
    if (j.userViewed) meta.push("you viewed this");
    if (j.closed) meta.push("posting closed");
    if (j.coverLetterModel) meta.push("letter: " + modelLabel(j.coverLetterModel));
    if (j.researchId) meta.push("research: " + j.researchSourceCount + " sources" + (j.researchStale ? " · stale" : ""));
    if (j.briefId) meta.push("screen brief" + (j.briefStale ? " · stale" : ""));

    var opts = stages.map(function (s) {
      return '<option value="' + s + '"' + (j.stage === s ? " selected" : "") + ">" + s.replace(/_/g, " ") + "</option>";
    }).join("");

    var owed = "";
    if (j.replyOwed && j.recruiter) {
      owed = '<div class="owed">' + esc(j.recruiter.name) +
        " at " + esc(j.recruiter.org) + " has been waiting " +
        (j.recruiter.daysWaiting != null ? j.recruiter.daysWaiting + " days" : "a while") + "</div>";
    } else if (j.replyOwed) {
      owed = '<div class="owed">Reply owed</div>';
    }

    var detailHtml = detailed
      ? '<details class="jdbox">' +
          "<summary>" + (j.jobDescription ? "Job description" : "Add a job description to enable analysis") +
            (j.jd && j.jd.stale ? '<span class="staledot" title="Changed since the analysis was generated"></span>' : "") +
          "</summary>" +
          '<textarea class="jd" data-act="jd" placeholder="Paste the job description here…">' + esc(j.jobDescription || "") + "</textarea>" +
        "</details>" +
        '<details class="jdbox insbox"' + (j.instructions ? " open" : "") + ">" +
          "<summary>" + (j.instructions ? "Instructions for generation" : "Add instructions for generation") + "</summary>" +
          '<textarea class="jd ins" data-act="instructions" placeholder="Steer the analysis and the letter for this role. What to emphasise, context from a call, an angle to take.">' + esc(j.instructions || "") + "</textarea>" +
        "</details>" + versionsHtml(j) + questionsHtml(j) +
        '<textarea class="notes" data-act="notes" placeholder="Notes…">' + esc(j.notes || "") + "</textarea>"
      : '<div class="row-actions"><button class="ghost" data-act="detail">Open details' +
          ((j.questionCount || j.hasNotes || j.hasInstructions) ? " · " + [j.questionCount ? j.questionCount + " question" + (j.questionCount === 1 ? "" : "s") : "", j.hasNotes ? "notes" : "", j.hasInstructions ? "instructions" : ""].filter(Boolean).join(" · ") : "") +
        "</button></div>";

    return (
      '<div class="row-item" data-id="' + esc(j.id) + '">' +
        '<div class="row-head">' +
          "<div>" +
            '<div class="row-title" data-act="titleview">' + esc(j.role || "Untitled role") +
              (j.company ? ' <span class="company">at ' + esc(j.company) + "</span>" : ' <span class="company">no company</span>') +
              '<button class="titlepen" data-act="edittitle" title="Edit role and company">edit</button>' +
            "</div>" +
            '<div class="titleedit" data-act="titleform" hidden>' +
              '<input data-act="erole" value="' + esc(j.role || "") + '" placeholder="Role" />' +
              '<span class="at">at</span>' +
              '<input class="co" data-act="ecompany" value="' + esc(j.company || "") + '" placeholder="Company" />' +
            "</div>" +
            '<div class="row-meta">' + meta.join(" · ") + "</div>" +
          "</div>" +
          '<div class="row-right">' +
            (j.score != null
              ? '<span class="scorebadge ' + tierClass(j.tier) + '" title="' +
                (j.scoreBreakdown
                  ? "location " + j.scoreBreakdown.location + " · AI/DX " + j.scoreBreakdown.aiDx + " · leadership " + j.scoreBreakdown.leadership
                  : "") + '">' + j.score + "</span>"
              : "") +
            '<select data-act="stage" class="stage-' + esc(j.stage) + '">' + opts + "</select>" +
          "</div>" +
        "</div>" +
        (j.archived
          ? '<div class="archnote">Archived' + (j.archivedAt ? ' ' + fmtDate(j.archivedAt) : '') +
            (j.fitReportId ? '. The fit page still works for anyone holding the link.' : '.') + '</div>'
          : '') +
        owed +
        (j.rationale ? '<div class="rationale">' + esc(j.rationale) + "</div>" : "") +
        staleHtml(j) +
        statsHtml(j) +
        detailHtml +
        '<div class="row-actions">' +
          (fitLink
            ? '<a class="ghost" href="' + esc(fitLink) + '" target="_blank" rel="noopener">View fit page</a>' +
              '<button class="ghost" data-act="copyfit" data-link="' + esc(fitLink) + '">Copy fit link</button>' +
              '<button class="ghost" data-act="regen">Regenerate</button>' +
              '<button class="ghost" data-act="cover"' + (coverActive || !coverDispatchEnabled ? " disabled" : "") +
                (!coverDispatchEnabled ? ' title="Cover generation is paused"' : "") + '>' +
                (!coverDispatchEnabled ? "Cover paused" : coverActive ? "Writing…" : hasLetter ? "Cover letter" : "Write cover letter") + '</button>'
              + '<button class="ghost" data-act="screen"' + (screenActive || !screenDispatchEnabled ? " disabled" : "") + '>' +
                (!screenDispatchEnabled ? "Screen prep paused" : screenActive ? "Preparing…" : j.hasBrief && !j.briefStale ? "Open brief" : "Prepare screen") + '</button>' +
              (j.hasBrief ? '<button class="ghost" data-act="briefrewrite">Rewrite brief</button>' : "") +
              (j.hasResearch ? '<button class="ghost" data-act="researchopen">Inspect research</button><button class="ghost" data-act="researchrefresh">Refresh research</button>' : "")
            : '<button class="ghost" data-act="runfit"' + (hasDescription ? "" : " disabled") + ">Generate fit analysis</button>") +
          (j.sourceUrl ? '<a class="ghost" href="' + esc(j.sourceUrl) + '" target="_blank" rel="noopener">View posting</a>' : "") +
          (mailLink ? '<a class="ghost" href="' + esc(mailLink) + '" target="_blank" rel="noopener">Open email</a>' : "") +
          (j.archived
            ? '<button class="ghost" data-act="restore">Restore to pipeline</button>' +
              '<button class="ghost danger" data-act="delete">Delete permanently</button>'
            : '<button class="ghost" data-act="archive">Archive</button>') +
          '<span class="row-status"></span>' +
        "</div>" +
      "</div>"
    );
  }

  // Everything a search term is allowed to hit. Job descriptions are included
  // so searching a technology finds roles that mention it, not just ones with
  // it in the title.
  function haystack(j) {
    return [
      j.company, j.role, j.source, j.location, j.locationMode, j.salary,
      j.notes, j.rationale, j.jobDescription, j.tier, j.stage,
      j.recruiter && j.recruiter.name, j.recruiter && j.recruiter.org,
    ].filter(Boolean).join(" ").toLowerCase();
  }

  // Splits a query into terms, keeping "quoted phrases" whole. Without this,
  // searching design system matches any row with "design" and "systems" in
  // separate sentences, which is most of them.
  function searchTerms(q) {
    var terms = [];
    var re = /"([^"]*)"|(\S+)/g;
    var m;
    while ((m = re.exec(q)) !== null) {
      var t = (m[1] !== undefined ? m[1] : m[2]).trim();
      if (t) terms.push(t);
    }
    return terms;
  }

  // Every term has to appear somewhere, so "remote ai" narrows rather than
  // widens, and "design system" in quotes matches the phrase.
  function matchesSearch(j, q) {
    if (!q) return true;
    var hay = haystack(j);
    return searchTerms(q).every(function (term) { return hay.indexOf(term) !== -1; });
  }

  // The list response deliberately omits descriptions and notes. Search those
  // fields on the server and return IDs only, keeping the normal response small.
  function applySearch() {
    var q = searchQuery.trim().toLowerCase();
    if (!q) {
      searchMatches = null;
      searchRequested = "";
      searchSequence++;
      if (searchTimer) clearTimeout(searchTimer);
    } else if (searchRequested !== q) {
      if (searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        var requested = q;
        var sequence = ++searchSequence;
        searchRequested = requested;
        var prefix = showArchived ? "?archived=1&" : "?";
        api("/api/admin/jobs" + prefix + "q=" + encodeURIComponent(requested), { method: "GET" }).then(function (out) {
          if (sequence !== searchSequence || requested !== searchQuery.trim().toLowerCase()) return;
          if (unauthorised(out) || !out.ok) return;
          searchMatches = new Set(out.d.matchingIds || []);
          paintSearch();
        });
      }, 180);
    }
    paintSearch();
  }

  function paintSearch() {
    var q = searchQuery.trim().toLowerCase();
    var visible = 0;
    Array.prototype.forEach.call(document.querySelectorAll(".row-item"), function (el) {
      var j = jobs.find(function (x) { return x.id === el.getAttribute("data-id"); });
      var hit = !q || searchMatches === null || !j || searchMatches.has(j.id);
      el.style.display = hit ? "" : "none";
      if (hit) visible++;
    });

    var countEl = document.querySelector(".toolbar .count");
    if (countEl) {
      countEl.textContent = q
        ? visible + " matching of " + jobs.length
        : countEl.getAttribute("data-base") || countEl.textContent;
    }

    var none = document.getElementById("nomatches");
    if (none) none.style.display = q && searchMatches !== null && visible === 0 ? "" : "none";
  }

  // Opens an already-written letter in a new tab, fetching a fresh
  // short-lived token first so the secret never travels in a URL.
  function openLetter(id) {
    api("/api/admin/jobs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "letter-token", id: id }),
    }).then(function (out) {
      if (unauthorised(out)) return;
      if (!out.ok) { alert(out.d.error || "Could not open the letter."); return; }
      window.open("/letter?j=" + encodeURIComponent(id) + "&t=" + encodeURIComponent(out.d.token) + "&print=1", "_blank", "noopener");
    });
  }

  function openArtifact(id, kind) {
    api("/api/admin/jobs", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "artifact-token", kind: kind, id: id }),
    }).then(function (out) {
      if (unauthorised(out)) return;
      if (!out.ok) { alert(out.d.error || "Could not open this artifact."); return; }
      window.open("/brief?kind=" + encodeURIComponent(kind) + "&j=" + encodeURIComponent(id) + "&t=" + encodeURIComponent(out.d.token), "_blank", "noopener");
    });
  }

  function renderJobs() {
    if (!showArchived && ARCHIVE_ON_STAGE.indexOf(stageFilter) !== -1) stageFilter = null;
    var counts = {};
    stages.forEach(function (s) { counts[s] = 0; });
    jobs.forEach(function (j) { if (counts[j.stage] != null) counts[j.stage]++; });


    var shown = jobs.filter(function (j) {
      if (stageFilter && j.stage !== stageFilter) return false;
      return true;
    });
    // Best fit first; anything unscored sinks to the bottom.
    shown.sort(function (a, b) { return (b.score == null ? -1 : b.score) - (a.score == null ? -1 : a.score); });

    var filtering = stageFilter;
    var pendingAnalysis = jobs.filter(function (j) { return !j.fitReportId && j.hasDescription; }).length;

    var html = '<div class="frame">' +
      '<div class="toolbar">' +
        '<h1>' + (showArchived ? 'Archived' : 'Pipeline') + '</h1>' +
        '<div class="right">' +
          '<input type="search" id="search" class="searchbox" placeholder="Search roles…" ' +
            'value="' + esc(searchQuery) + '" autocomplete="off" spellcheck="false" />' +
          '<span class="count" data-base="' + esc(shown.length + (filtering ? " shown of " : " of ") + jobs.length) + '">' +
            shown.length + (filtering ? " shown of " : " of ") + jobs.length + "</span>" +
          '<span class="modelpick">model' +
            '<select id="modelsel" class="' + (model === "claude-sonnet-5" ? "backup" : "") + '">' +
              MODELS.map(function (m) {
                return '<option value="' + m.id + '"' + (model === m.id ? " selected" : "") + ">" + m.label + "</option>";
              }).join("") +
            "</select></span>" +
          (!showArchived && pendingAnalysis
            ? '<button class="ghost" id="analyseall">' + (activeRuns["analyse-all"] ? "Analysing…" : "Analyse all (" + pendingAnalysis + ")") + '</button>'
            : '') +

          (archivedCount || showArchived
            ? '<button class="ghost" id="togglearchived">' +
              (showArchived ? 'Back to pipeline' : 'Archived (' + archivedCount + ')') + '</button>'
            : '') +
        "</div>" +
      "</div>";

    if (unlinked) {
      html += '<button class="adoptbanner" id="adopt">' + unlinked + " saved analys" +
        (unlinked === 1 ? "is is" : "es are") + " not in the pipeline yet · click to add" + "</button>";
    }

    html += '<div class="stagebar">' +
        '<button class="stagechip' + (stageFilter ? "" : " on") + '" data-stage="">All stages</button>' +
        stages.filter(function (s) { return showArchived || ARCHIVE_ON_STAGE.indexOf(s) === -1; }).map(function (s) {
          return '<button class="stagechip' + (stageFilter === s ? " on" : "") + '" data-stage="' + s + '">' +
            s.replace(/_/g, " ") + " " + counts[s] + "</button>";
        }).join("") +
      "</div>";

    if (!jobs.length) {
      html += showArchived
        ? '<div class="empty">Nothing archived.</div>'
        : '<div class="empty">No opportunities yet.<small>The weekly inbox review adds them here, and anything analysed on the site shows up too.</small></div>';
    } else if (!shown.length) {
      html += '<div class="empty">Nothing matches these filters.</div>';
    } else {
      html += shown.map(jobHtml).join("") +
        '<div class="empty" id="nomatches" style="display:none">Nothing matches that search.</div>';
    }
    html += '<div class="pagefoot"></div></div>';
    app.innerHTML = html;


    var adoptBtn = document.getElementById("adopt");
    if (adoptBtn) {
      adoptBtn.addEventListener("click", function () {
        adoptBtn.disabled = true; adoptBtn.textContent = "Adding…";
        api("/api/admin/cover", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kind: "adopt", requestId: newRequestId() }),
        }).then(function (out) {
          if (unauthorised(out)) return;
          if (!out.ok) { alert(out.d.error || "Failed."); adoptBtn.disabled = false; return; }
          activeRuns.adopt = { runId: out.d.runId };
          watchWork("batch", out.d.runId, adoptBtn, "adopt", false).then(function () { activeRuns.adopt = null; });
        });
      });
    }

    var analyseAllBtn = document.getElementById("analyseall");
    if (analyseAllBtn) {
      analyseAllBtn.disabled = !!activeRuns["analyse-all"];
      analyseAllBtn.addEventListener("click", function () {
        analyseAllBtn.disabled = true; analyseAllBtn.textContent = "Dispatching…";
        api("/api/admin/cover", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kind: "analyse-all", model: model, requestId: newRequestId() }),
        }).then(function (out) {
          if (unauthorised(out)) return;
          if (!out.ok) { analyseAllBtn.disabled = false; analyseAllBtn.textContent = out.d.error || "Could not start."; return; }
          activeRuns["analyse-all"] = { runId: out.d.runId };
          watchWork("batch", out.d.runId, analyseAllBtn, "analyse-all", false).then(function () { activeRuns["analyse-all"] = null; });
        });
      });
    }

    ["analyse-all", "adopt"].forEach(function (kind) {
      var active = activeRuns[kind];
      var target = kind === "analyse-all" ? analyseAllBtn : adoptBtn;
      if (!active || !active.runId || !target || attachedCoverWatches[active.runId]) return;
      attachedCoverWatches[active.runId] = true;
      target.disabled = true;
      watchWork("batch", active.runId, target, kind, false).then(function () { activeRuns[kind] = null; });
    });

    var searchEl = document.getElementById("search");
    if (searchEl) {
      searchEl.addEventListener("input", function () {
        searchQuery = searchEl.value;
        applySearch();
      });
      searchEl.addEventListener("keydown", function (e) {
        if (e.key === "Escape") { searchEl.value = ""; searchQuery = ""; applySearch(); }
      });
    }

    var modelSel = document.getElementById("modelsel");
    if (modelSel) modelSel.addEventListener("change", function () {
      model = modelSel.value;
      localStorage.setItem(MODEL_KEY, model);
      modelSel.className = model === "claude-sonnet-5" ? "backup" : "";
    });

    var archToggle = document.getElementById("togglearchived");
    if (archToggle) {
      archToggle.addEventListener("click", function () {
        showArchived = !showArchived;
        stageFilter = null;
        loadJobs(false);
      });
    }

    Array.prototype.forEach.call(document.querySelectorAll(".stagechip"), function (chip) {
      chip.addEventListener("click", function () {
        stageFilter = chip.getAttribute("data-stage") || null;
        renderJobs();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll(".row-jd"), function (el) {
      el.addEventListener("click", function () { el.classList.toggle("expanded"); });
    });

    Array.prototype.forEach.call(document.querySelectorAll(".row-item"), function (rowEl) {
      var id = rowEl.getAttribute("data-id");
      var status = rowEl.querySelector(".row-status");
      var job = jobs.find(function (j) { return j.id === id; });

      if (job.coverRun && job.coverRun.runId &&
          (job.coverRun.status === "dispatching" || job.coverRun.status === "queued") &&
          !attachedCoverWatches[job.coverRun.runId]) {
        attachedCoverWatches[job.coverRun.runId] = true;
        watchCover(id, job.coverRun.runId, status, false).then(function () {
          delete attachedCoverWatches[job.coverRun.runId];
        });
      }
      if (job.prepareRun && job.prepareRun.runId &&
          (job.prepareRun.status === "dispatching" || job.prepareRun.status === "queued") &&
          !attachedCoverWatches[job.prepareRun.runId]) {
        attachedCoverWatches[job.prepareRun.runId] = true;
        watchWork(id, job.prepareRun.runId, status, "prepare-screen", false).then(function () {
          delete attachedCoverWatches[job.prepareRun.runId];
        });
      }
      if (job.analysisRun && job.analysisRun.runId &&
          (job.analysisRun.status === "dispatching" || job.analysisRun.status === "queued") &&
          !attachedCoverWatches[job.analysisRun.runId]) {
        attachedCoverWatches[job.analysisRun.runId] = true;
        watchWork(id, job.analysisRun.runId, status, "analyse", false).then(function () {
          delete attachedCoverWatches[job.analysisRun.runId];
        });
      }
      (job.answerRuns || []).forEach(function (answerRun) {
        if (attachedCoverWatches[answerRun.run.runId]) return;
        attachedCoverWatches[answerRun.run.runId] = true;
        watchWork(id, answerRun.run.runId, status, "answer", false).then(function () {
          delete attachedCoverWatches[answerRun.run.runId];
          loadJobs(false);
        });
      });

      function patch(body, onDone) {
        api("/api/admin/jobs?id=" + encodeURIComponent(id), {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        }).then(function (out) {
          if (unauthorised(out)) return;
          if (!out.ok) { status.textContent = out.d.error || "Save failed."; status.className = "row-status err"; return; }
          var i = jobs.findIndex(function (j) { return j.id === id; });
          if (i !== -1) jobs[i] = Object.assign({}, jobs[i], out.d.job);
          if (onDone) onDone(out.d.job);
        });
      }

      var detailBtn = rowEl.querySelector('[data-act="detail"]');
      if (detailBtn) detailBtn.addEventListener("click", function () {
        detailBtn.disabled = true;
        detailBtn.textContent = "Loading…";
        api("/api/admin/jobs?id=" + encodeURIComponent(id), { method: "GET" }).then(function (out) {
          if (unauthorised(out)) return;
          if (!out.ok) {
            detailBtn.disabled = false;
            detailBtn.textContent = out.d.error || "Could not load details.";
            return;
          }
          var i = jobs.findIndex(function (j) { return j.id === id; });
          if (i !== -1) jobs[i] = Object.assign({}, jobs[i], out.d.job);
          renderJobs();
        });
      });

      var sel = rowEl.querySelector('[data-act="stage"]');
      sel.addEventListener("change", function () {
        var next = sel.value;
        sel.className = "stage-" + next;
        status.textContent = "Saving…"; status.className = "row-status";
        patch({ stage: next }, function () {
          status.textContent = "Saved"; status.className = "row-status ok";
          // Either the row just left the pipeline, in which case the list and
          // the archived count both need refetching, or only the chip counts
          // changed and a re-render is enough.
          var left = ARCHIVE_ON_STAGE.indexOf(next) !== -1 && !showArchived;
          setTimeout(left ? function () { loadJobs(false); } : renderJobs, 700);
        });
      });

      // ---- application questions ----
      function saveQuestion(edit, done) {
        status.textContent = "Saving…"; status.className = "row-status";
        patch({ question: edit }, function () {
          status.textContent = ""; 
          if (done) done();
        });
      }

      var qadd = rowEl.querySelector('[data-act="qadd"]');
      if (qadd) {
        qadd.addEventListener("click", function () {
          saveQuestion({ id: Math.random().toString(36).slice(2, 10), q: "", limit: 120 }, renderJobs);
        });
      }

      [].forEach.call(rowEl.querySelectorAll(".qa"), function (qEl) {
        var qid = qEl.getAttribute("data-qid");
        var text = qEl.querySelector('[data-act="qtext"]');
        var lim = qEl.querySelector('[data-act="qlimit"]');
        var savedQuestion = (job.questions || []).filter(function (q) { return q.id === qid; })[0];
        if (savedQuestion && savedQuestion.run && savedQuestion.run.runId &&
            (savedQuestion.run.status === "dispatching" || savedQuestion.run.status === "queued") &&
            !attachedCoverWatches[savedQuestion.run.runId]) {
          attachedCoverWatches[savedQuestion.run.runId] = true;
          watchWork(id, savedQuestion.run.runId, status, "answer", false).then(function () {
            delete attachedCoverWatches[savedQuestion.run.runId];
            api("/api/admin/jobs?id=" + encodeURIComponent(id), { method: "GET" }).then(function (out) {
              if (!out.ok) return;
              var index = jobs.findIndex(function (j) { return j.id === id; });
              if (index !== -1) jobs[index] = Object.assign({}, jobs[index], out.d.job);
              renderJobs();
            });
          });
        }

        // Saved on blur, like the other free-text fields on the row.
        function currentEdit() {
          return { id: qid, q: text.value, limit: parseInt(lim.value, 10) || 120 };
        }
        function persist() { saveQuestion(currentEdit()); }
        if (text) text.addEventListener("blur", persist);
        if (lim) lim.addEventListener("change", persist);

        var del = qEl.querySelector('[data-act="qdel"]');
        if (del) del.addEventListener("click", function () {
          if (text.value.trim() && !confirm("Remove this question and its answer?")) return;
          saveQuestion({ id: qid, remove: true }, function () {
            var qElIndex = (job.questions || []).findIndex(function (q) { return q.id === qid; });
            if (qElIndex !== -1) job.questions.splice(qElIndex, 1);
            renderJobs();
          });
        });

        var copy = qEl.querySelector('[data-act="qcopy"]');
        if (copy) copy.addEventListener("click", function () {
          var a = (qEl.querySelector(".qa-answer") || {}).textContent || "";
          navigator.clipboard.writeText(a).then(function () {
            copy.textContent = "Copied"; setTimeout(function () { copy.textContent = "Copy"; }, 1400);
          });
        });

        var draft = qEl.querySelector('[data-act="qdraft"]');
        if (draft) draft.addEventListener("click", function () {
          if (!text.value.trim()) {
            status.textContent = "Write the question first."; status.className = "row-status err";
            return;
          }
          draft.disabled = true;
          status.textContent = "Drafting…"; status.className = "row-status";
          // Persist the question text first, so the server answers what is on screen.
          patch({ question: currentEdit() }, function () {
            var requestId = newRequestId();
            api("/api/admin/cover", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: id, kind: "answer", questionId: qid, model: model, requestId: requestId }),
            }).then(function (out) {
              if (unauthorised(out)) return;
              if (!out.ok) { draft.disabled = false; status.textContent = out.d.error || "Could not draft it."; status.className = "row-status err"; return null; }
              return watchWork(id, out.d.runId, status, "answer", false);
            }).then(function (out) {
              draft.disabled = false;
              if (!out || !out.ok || out.d.status !== "COMPLETED" || out.d.result?.outcome !== "completed") return;
              api("/api/admin/jobs?id=" + encodeURIComponent(id), { method: "GET" }).then(function (detail) {
                if (!detail.ok) return;
                var i = jobs.findIndex(function (j) { return j.id === id; });
                if (i !== -1) jobs[i] = Object.assign({}, jobs[i], detail.d.job);
                renderJobs();
              });
            });
          });
        });
      });

      // ---- role and company ----
      // The inbox scan does not always find a company name, and a job can be
      // retitled after a conversation, so both are editable here. The PATCH
      // endpoint already accepted them; there was just no way in.
      var titleView = rowEl.querySelector('[data-act="titleview"]');
      var titleForm = rowEl.querySelector('[data-act="titleform"]');
      if (titleView && titleForm) {
        var eRole = titleForm.querySelector('[data-act="erole"]');
        var eCompany = titleForm.querySelector('[data-act="ecompany"]');
        var closing = false;

        function openTitle() {
          titleView.hidden = true;
          titleForm.hidden = false;
          eRole.focus();
          eRole.select();
        }
        function closeTitle() {
          titleForm.hidden = true;
          titleView.hidden = false;
        }
        function saveTitle() {
          // Blur fires when moving between the two inputs, so only save once
          // focus has actually left the pair.
          if (closing) return;
          closing = true;
          setTimeout(function () {
            closing = false;
            if (titleForm.contains(document.activeElement)) return;
            var role = eRole.value.trim();
            var company = eCompany.value.trim();
            if (role === (job.role || "") && company === (job.company || "")) { closeTitle(); return; }
            status.textContent = "Saving…"; status.className = "row-status";
            patch({ role: role, company: company }, function () {
              status.textContent = "Saved"; status.className = "row-status ok";
              loadJobs(false);
            });
          }, 0);
        }

        rowEl.querySelector('[data-act="edittitle"]').addEventListener("click", openTitle);
        [eRole, eCompany].forEach(function (el) {
          el.addEventListener("blur", saveTitle);
          el.addEventListener("keydown", function (e) {
            if (e.key === "Enter") { e.preventDefault(); el.blur(); }
            if (e.key === "Escape") {
              eRole.value = job.role || "";
              eCompany.value = job.company || "";
              closeTitle();
            }
          });
        });
      }

      // ---- versions ----
      var verBox = rowEl.querySelector('[data-act="verbox"]');
      if (verBox) {
        var verList = verBox.querySelector(".verlist");
        var loaded = false;
        function paintVersions(d) {
          var html = "";
          if ((d.fit || []).length) {
            html += '<div class="verhead">Fit analysis</div>' +
              d.fit.map(function (v) { return versionRow(v, "fit"); }).join("");
          }
          if ((d.letter || []).length) {
            html += '<div class="verhead">Cover letter</div>' +
              d.letter.map(function (v) { return versionRow(v, "letter"); }).join("");
          }
          verList.innerHTML = html || '<div class="ver"><span class="vmeta">Nothing generated yet.</span></div>';
          wireUse();
        }
        function loadVersions() {
          api("/api/admin/versions?id=" + encodeURIComponent(id), { method: "GET" }).then(function (out) {
            if (unauthorised(out)) return;
            if (!out.ok) { verList.textContent = out.d.error || "Could not load versions."; return; }
            loaded = true;
            paintVersions(out.d);
          });
        }
        function wireUse() {
          [].forEach.call(verList.querySelectorAll('[data-act="veruse"]'), function (btn) {
            btn.addEventListener("click", function () {
              btn.disabled = true;
              status.textContent = "Switching…"; status.className = "row-status";
              api("/api/admin/versions", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: id, kind: btn.getAttribute("data-kind"), vid: btn.getAttribute("data-vid") }),
              }).then(function (out) {
                if (unauthorised(out)) return;
                if (!out.ok) {
                  btn.disabled = false;
                  status.textContent = out.d.error || "Could not switch."; status.className = "row-status err";
                  return;
                }
                status.textContent = "Switched"; status.className = "row-status ok";
                loadVersions();
                loadJobs(false);
              });
            });
          });
        }
        verBox.addEventListener("toggle", function () {
          if (verBox.open && !loaded) loadVersions();
        });
      }

      var ins = rowEl.querySelector('[data-act="instructions"]');
      if (ins) {
        ins.addEventListener("blur", function () {
          if (job && ins.value === (job.instructions || "")) return;
          status.textContent = "Saving…"; status.className = "row-status";
          patch({ instructions: ins.value }, function () {
            // Saving alone changes nothing already generated, so say so.
            status.textContent = job && job.fitReportId
              ? "Saved. Regenerate to apply."
              : "Instructions saved";
            status.className = "row-status ok";
            setTimeout(function () { status.textContent = ""; }, 2600);
          });
        });
      }

      var notes = rowEl.querySelector('[data-act="notes"]');
      if (notes) notes.addEventListener("blur", function () {
        if (job && notes.value === (job.notes || "")) return;
        status.textContent = "Saving…"; status.className = "row-status";
        patch({ notes: notes.value }, function () {
          status.textContent = "Notes saved"; status.className = "row-status ok";
          setTimeout(function () { status.textContent = ""; }, 1600);
        });
      });

      var copyFit = rowEl.querySelector('[data-act="copyfit"]');
      if (copyFit) {
        copyFit.addEventListener("click", function () {
          navigator.clipboard.writeText(copyFit.getAttribute("data-link")).then(function () {
            copyFit.textContent = "Copied";
            setTimeout(function () { copyFit.textContent = "Copy fit link"; }, 1600);
          });
        });
      }

      // Job description is editable, so an alert-only row can be given one and
      // then analysed without leaving the page.
      var jd = rowEl.querySelector('[data-act="jd"]');
      if (jd) jd.addEventListener("blur", function () {
        if (job && jd.value === (job.jobDescription || "")) return;
        status.textContent = "Saving…"; status.className = "row-status";
        patch({ jobDescription: jd.value }, function () {
          status.textContent = "Description saved"; status.className = "row-status ok";
          if (runFit) runFit.disabled = jd.value.trim().length < 20;
          setTimeout(function () { status.textContent = ""; }, 1600);
        });
      });

      var runFit = rowEl.querySelector('[data-act="runfit"]');
      if (runFit) {
        runFit.addEventListener("click", function () {
          var text = jd ? (jd.value || "").trim() : "";
          if (jd && text.length < 20) {
            status.textContent = "Add a fuller job description first."; status.className = "row-status err";
            return;
          }
          runFit.disabled = true;
          status.textContent = "Running analysis…"; status.className = "row-status";
          // If details are open, save the text first. Compact rows already have
          // their description stored and can start without downloading it.
          function analyse() {
            var requestId = newRequestId();
            api("/api/admin/cover", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: id, kind: "analyse", model: model, requestId: requestId }),
            }).then(function (out) {
              if (unauthorised(out)) return;
              if (!out.ok) {
                runFit.disabled = false;
                status.textContent = out.d.error || "Analysis failed.";
                status.className = "row-status err";
                return;
              }
              watchWork(id, out.d.runId, status, "analyse", false).then(function () { runFit.disabled = false; });
            });
          }
          if (jd) patch({ jobDescription: text }, analyse);
          else analyse();
        });
      }

      var coverBtn = rowEl.querySelector('[data-act="cover"]');
      if (coverBtn) {
        coverBtn.addEventListener("click", function () {
          var had = !!(job.coverLetter || job.hasCoverLetter);
          if (had && !confirm("Rewrite the cover letter for this role?")) {
            // Already have one and not rewriting: just open it.
            openLetter(id);
            return;
          }
          coverBtn.disabled = true;
          status.textContent = "Dispatching…"; status.className = "row-status";
          var requestId = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now()).replace(/-/g, "");
          function dispatch(attempt) {
            api("/api/admin/cover", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: id, model: model, requestId: requestId }),
            }).then(function (out) {
              if (out.status === 0 && attempt === 0) {
                status.textContent = "Connection dropped. Recovering dispatch…";
                setTimeout(function () { dispatch(1); }, 1000);
                return;
              }
              if (unauthorised(out)) return;
              if (!out.ok) {
                coverBtn.disabled = false;
                status.textContent = out.d.error || "Could not start it.";
                status.className = "row-status err";
                return;
              }
              watchCover(id, out.d.runId, status, true);
            });
          }
          dispatch(0);
        });
      }

      function dispatchScreen(kind, forceResearch, openKind) {
        status.textContent = "Dispatching…"; status.className = "row-status";
        var requestId = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now()).replace(/-/g, "");
        api("/api/admin/cover", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: id, kind: kind, model: model, requestId: requestId, forceResearch: !!forceResearch }),
        }).then(function (out) {
          if (unauthorised(out)) return;
          if (!out.ok) { status.textContent = out.d.error || "Could not start it."; status.className = "row-status err"; return; }
          watchWork(id, out.d.runId, status, kind, true);
        });
      }
      var screenBtn = rowEl.querySelector('[data-act="screen"]');
      if (screenBtn) screenBtn.addEventListener("click", function () {
        if (job.hasBrief && !job.briefStale) openArtifact(id, "brief");
        else { screenBtn.disabled = true; dispatchScreen("prepare-screen", false, "brief"); }
      });
      var rewriteBrief = rowEl.querySelector('[data-act="briefrewrite"]');
      if (rewriteBrief) rewriteBrief.addEventListener("click", function () {
        rewriteBrief.disabled = true;
        dispatchScreen(job.researchStale ? "prepare-screen" : "brief", false, "brief");
      });
      var researchOpen = rowEl.querySelector('[data-act="researchopen"]');
      if (researchOpen) researchOpen.addEventListener("click", function () { openArtifact(id, "research"); });
      var researchRefresh = rowEl.querySelector('[data-act="researchrefresh"]');
      if (researchRefresh) researchRefresh.addEventListener("click", function () { researchRefresh.disabled = true; dispatchScreen("research", true, "research"); });

      var regen = rowEl.querySelector('[data-act="regen"]');
      if (regen) {
        regen.addEventListener("click", function () {
          regen.disabled = true;
          status.textContent = "Regenerating…"; status.className = "row-status";
          var requestId = newRequestId();
          api("/api/admin/cover", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: id, reportId: job.fitReportId, kind: "regenerate", model: model, requestId: requestId }),
          }).then(function (out) {
            if (unauthorised(out)) return;
            if (!out.ok) { regen.disabled = false; status.textContent = out.d.error || "Regenerate failed."; status.className = "row-status err"; return; }
            watchWork(id, out.d.runId, status, "regenerate", false).then(function () { regen.disabled = false; });
          });
        });
      }

      var archiveBtn = rowEl.querySelector('[data-act="archive"]');
      if (archiveBtn) {
        archiveBtn.addEventListener("click", function () {
          status.textContent = "Archiving…"; status.className = "row-status";
          patch({ archived: true }, function () { loadJobs(false); });
        });
      }

      var restoreBtn = rowEl.querySelector('[data-act="restore"]');
      if (restoreBtn) {
        restoreBtn.addEventListener("click", function () {
          status.textContent = "Restoring…"; status.className = "row-status";
          patch({ archived: false }, function () { loadJobs(false); });
        });
      }

      var deleteBtn = rowEl.querySelector('[data-act="delete"]');
      if (deleteBtn) {
        deleteBtn.addEventListener("click", function () {
          var what = (job.role || "this row") + (job.company ? " at " + job.company : "");
          if (!confirm("Delete " + what + " for good?\n\nThe row and its notes go. The fit page itself stays up, so any link you already shared keeps working.")) return;
          status.textContent = "Deleting…"; status.className = "row-status";
          api("/api/admin/jobs?id=" + encodeURIComponent(id), { method: "DELETE" }).then(function (out) {
            if (unauthorised(out)) return;
            if (!out.ok) { status.textContent = out.d.error || "Delete failed."; status.className = "row-status err"; return; }
            loadJobs(false);
          });
        });
      }
    });

    // Re-apply the search after any re-render, so a filter change or a saved
    // edit doesn't quietly bring hidden rows back.
    applySearch();
  }

  function loadJobs(firstTry) {
    api("/api/admin/jobs" + (showArchived ? "?archived=1" : ""), { method: "GET" }).then(function (out) {
      if (unauthorised(out, firstTry)) return;
      if (!out.ok) { renderGate(out.d && out.d.error ? out.d.error : "Something went wrong."); return; }
      sessionStorage.setItem(SECRET_KEY, secret);
      jobs = out.d.jobs || [];
      if (out.d.stages && out.d.stages.length) stages = out.d.stages;
      if (out.d.models && out.d.models.length) MODELS = out.d.models;
      if (out.d.archiveOnStage) ARCHIVE_ON_STAGE = out.d.archiveOnStage;
      coverDispatchEnabled = !out.d.features || out.d.features.coverDispatchEnabled !== false;
      screenDispatchEnabled = !out.d.features || out.d.features.screenDispatchEnabled !== false;
      if (!MODELS.some(function (m) { return m.id === model; })) model = MODELS[0].id;
      unlinked = out.d.unlinked || 0;
      archivedCount = out.d.archivedCount || 0;
      activeRuns = out.d.activeRuns || {};
      renderJobs();
    });
  }

  // '/' focuses the search from anywhere, the way it works everywhere else.
  document.addEventListener("keydown", function (e) {
    if (e.key !== "/" || e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target || {};
    var tag = (t.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || t.isContentEditable) return;
    var el = document.getElementById("search");
    if (el) { e.preventDefault(); el.focus(); el.select(); }
  });

  if (secret) loadJobs(true);
  else renderGate();
})();
</script>
</body>
</html>
