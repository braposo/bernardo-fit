  function jevAssessmentHtml(j) {
    var a = j.jevAssessment || { dimensions: [['Responsibilities fit',25],['Evidence of capability',25],['Seniority and scope',20],['Career direction',20],['Practical compatibility',10]].map(function (d) { return { label: d[0], weight: d[1], score: null, confidence: null }; }) };
    var reasons = [];
    if (a.provisional && !j.jevStale) {
      var posting = a.posting || {};
      if (posting.choice === 'partial') reasons.push('The job description has too little detail to assess fully.');
      else if (posting.choice === 'inaccessible') reasons.push('The job description was inaccessible.');
      else if (posting.choice === 'unrelated') reasons.push('The supplied content was not a job description.');
      else if (posting.probabilities && posting.probabilities.complete < 0.8) reasons.push('It is uncertain whether the job description is complete.');
      (a.dimensions || []).forEach(function (d) {
        if (d.evidenceLimited) reasons.push(d.label + ': ' + (d.evidenceNote || 'More role detail is needed to assess this area confidently.'));
      });
      if (!reasons.length) reasons.push('The available role information does not fully support this assessment.');
    }
    return '<h2>Fit assessment</h2>' + (a.assessedAt ? '<p class="field-help">' + esc(fmtDateTime(a.assessedAt)) + '</p>' : '') +
      (j.jevStale ? '<p class="field-help">Outdated · reassess fit</p>' : '') +
      (reasons.length ? '<div class="assessment-warning"><strong>Why this score is provisional</strong><ul>' + reasons.map(function (reason) { return '<li>' + esc(reason) + '</li>'; }).join('') + '</ul></div>' : '') +
      '<div class="score-gauges jev-gauges">' + a.dimensions.map(function (d) {
        return '<div class="assessment-dimension"><div data-score-gauge="' + esc(d.label) + '" data-value="' + (d.score == null ? '' : esc(d.score)) + '" data-weight="' + esc(d.weight) + '"></div>' + (j.jevAssessment ? '<p class="field-help" title="Confidence in the assessment, not the chance of an offer">' +
          (j.jevStale ? 'Outdated' : d.confidence == null ? 'Confidence unavailable' : 'Model confidence: ' + Math.round(d.confidence * 100) + '%') + '</p>' : '') + '</div>';
      }).join('') + '</div>';
  }

  function openGenerationReview(options) {
    options = options || {};
    if (actionBusy(options.id, options.kind, options.questionId)) return;
    if (hasPendingEdits(options.id)) {
      notifyAdmin('Save pending edits in Role & context before reviewing generation. Failed saves can be retried by leaving the field again.');
      return;
    }
    var dialog = createAdminDialog({
      title: 'Review generation', description: options.subject || 'Confirm what to generate.', className: 'review-dialog',
      content: '<div class="review-body" data-review-body aria-live="polite">Checking current inputs and scope…</div>' +
        '<div class="review-actions"><button class="ghost" type="button" data-review-cancel>Cancel</button><button class="generation" type="button" data-review-submit disabled>Reviewing…</button></div>'
    });
    var currentReview = null;
    var versionInstructions = '';
    var instructionsTimer;
    var supportsVersionInstructions = ['cover','analyse','regenerate','research','brief','prepare-screen'].indexOf(options.kind) !== -1;
    var submitting = false;
    var requestId = newRequestId();
    var loadingSequence = 0;
    var submit = dialog.querySelector('[data-review-submit]');
    var bodyEl = dialog.querySelector('[data-review-body]');

    function requestBody() {
      var modelEl = dialog.querySelector('[data-review-model]');
      var economyEl = dialog.querySelector('[data-review-economy]');
      return { action: 'review', id: options.id, kind: options.kind, reportId: options.reportId,
        jobIds: options.jobIds,
        questionId: options.questionId, forceResearch: options.forceResearch === true,
        versionInstructions: supportsVersionInstructions ? versionInstructions : undefined,
        model: modelEl ? modelEl.value : model, economy: economyEl ? economyEl.checked : economyAnswers };
    }
    function paintReview(review) {
      var active = document.activeElement;
      var restoreInstructions = active && active.hasAttribute('data-version-instructions');
      var caret = restoreInstructions ? [active.selectionStart, active.selectionEnd] : null;
      currentReview = review;
      if (options.kind !== 'jev-score' && options.kind !== 'jev-score-all') { model = review.model; localStorage.setItem(MODEL_KEY, model); }
      var models = MODELS.map(function (item) { return '<option value="' + esc(item.id) + '"' + (item.id === review.model ? ' selected' : '') + '>' + esc(item.label) + '</option>'; }).join('');
      var jobsHtml = review.jobs && review.jobs.length ? '<div class="review-jobs">' + review.jobs.map(function (item) {
        return '<div><strong>' + esc(item.company || 'No company') + '</strong> · ' + esc(item.role || 'Untitled role') + '</div>'; }).join('') + '</div>' : '';
      renderAdmin(bodyEl, '<p class="review-description">' + esc(review.description || 'We’ll generate the requested content using your saved details.') + '</p>' +
        jobsHtml + (options.kind === 'jev-score' || options.kind === 'jev-score-all' || review.routing && review.routing.source === 'jev' ? '' : '<h3><label for="review-model">Model</label></h3><select id="review-model" class="review-model" data-review-model>' + models + '</select>') +
        (options.kind === 'answer' ? '<label class="field-help"><input type="checkbox" data-review-economy' + (economyAnswers ? ' checked' : '') + '> Use the economy path for routine answers when possible</label>' : '') +
        (supportsVersionInstructions ? '<label class="version-instructions-label" for="version-instructions">Instructions for this version <span>(optional)</span></label><textarea id="version-instructions" data-version-instructions maxlength="4000" placeholder="Add to this job’s generic instructions for this version only…">'+esc(versionInstructions)+'</textarea>' : ''));
      var instructionsEl = dialog.querySelector('[data-version-instructions]');
      if (instructionsEl) {
        if (restoreInstructions) { instructionsEl.focus(); instructionsEl.setSelectionRange(caret[0], caret[1]); }
        instructionsEl.addEventListener('input', function() {
          versionInstructions = instructionsEl.value; requestId = newRequestId();
          currentReview = null; submit.disabled = true; setButtonLabel(submit, 'Reviewing…');
          ++loadingSequence; clearTimeout(instructionsTimer);
          instructionsTimer = setTimeout(loadReview, 350);
        });
      }
      submit.disabled = false; setButtonLabel(submit, review.submitLabel);
      var modelEl = dialog.querySelector('[data-review-model]');
      if (modelEl) modelEl.addEventListener('change', function () { model = modelEl.value; requestId = newRequestId(); loadReview(); });
      var economyEl = dialog.querySelector('[data-review-economy]');
      if (economyEl) economyEl.addEventListener('change', function () { economyAnswers = economyEl.checked; localStorage.setItem('fit.economyAnswers', String(economyAnswers)); loadReview(); });
    }
    function loadReview() {
      clearTimeout(instructionsTimer);
      var sequence = ++loadingSequence;
      submit.disabled = true; setButtonLabel(submit, 'Reviewing…'); currentReview = null;
      api('/api/admin/cover', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestBody()) }).then(function (out) {
        if (sequence !== loadingSequence || !dialog.isConnected) return;
        if (unauthorised(out)) { dialog.close(); return; }
        if (!out.ok) { renderAdmin(bodyEl, '<div class="notice error">' + esc(out.d.error || 'Could not prepare this review.') + '</div>'); setButtonLabel(submit, 'Unavailable'); return; }
        paintReview(out.d.review);
      });
    }
    function close() { clearTimeout(instructionsTimer); dialog.close(); }
    dialog.querySelector('[data-review-cancel]').addEventListener('click', close);
    submit.addEventListener('click', function () {
      if (!currentReview || submitting || !beginAction(options.id, currentReview.effectiveKind, options.questionId)) return;
      submitting = true;
      dialog.querySelectorAll('select, input, textarea, [data-review-economy], [data-review-cancel]').forEach(function (control) { control.disabled = true; });
      submit.disabled = true; setButtonLabel(submit, 'Starting…');
      var req = requestBody();
      req.action = undefined; req.kind = currentReview.effectiveKind; req.reviewFingerprint = currentReview.fingerprint; req.requestId = requestId;
      api('/api/admin/cover', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(req) }).then(function (out) {
        submitting = false;
        dialog.querySelectorAll('select, input, textarea, [data-review-economy], [data-review-cancel]').forEach(function (control) { control.disabled = false; });
        if (out.status === 401) { failAction(options.id, currentReview.effectiveKind, options.questionId, "Session expired. Sign in again."); unauthorised(out); close(); return; }
        if (!out.ok) {
          failAction(options.id, currentReview.effectiveKind, options.questionId, out.d.error || "Could not start generation.");
          if (out.status === 409 && out.d.code === 'REVIEW_STALE') {
            showAdminError(bodyEl, 'The inputs or scope changed. Review the refreshed scope before submitting.');
            requestId = newRequestId(); loadReview(); return;
          }
          submit.disabled = false; setButtonLabel(submit, currentReview.submitLabel);
          showAdminError(bodyEl, out.d.error || 'Could not start generation.'); return;
        }
        close();
        if (options.status) { options.status.textContent = 'Queued…'; options.status.className = 'row-status'; }
        if (currentReview.effectiveKind === 'cover') watchCover(options.id, out.d.runId, options.status, false);
        else {
          var watched = watchWork(options.id || 'batch', out.d.runId, options.status || options.trigger, currentReview.effectiveKind, false, options.questionId);
          if (currentReview.effectiveKind === 'answer') watched.then(function () {
            api('/api/admin/jobs?id=' + encodeURIComponent(options.id), { method: 'GET' }).then(function (detail) {
              if (!detail.ok) return;
              var index = jobs.findIndex(function (item) { return item.id === options.id; });
              if (index !== -1) jobs[index] = Object.assign({}, jobs[index], detail.d.job);
              renderJobs();
            });
          });
        }
      });
    });
    dialog.querySelector('[data-review-cancel]').focus();
    loadReview();
  }

  function renderJobs(workspaceOnly) {

    var counts = {};

    Array.prototype.forEach.call(workspaceOnly ? [] : document.querySelectorAll('[data-select-job]'), function (button) {
      button.addEventListener('click', function () {
        var nextId = button.getAttribute('data-select-job');
        if (nextId === selectedId) return;
        rememberPipelineScroll(); selectedId = nextId; selectedMissing = false;
        writeNavigation('push', { admin: true, selectedFromList: true }); renderJobs(true); loadSelectedDetail(selectedId);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-section-link]'), function (button) {
      button.addEventListener('click', function () {
        workspaceSection = button.getAttribute('data-section-link'); versionGroup = button.getAttribute('data-version-group') || "";
        writeNavigation('push'); renderJobs(true);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-return-list], [data-act="back"]'), function (button) {
      button.addEventListener('click', function () {
        suppressAutoSelect = true;
        selectedId = ""; writeNavigation('push'); renderJobs(true); restorePipelineScroll();
      });
    });
    var clearSearch = workspaceOnly ? null : document.querySelector('[data-clear-search]');
    if (clearSearch) clearSearch.addEventListener('click', function () { searchQuery = ""; searchMatches = null; writeNavigation('push'); renderJobs(); });
    var allStages = workspaceOnly ? null : document.querySelector('[data-all-stages]');
    if (allStages) allStages.addEventListener('click', function () { stageFilter = null; writeNavigation('push'); renderJobs(); });

    var listing = document.querySelector('.listing-link');
    if (listing) listing.addEventListener('click', function() { recordJobAction(selectedId,'listing_opened'); });
    var activityTarget = document.querySelector('[data-job-activity]');
    if (activityTarget) loadJobActivity(activityTarget, selectedId);

    var selectedSummary = jobs.find(function (j) { return j.id === selectedId; });
    if (selectedId && !selectedMissing && (!selectedSummary || !Object.prototype.hasOwnProperty.call(selectedSummary, 'jobDescription'))) {
      loadSelectedDetail(selectedId);
    }

    Array.prototype.forEach.call(document.querySelectorAll(".row-jd"), function (el) {
      el.addEventListener("click", function () { el.classList.toggle("expanded"); });
    });

    Array.prototype.forEach.call(document.querySelectorAll(".row-item"), function (rowEl) {
      var id = rowEl.getAttribute("data-id");
      var status = rowEl.querySelector(".row-status");
      var job = jobs.find(function (j) { return j.id === id; });

      if (job.coverRun && job.coverRun.runId &&
          (job.coverRun.status === "dispatching" || job.coverRun.status === "queued") &&
          !attachedCoverWatches[job.coverRun.runId]) {
        attachedCoverWatches[job.coverRun.runId] = true;
        recoverWork(id, job.coverRun.runId, status, 'cover', false).then(function () {
          delete attachedCoverWatches[job.coverRun.runId];
        });
      }
      if (job.prepareRun && job.prepareRun.runId &&
          (job.prepareRun.status === "dispatching" || job.prepareRun.status === "queued") &&
          !attachedCoverWatches[job.prepareRun.runId]) {
        attachedCoverWatches[job.prepareRun.runId] = true;
        recoverWork(id, job.prepareRun.runId, status, "prepare-screen", false).then(function () {
          delete attachedCoverWatches[job.prepareRun.runId];
        });
      }
      if (job.analysisRun && job.analysisRun.runId &&
          (job.analysisRun.status === "dispatching" || job.analysisRun.status === "queued") &&
          !attachedCoverWatches[job.analysisRun.runId]) {
        attachedCoverWatches[job.analysisRun.runId] = true;
        recoverWork(id, job.analysisRun.runId, status, "analyse", false).then(function () {
          delete attachedCoverWatches[job.analysisRun.runId];
        });
      }
      (job.answerRuns || []).forEach(function (answerRun) {
        if (attachedCoverWatches[answerRun.run.runId]) return;
        attachedCoverWatches[answerRun.run.runId] = true;
        recoverWork(id, answerRun.run.runId, status, "answer", false, answerRun.questionId).then(function () {
          delete attachedCoverWatches[answerRun.run.runId];
          loadJobs(false);
        });
      });

      function patch(body, onDone, onError) {
        api("/api/admin/jobs?id=" + encodeURIComponent(id), {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        }).then(function (out) {
          if (unauthorised(out)) return;
          if (!out.ok) { status.textContent = out.d.error || "Save failed."; status.className = "row-status err"; if (onError) onError(); return; }
          var i = jobs.findIndex(function (j) { return j.id === id; });
          if (i !== -1) jobs[i] = Object.assign({}, jobs[i], out.d.job);
          if (onDone) onDone(out.d.job);
        });
      }
      [['researchRun', 'research'], ['briefRun', 'brief'], ['jevRun', 'jev-score']].forEach(function (entry) {
        var run = job[entry[0]];
        if (!run || !run.runId || ['dispatching', 'queued'].indexOf(run.status) === -1 || attachedCoverWatches[run.runId]) return;
        attachedCoverWatches[run.runId] = true;
        recoverWork(id, run.runId, status, entry[1], false).then(function () { delete attachedCoverWatches[run.runId]; });
      });

      var fieldSaveSeq = {};
      Array.prototype.forEach.call(rowEl.querySelectorAll('[data-field]'), function (input) {
        var draftField = input.getAttribute('data-field');
        var key = draftKey(id, draftField);
        var savedDraft = fieldDrafts.get(key);
        var liveFeedback = rowEl.querySelector('[data-save-for="' + draftField + '"]');
        if (liveFeedback) liveFeedback.setAttribute('role', 'status');
        if (savedDraft) {
          input.value = savedDraft.value;
          if (liveFeedback) liveFeedback.textContent = savedDraft.message || 'Unsaved changes';
        }
        input.addEventListener('input', function () {
          fieldDrafts.set(key, { value: input.value, message: 'Unsaved changes' });
          if (liveFeedback) liveFeedback.textContent = 'Unsaved changes';
        });
        input.addEventListener('blur', function () {
          var field = input.getAttribute('data-field');
          var value = input.value;
          if (value === String(job[field] || '')) return;
          var draft = { value: value, message: 'Saving…' };
          fieldDrafts.set(key, draft);
          var feedback = rowEl.querySelector('[data-save-for="' + field + '"]');
          var sequence = (fieldSaveSeq[field] || 0) + 1; fieldSaveSeq[field] = sequence;
          if (feedback) { feedback.textContent = 'Saving…'; feedback.className = 'field-status'; }
          api('/api/admin/jobs?id=' + encodeURIComponent(id), { method: 'PATCH', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.fromEntries([[field, value]])) }).then(function (out) {
            if (unauthorised(out) || fieldSaveSeq[field] !== sequence) return;
            if (!out.ok) {
              draft.message = "Couldn't save. Leave this field again to retry.";
              if (feedback) { feedback.textContent = (out.d && out.d.error) || "Couldn't save. Your draft is still here; leave the field again to retry."; feedback.className = 'field-status err'; }
              return;
            }
            var index = jobs.findIndex(function (item) { return item.id === id; });
            if (index !== -1) jobs[index] = Object.assign({}, jobs[index], out.d.job);
            job = jobs[index] || job;
            if (fieldDrafts.get(key) === draft) fieldDrafts.delete(key);
            if (feedback) feedback.textContent = input.value === value ? 'Saved' : 'Saved earlier edit; newer text is not saved yet.';
          });
        });
      });

      var detailBtn = rowEl.querySelector('[data-act="detail"]');
      if (detailBtn) detailBtn.addEventListener("click", function () {
        detailBtn.disabled = true;
        detailBtn.textContent = "Loading…";
        api("/api/admin/jobs?id=" + encodeURIComponent(id), { method: "GET" }).then(function (out) {
          if (unauthorised(out)) return;
          if (!out.ok) {
            detailBtn.disabled = false;
            detailBtn.textContent = out.d.error || "Could not load details.";
            return;
          }
          var i = jobs.findIndex(function (j) { return j.id === id; });
          if (i !== -1) jobs[i] = Object.assign({}, jobs[i], out.d.job);
          renderJobs();
        });
      });

      var sel = rowEl.querySelector('[data-act="stage"]');
      document.onAdminStage = function (next) {
        status.textContent = "Saving…"; status.className = "row-status";
        patch({ stage: next }, function () {
          status.textContent = "Saved"; status.className = "row-status ok";
          // Either the row just left the pipeline, in which case the list and
          // the archived count both need refetching, or only the chip counts
          // changed and a re-render is enough.
          var left = ARCHIVE_ON_STAGE.indexOf(next) !== -1 && !showArchived;
          setTimeout(left ? function () { loadJobs(false); } : renderJobs, 700);
        });
      };

      // ---- application questions ----
      function saveQuestion(edit, done) {
        status.textContent = "Saving…"; status.className = "row-status";
        patch({ question: edit }, function () {
          status.textContent = "";
          if (done) done();
        });
      }

      var qadd = rowEl.querySelector('[data-act="qadd"]');
      if (qadd) {
        qadd.addEventListener("click", function () {
          saveQuestion({ id: Math.random().toString(36).slice(2, 10), q: "", limit: 120 }, renderJobs);
        });
      }

      [].forEach.call(rowEl.querySelectorAll(".qa"), function (qEl) {
        var qid = qEl.getAttribute("data-qid");
        var text = qEl.querySelector('[data-act="qtext"]');
        var lim = qEl.querySelector('[data-act="qlimit"]');
        var savedQuestion = (job.questions || []).filter(function (q) { return q.id === qid; })[0];
        if (savedQuestion && savedQuestion.run && savedQuestion.run.runId &&
            (savedQuestion.run.status === "dispatching" || savedQuestion.run.status === "queued") &&
            !attachedCoverWatches[savedQuestion.run.runId]) {
          attachedCoverWatches[savedQuestion.run.runId] = true;
          recoverWork(id, savedQuestion.run.runId, status, "answer", false, qid).then(function () {
            delete attachedCoverWatches[savedQuestion.run.runId];
            api("/api/admin/jobs?id=" + encodeURIComponent(id), { method: "GET" }).then(function (out) {
              if (!out.ok) return;
              var index = jobs.findIndex(function (j) { return j.id === id; });
              if (index !== -1) jobs[index] = Object.assign({}, jobs[index], out.d.job);
              renderJobs();
            });
          });
        }

        // Saved on blur, like the other free-text fields on the row.
        function currentEdit() {
          return { id: qid, q: text.value, limit: parseInt(lim.value, 10) || 120 };
        }
        var questionKey = draftKey(id, 'question-' + qid);
        var questionDraft = fieldDrafts.get(questionKey);
        if (questionDraft) { text.value = questionDraft.value.q; lim.value = questionDraft.value.limit; }
        var questionStatus = document.createElement('div');
        questionStatus.className = 'field-status'; questionStatus.setAttribute('role', 'status');
        questionStatus.textContent = questionDraft ? questionDraft.message : '';
        qEl.appendChild(questionStatus);
        function rememberQuestion() {
          fieldDrafts.set(questionKey, { value: currentEdit(), message: 'Unsaved question changes' });
          questionStatus.textContent = 'Unsaved question changes';
        }
        text.addEventListener('input', rememberQuestion);
        lim.addEventListener('input', rememberQuestion);
        function persist(done) {
          var draft = { value: currentEdit(), message: 'Saving…' };
          fieldDrafts.set(questionKey, draft); questionStatus.textContent = draft.message;
          patch({ question: draft.value }, function () {
            if (fieldDrafts.get(questionKey) === draft) {
              fieldDrafts.delete(questionKey); questionStatus.textContent = 'Saved';
            }
            if (typeof done === 'function') done();
          }, function () {
            draft.message = "Couldn't save. Leave the question again to retry.";
            questionStatus.textContent = draft.message;
          });
        }
        if (text) text.addEventListener("blur", persist);
        if (lim) lim.addEventListener("change", persist);

        var del = qEl.querySelector('[data-act="qdel"]');
        if (del) del.addEventListener("click", async function () {
          if (text.value.trim() && !await confirmAdmin({ title: 'Remove question?', description: 'This removes the question and its saved answer.', confirmLabel: 'Remove question', destructive: true })) return;
          saveQuestion({ id: qid, remove: true }, function () {
            fieldDrafts.delete(questionKey);
            var qElIndex = (job.questions || []).findIndex(function (q) { return q.id === qid; });
            if (qElIndex !== -1) job.questions.splice(qElIndex, 1);
            renderJobs();
          });
        });

        var copy = qEl.querySelector('[data-act="qcopy"]');
        if (copy) copy.addEventListener("click", function () {
          var a = (qEl.querySelector(".qa-answer") || {}).textContent || "";
          navigator.clipboard.writeText(a).then(function () {
            recordJobAction(id,"answer_copied");
            copy.textContent = "Copied"; setTimeout(function () { copy.textContent = "Copy"; }, 1400);
          });
        });

        var draft = qEl.querySelector('[data-act="qdraft"]');
        if (draft) draft.addEventListener("click", function () {
          if (!text.value.trim()) {
            status.textContent = "Write the question first."; status.className = "row-status err";
            return;
          }
          // Persist the question text first, so the server answers what is on screen.
          persist(function () {
            openGenerationReview({ id: id, kind: 'answer', questionId: qid, trigger: draft, status: status,
              subject: (job.company || 'No company') + ' · ' + (job.role || 'Untitled role') });
          });
        });
      });

      // ---- role and company ----
      // The inbox scan does not always find a company name, and a job can be
      // retitled after a conversation, so both are editable here. The PATCH
      // endpoint already accepted them; there was just no way in.
      var titleView = rowEl.querySelector('[data-act="titleview"]');
      var titleForm = rowEl.querySelector('[data-act="titleform"]');
      if (titleView && titleForm) {
        var eRole = titleForm.querySelector('[data-act="erole"]');
        var eCompany = titleForm.querySelector('[data-act="ecompany"]');
        var closing = false;

        function openTitle() {
          titleView.hidden = true;
          titleForm.hidden = false;
          eRole.focus();
          eRole.select();
        }
        function closeTitle() {
          titleForm.hidden = true;
          titleView.hidden = false;
        }
        function saveTitle() {
          // Blur fires when moving between the two inputs, so only save once
          // focus has actually left the pair.
          if (closing) return;
          closing = true;
          setTimeout(function () {
            closing = false;
            if (titleForm.contains(document.activeElement)) return;
            var role = eRole.value.trim();
            var company = eCompany.value.trim();
            if (role === (job.role || "") && company === (job.company || "")) { closeTitle(); return; }
            status.textContent = "Saving…"; status.className = "row-status";
            patch({ role: role, company: company }, function () {
              status.textContent = "Saved"; status.className = "row-status ok";
              loadJobs(false);
            });
          }, 0);
        }

        rowEl.querySelector('[data-act="edittitle"]').addEventListener("click", openTitle);
        [eRole, eCompany].forEach(function (el) {
          el.addEventListener("blur", saveTitle);
          el.addEventListener("keydown", function (e) {
            if (e.key === "Enter") { e.preventDefault(); el.blur(); }
            if (e.key === "Escape") {
              eRole.value = job.role || "";
              eCompany.value = job.company || "";
              closeTitle();
            }
          });
        });
      }

      // ---- versions ----
      var verBox = rowEl.querySelector('[data-act="verbox"]');
      if (verBox) {
        var verList = verBox;
        var loaded = false;
        function paintVersions(d) {
          ['fit','letter','brief','research'].forEach(function(kind) {
            var versions=d[kind]||[], list=verBox.querySelector('.verlist[data-kind="'+kind+'"]');
            if(!list) return;
            renderAdmin(list,versions.length?versions.map(function(v,i){return versionRow(v,kind,versions.length-i);}).join(''):'<p class="field-help">No saved versions yet.</p>');
            var live=versions.find(function(v){return v.active;}), current=live||versions[0];
            var summary=verBox.querySelector('[data-summary="'+kind+'"]'), label=verBox.querySelector('[data-live="'+kind+'"]');
            verBox.querySelector('[data-count="'+kind+'"]').textContent=versions.length;
            label.textContent=live?'Live · v'+(versions.length-versions.indexOf(live)):current?'Saved':'Not created';
            if(current) renderAdmin(summary,'<div class="version-summary"><strong>Version '+(versions.length-versions.indexOf(current))+'</strong><span>'+esc(modelLabel(current.model)||current.model||'Model not recorded')+'</span></div><p class="document-age">'+timeHtml(current.at,'Created ')+'</p><p class="field-help">'+(kind==='fit'?'Shareable fit page':'Private document')+'</p>');
          });
          wireUse();
        }
        function loadVersions() {
          api("/api/admin/versions?id=" + encodeURIComponent(id), { method: "GET" }).then(function (out) {
            if (!rowEl.isConnected || unauthorised(out)) return;
            if (!out.ok) { verList.querySelectorAll(".verlist").forEach(function(el){el.textContent=out.d.error || "Could not load versions. Reopen Documents to retry.";}); return; }
            loaded = true;
            paintVersions(out.d);
          });
        }
        function wireUse() {
          [].forEach.call(verList.querySelectorAll('[data-act="verpreview"]'), function (btn) {
            btn.addEventListener('click', function () {
              var preview = btn.parentElement.querySelector('.vpreview');
              preview.hidden = !preview.hidden;
              btn.textContent = preview.hidden ? 'Preview content' : 'Hide preview';
              btn.setAttribute('aria-expanded', String(!preview.hidden));
              if (preview.hidden || preview.dataset.loaded) return;
              preview.textContent = 'Loading version…';
              api('/api/admin/versions?id=' + encodeURIComponent(id) + '&kind=' + encodeURIComponent(btn.getAttribute('data-kind')) +
                '&vid=' + encodeURIComponent(btn.getAttribute('data-vid')), { method: 'GET' }).then(function (out) {
                if (unauthorised(out)) return;
                if (!out.ok) { preview.textContent = out.d.error || 'Could not load version. Close and reopen to retry.'; return; }
                renderAdmin(preview, previewHtml(out.d.content)); preview.dataset.loaded = 'true';
              });
            });
          });
          [].forEach.call(verList.querySelectorAll('[data-act="veruse"]'), function (btn) {
            btn.addEventListener("click", function () {
              btn.disabled = true;
              status.textContent = "Switching…"; status.className = "row-status";
              api("/api/admin/versions", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: id, kind: btn.getAttribute("data-kind"), vid: btn.getAttribute("data-vid") }),
              }).then(function (out) {
                if (unauthorised(out)) return;
                if (!out.ok) {
                  btn.disabled = false;
                  status.textContent = out.d.error || "Could not switch."; status.className = "row-status err";
                  return;
                }
                status.textContent = "Switched"; status.className = "row-status ok";
                loadJobs(false);
              });
            });
          });
        }
        if (!loaded) loadVersions();
      }

      var ins = rowEl.querySelector('[data-act="instructions"]');
      if (ins) {
        ins.addEventListener("blur", function () {
          if (job && ins.value === (job.instructions || "")) return;
          status.textContent = "Saving…"; status.className = "row-status";
          patch({ instructions: ins.value }, function () {
            // Saving alone changes nothing already generated, so say so.
            status.textContent = job && job.fitReportId
              ? "Saved. Regenerate to apply."
              : "Instructions saved";
            status.className = "row-status ok";
            setTimeout(function () { status.textContent = ""; }, 2600);
          });
        });
      }

      var notes = rowEl.querySelector('[data-act="notes"]');
      if (notes) notes.addEventListener("blur", function () {
        if (job && notes.value === (job.notes || "")) return;
        status.textContent = "Saving…"; status.className = "row-status";
        patch({ notes: notes.value }, function () {
          status.textContent = "Notes saved"; status.className = "row-status ok";
          setTimeout(function () { status.textContent = ""; }, 1600);
        });
      });

      var copyFit = rowEl.querySelector('[data-act="copyfit"]');
      if (copyFit) {
        copyFit.addEventListener("click", function () {
          navigator.clipboard.writeText(copyFit.getAttribute("data-link")).then(function () {
            recordJobAction(id,"fit_link_copied");
            copyFit.textContent = "Copied";
            setTimeout(function () { copyFit.textContent = "Copy fit link"; }, 1600);
          });
        });
      }

      // Job description is editable, so an alert-only row can be given one and
      // then analysed without leaving the page.
      var jd = rowEl.querySelector('[data-act="jd"]');
      if (jd) jd.addEventListener("blur", function () {
        if (job && jd.value === (job.jobDescription || "")) return;
        status.textContent = "Saving…"; status.className = "row-status";
        patch({ jobDescription: jd.value }, function () {
          status.textContent = "Description saved"; status.className = "row-status ok";
          if (runFit) runFit.disabled = jd.value.trim().length < 20;
          setTimeout(function () { status.textContent = ""; }, 1600);
        });
      });

      var scoreFit = rowEl.querySelector('[data-act="jevscore"]');
      if (scoreFit) scoreFit.addEventListener('click', function () {
        openGenerationReview({ id: id, kind: 'jev-score', trigger: scoreFit, status: status });
      });
      var runFit = rowEl.querySelector('[data-act="runfit"]');
      if (runFit) {
        runFit.addEventListener("click", function () {
          openGenerationReview({ id: id, kind: 'analyse', trigger: runFit, status: status,
            subject: (job.company || 'No company') + ' · ' + (job.role || 'Untitled role') });
        });
      }

      var coverBtn = rowEl.querySelector('[data-act="cover"]');
      if (coverBtn) {
        coverBtn.addEventListener("click", function () {
          openGenerationReview({ id: id, kind: 'cover', trigger: coverBtn, status: status,
            subject: (job.company || 'No company') + ' · ' + (job.role || 'Untitled role') });
        });
      }
      var rewriteBrief = rowEl.querySelector('[data-act="briefrewrite"]');
      if (rewriteBrief) rewriteBrief.addEventListener("click", function () {
        openGenerationReview({ id: id, kind: 'prepare-screen', trigger: rewriteBrief, status: status,
          subject: (job.company || 'No company') + ' · ' + (job.role || 'Untitled role') });
      });
      var letterOpen = rowEl.querySelector('[data-act="letteropen"]');
      if (letterOpen) letterOpen.addEventListener('click', function () { openLetter(id); });
      var letterCv = rowEl.querySelector('[data-act="lettercv"]');
      if (letterCv) letterCv.addEventListener('click', function () { openLetter(id, true); });
      var briefOpen = rowEl.querySelector('[data-act="briefopen"]');
      if (briefOpen) briefOpen.addEventListener('click', function () { openArtifact(id, 'brief'); });
      var researchOpen = rowEl.querySelector('[data-act="researchopen"]');
      if (researchOpen) researchOpen.addEventListener("click", function () { openArtifact(id, "research"); });
      var researchRefresh = rowEl.querySelector('[data-act="researchrefresh"]');
      if (researchRefresh) researchRefresh.addEventListener("click", function () {
        openGenerationReview({ id: id, kind: 'research', trigger: researchRefresh, status: status,
          subject: (job.company || 'No company') + ' · ' + (job.role || 'Untitled role') });
      });

      var regen = rowEl.querySelector('[data-act="regen"]');
      if (regen) {
        regen.addEventListener("click", function () {
          openGenerationReview({ id: id, reportId: job.fitReportId, kind: 'regenerate', trigger: regen, status: status,
            subject: (job.company || 'No company') + ' · ' + (job.role || 'Untitled role') });
        });
      }

      var archiveBtn = rowEl.querySelector('[data-act="archive"]');
      if (archiveBtn) {
        archiveBtn.addEventListener("click", function () {
          status.textContent = "Archiving…"; status.className = "row-status";
          patch({ archived: true }, function () { loadJobs(false); });
        });
      }

      var restoreBtn = rowEl.querySelector('[data-act="restore"]');
      if (restoreBtn) {
        restoreBtn.addEventListener("click", function () {
          status.textContent = "Restoring…"; status.className = "row-status";
          patch({ archived: false }, function () { loadJobs(false); });
        });
      }

      var deleteBtn = rowEl.querySelector('[data-act="delete"]');
      if (deleteBtn) {
        deleteBtn.addEventListener("click", async function () {
          var what = (job.role || "this row") + (job.company ? " at " + job.company : "");
          if (!await confirmAdmin({ title: 'Delete ' + what + '?', description: 'The role and its notes will be permanently removed. The shared fit page stays available.', confirmLabel: 'Delete permanently', destructive: true })) return;
          status.textContent = "Deleting…"; status.className = "row-status";
          api("/api/admin/jobs?id=" + encodeURIComponent(id), { method: "DELETE" }).then(function (out) {
            if (unauthorised(out)) return;
            if (!out.ok) { status.textContent = out.d.error || "Delete failed."; status.className = "row-status err"; return; }
            jobs = jobs.filter(function (item) { return item.id !== id; });
            selectedMissing = selectedId === id;
            loadJobs(false);
          });
        });
      }
    });

  }

  function loadJobs(firstTry) {
    var sequence = ++listSequence;
    var requestedArchive = showArchived;
    api("/api/admin/jobs" + (showArchived ? "?archived=1" : ""), { method: "GET" }).then(function (out) {
      if (sequence !== listSequence || requestedArchive !== showArchived) return;
      if (unauthorised(out, firstTry)) return;
      if (!out.ok) { renderGate(out.d && out.d.error ? out.d.error : "Something went wrong."); return; }
      sessionStorage.setItem(SECRET_KEY, secret);
      var previous = new Map(jobs.map(function (job) { return [job.id, job]; }));
      jobs = (out.d.jobs || []).map(function (summary) {
        var detail = previous.get(summary.id);
        return detail && Object.prototype.hasOwnProperty.call(detail, 'jobDescription') ? Object.assign({}, detail, summary) : summary;
      });
      if (selectedId && !jobs.some(function (job) { return job.id === selectedId; }) && previous.has(selectedId)) {
        jobs.push(Object.assign({}, previous.get(selectedId), { _outOfCollection: true }));
      }
      if (out.d.stages && out.d.stages.length) stages = out.d.stages;
      if (out.d.models && out.d.models.length) MODELS = out.d.models;
      if (out.d.archiveOnStage) ARCHIVE_ON_STAGE = out.d.archiveOnStage;
      coverDispatchEnabled = !out.d.features || out.d.features.coverDispatchEnabled !== false;
      screenDispatchEnabled = !out.d.features || out.d.features.screenDispatchEnabled !== false;
      jevEnabled = !!(out.d.features && out.d.features.jevEnabled);
      if (!MODELS.some(function (m) { return m.id === model; })) model = MODELS[0].id;
      unlinked = out.d.unlinked || 0;
      archivedCount = out.d.archivedCount || 0;
      activeRuns = out.d.activeRuns || {};
      if (stageFilter && stages.indexOf(stageFilter) === -1) stageFilter = null;
      renderJobs();
      if (searchQuery.trim() && searchRequested !== searchQuery.trim().toLowerCase()) applySearch();
      else restorePipelineScroll();
    });
  }

  // '/' focuses the search from anywhere, the way it works everywhere else.
  document.addEventListener("keydown", function (e) {
    if (e.key !== "/" || e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target || {};
    var tag = (t.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || t.isContentEditable) return;
    var el = document.getElementById("search");
    if (el) { e.preventDefault(); el.focus(); el.select(); }
  });

  document.addEventListener('admin:section', function (event) {
    workspaceSection = event.detail; writeNavigation('push'); renderJobs(true);
    document.querySelector('[data-section="' + workspaceSection + '"]').focus();
  });

  document.addEventListener('admin:navigate', function (event) {
    var url = new URL(event.detail, location.href);
    if (url.origin !== location.origin || url.pathname !== '/admin') return;
    event.preventDefault();
    var wasArchived = showArchived, wasStage = stageFilter, wasSearch = searchQuery;
    rememberPipelineScroll();
    history.pushState({ admin: true }, '', url.pathname + url.search);
    readNavigationState();
    selectedMissing = false;
    suppressAutoSelect = false;
    if (wasArchived !== showArchived) loadJobs(false);
    else {
      if (wasStage !== stageFilter || wasSearch !== searchQuery) {
        searchMatches = null; searchRequested = '';
        renderJobs(); if (searchQuery.trim()) applySearch();
      } else renderJobs(true);
      loadSelectedDetail(selectedId);
    }
  });

  window.addEventListener('popstate', function () {
    var wasArchived = showArchived, wasStage = stageFilter, wasSearch = searchQuery;
    readNavigationState();
    selectedMissing = false;
    if (wasArchived !== showArchived) loadJobs(false);
    else {
      if (wasStage !== stageFilter || wasSearch !== searchQuery) {
        searchMatches = null; searchRequested = "";
        renderJobs(); if (searchQuery.trim()) applySearch();
      } else renderJobs(true);
      loadSelectedDetail(selectedId); restorePipelineScroll();
    }
  });

  readNavigationState();
  if (secret) {
    try { JSON.parse(sessionStorage.getItem('fit.activeTasks') || '[]').forEach(function (a) { if (a.runId) recoverWork(a.id, a.runId, null, a.kind, false, a.questionId); }); } catch (_) {}
    loadJobs(true);
  }
  else renderGate();
})();
</script>
</body>
</html>
