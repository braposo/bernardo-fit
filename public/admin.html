<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>bernardo-fit — admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" href="/favicon.svg" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: oklch(0.52 0.14 250);
    --accent-deep: oklch(0.42 0.14 250);
    --good: oklch(0.52 0.11 155);
    --warn: oklch(0.64 0.13 70);
    --weak: oklch(0.54 0.15 25);
    --weak-soft: oklch(0.54 0.15 25 / 0.10);
    --paper: #faf8f4;
    --ink: #211f1a;
    --sub: #78746a;
    --hair: rgba(33, 31, 26, 0.11);
    --hair-strong: rgba(33, 31, 26, 0.2);
    --sans: 'IBM Plex Sans', 'Helvetica Neue', sans-serif;
    --display: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
    --maxw: 1080px;
    --pad: clamp(20px, 5vw, 60px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  .frame { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--pad); }

  .masthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 28px 0 20px; flex-wrap: wrap; }
  .mark { font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .mark .dot { color: var(--accent); }
  .kicker { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--sub); }

  /* Gate */
  .gate { max-width: 360px; margin: 15vh auto 0; text-align: center; }
  .gate h1 { font-family: var(--display); font-size: 26px; font-weight: 600; margin: 0 0 8px; }
  .gate p { color: var(--sub); font-size: 14px; margin: 0 0 22px; }
  input[type="password"] {
    width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--hair-strong);
    padding: 12px 2px; font-family: var(--mono); font-size: 15px; color: var(--ink); text-align: center;
  }
  input[type="password"]:focus { outline: none; border-bottom-color: var(--accent); }
  button {
    appearance: none; border: none; background: var(--ink); color: var(--paper); font-family: var(--sans);
    font-weight: 500; font-size: 14px; padding: 11px 22px; border-radius: 100px; cursor: pointer;
  }
  button:hover { background: var(--accent-deep); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .ghost {
    appearance: none; background: transparent; border: 1px solid var(--hair-strong); color: var(--ink);
    font-family: var(--sans); font-weight: 500; font-size: 12.5px; padding: 7px 14px; border-radius: 100px;
    cursor: pointer; text-decoration: none; display: inline-block; line-height: 1.4;
  }
  .ghost:hover { border-color: var(--accent); color: var(--accent-deep); background: transparent; }
  .danger { color: var(--weak); }
  .danger:hover { border-color: var(--weak); color: var(--weak); }
  .gate .row { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
  .gate .err { color: var(--weak); font-size: 13px; margin-top: 14px; }

  /* Toolbar */
  .toolbar { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 30px 0 22px; flex-wrap: wrap; }
  .toolbar h1 { font-family: var(--display); font-size: clamp(24px, 3.4vw, 32px); font-weight: 600; margin: 0; letter-spacing: -0.02em; }
  .toolbar .count { font-family: var(--mono); font-size: 12px; color: var(--sub); }
  .toolbar .right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .usage-dialog { width: min(920px, calc(100vw - 48px)); max-height: 80vh; overflow: auto; background: var(--paper); color: var(--ink); border: 1px solid var(--hair); border-radius: 12px; padding: 24px; }
  .usage-dialog::backdrop { background: rgba(0,0,0,.4); }
  .usage-dialog table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .usage-dialog th, .usage-dialog td { padding: 10px; text-align: left; border-bottom: 1px solid var(--hair); }
  .usage-dialog .usage-scroll { overflow-x: auto; }

  .searchbox {
    appearance: none; background: transparent; border: 1px solid var(--hair-strong); color: var(--ink);
    font-family: var(--sans); font-size: 13px; padding: 8px 14px; border-radius: 100px; width: 220px;
  }
  .searchbox::placeholder { color: var(--sub); }
  .searchbox:focus { outline: none; border-color: var(--accent); }
  .searchbox::-webkit-search-cancel-button { cursor: pointer; }

  /* Stage filter */
  .stagebar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .stagechip {
    appearance: none; background: transparent; border: 1px solid var(--hair); color: var(--sub);
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 6px 12px; border-radius: 100px; cursor: pointer;
  }
  .stagechip:hover { background: transparent; border-color: var(--hair-strong); color: var(--ink); }
  .stagechip.on { border-color: var(--accent); color: var(--accent-deep); }


  /* Reply-owed banner */

  .adoptbanner {
    display: block; width: 100%; text-align: left; background: transparent; border: 1px dashed var(--hair-strong);
    color: var(--sub); font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.06em;
    padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; cursor: pointer;
  }
  .adoptbanner:hover { border-color: var(--accent); color: var(--accent-deep); background: transparent; }

  /* Job description box */
  .jdbox { margin-top: 12px; }
  .jdbox summary {
    font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--accent); cursor: pointer; list-style: none;
  }
  .jdbox summary::-webkit-details-marker { display: none; }
  .jdbox summary:before { content: "+ "; }
  .jdbox[open] summary:before { content: "- "; }
  textarea.jd {
    width: 100%; margin-top: 10px; background: transparent; border: 1px solid var(--hair);
    border-radius: 8px; padding: 12px 14px; font-family: var(--sans); font-size: 13px; line-height: 1.6;
    color: var(--ink); resize: vertical; min-height: 150px;
  }
  textarea.jd:focus { outline: none; border-color: var(--accent); }

  .insbox summary { color: var(--warn); }
  textarea.ins { min-height: 90px; }

  .qabox summary { color: var(--accent-deep); }
  .qa { border-top: 1px solid var(--hair); padding-top: 12px; margin-top: 12px; }
  .qa:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  textarea.qq { min-height: 52px; }
  .qa-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .qa-bar label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--sub); display: flex; align-items: center; gap: 6px; }
  .qa-bar input[type=number] {
    width: 68px; font-family: var(--mono); font-size: 12px; padding: 4px 6px;
    border: 1px solid var(--hair); border-radius: 6px; background: var(--paper); color: var(--ink);
  }
  .qa-answer {
    margin-top: 10px; padding: 12px 14px; border-radius: 8px; background: var(--weak-soft);
    font-size: 14.5px; line-height: 1.6; white-space: pre-wrap;
  }
  .qa-answer.refused { color: var(--warn); }
  .qa-count { font-family: var(--mono); font-size: 10.5px; color: var(--sub); letter-spacing: 0.08em; }
  .qa-count.over { color: var(--warn); }

  .modelpick {
    display: flex; align-items: center; gap: 8px; font-family: var(--mono);
    font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sub);
  }
  .modelpick select {
    font-family: var(--mono); font-size: 11px; padding: 5px 8px; border-radius: 6px;
    border: 1px solid var(--hair); background: var(--paper); color: var(--ink); cursor: pointer;
  }
  .modelpick select.backup { border-color: var(--sub); color: var(--sub); }
  .modelbadge {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--sub);
  }

  .verbox summary { color: var(--sub); }
  .ver { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 7px 0; border-top: 1px solid var(--hair); font-size: 13px; }
  .ver:first-of-type { border-top: none; }
  .ver .vmeta { font-family: var(--mono); font-size: 11px; color: var(--sub); letter-spacing: 0.04em; }
  .ver .vlive { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--good); }
  .verhead { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--sub); margin: 12px 0 2px; }
  .verhead:first-child { margin-top: 0; }

  /* Rows */
  .row-right { display: flex; align-items: center; gap: 12px; flex: none; }
  .scorebadge {
    font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; cursor: help;
  }
  .scorebadge.tieractnow { color: var(--good); }
  .scorebadge.tierworthalook { color: var(--accent); }
  .scorebadge.tierbackground { color: var(--warn); }
  .scorebadge.tierofftarget { color: var(--sub); opacity: 0.6; }
  .owed {
    margin-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--weak);
    letter-spacing: 0.04em;
  }
  .archnote { margin-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--sub); letter-spacing: 0.04em; }
  .rationale { margin-top: 12px; font-size: 14px; line-height: 1.65; color: var(--ink); max-width: 62ch; }
  /* The analysis was built on a different job description than the row now
     holds. Warn-coloured rather than red: nothing is broken, the score is
     just answering an older question. One line of text that wraps, rather
     than a flex row with its own button: on a narrow screen that broke into
     three ragged pieces, and the row already has a Regenerate button. */
  .stalejd {
    margin-top: 12px; font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.04em; line-height: 1.65; color: var(--warn); max-width: 62ch;
  }
  .stalejd b { font-weight: 600; }
  .staledot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--warn); vertical-align: middle; margin-left: 6px;
  }

  .row-item { border-top: 1px solid var(--hair); padding: 22px 0; }
  .row-item:last-child { border-bottom: 1px solid var(--hair); }
  .row-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .row-title { font-family: var(--display); font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .row-title .company { color: var(--accent); }
  .row-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .titlepen {
    appearance: none; background: none; border: none; cursor: pointer; padding: 0;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--sub); opacity: 0.55; transition: opacity 0.12s;
  }
  .row-item:hover .titlepen, .titlepen:focus { opacity: 1; }
  /* Hover does not exist on a touch screen, so it must never be the only
     thing that reveals a control. */
  @media (hover: none) { .titlepen { opacity: 1; } }
  .titlepen:hover { color: var(--accent); }
  .titleedit { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  /* An author display rule outranks the UA display:none that the hidden
     attribute relies on, so both halves stayed visible. */
  .row-title[hidden], .titleedit[hidden] { display: none; }
  .titleedit input {
    font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
    padding: 3px 8px; border: 1px solid var(--hair-strong); border-radius: 6px;
    background: var(--paper); color: var(--ink); min-width: 150px;
  }
  .titleedit input.co { color: var(--accent); }
  .titleedit input:focus { outline: none; border-color: var(--accent); }
  .titleedit .at { color: var(--sub); font-family: var(--mono); font-size: 11px; }
  .row-meta { font-family: var(--mono); font-size: 11px; color: var(--sub); margin-top: 6px; letter-spacing: 0.02em; line-height: 1.6; }
  .row-jd {
    margin-top: 12px; font-size: 13.5px; line-height: 1.6; color: var(--sub); white-space: pre-wrap;
    max-height: 4.8em; overflow: hidden; cursor: pointer;
  }
  .row-jd.expanded { max-height: none; }
  .row-jd::after {
    content: "show more"; display: block; font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--accent); margin-top: 6px;
  }
  .row-jd.expanded::after { content: "show less"; }
  .row-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
  .row-status { font-family: var(--mono); font-size: 11px; color: var(--sub); }
  .row-status.err { color: var(--weak); }
  .row-status.ok { color: var(--good); }

  /* Stage select */
  select {
    appearance: none; background: transparent; border: 1px solid var(--hair-strong); color: var(--ink);
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 7px 30px 7px 13px; border-radius: 100px; cursor: pointer; flex: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%2378746a' stroke-width='1.5'/></svg>");
    background-repeat: no-repeat; background-position: right 12px center;
  }
  select:focus { outline: none; border-color: var(--accent); }
  .stage-new { color: var(--sub); }
  .stage-reviewing { color: var(--accent-deep); border-color: var(--accent); }
  .stage-applied { color: var(--accent-deep); border-color: var(--accent); }
  .stage-interviewing { color: var(--warn); border-color: var(--warn); }
  .stage-offer { color: var(--good); border-color: var(--good); }
  .stage-expired { color: var(--sub); opacity: 0.65; }

  /* Stats */
  .stats { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: var(--sub); }
  .stats b { font-weight: 500; color: var(--ink); }
  .stats .none { opacity: 0.7; }

  textarea.notes {
    width: 100%; margin-top: 12px; background: transparent; border: 1px solid var(--hair);
    border-radius: 8px; padding: 10px 12px; font-family: var(--sans); font-size: 13px; line-height: 1.55;
    color: var(--ink); resize: vertical; min-height: 54px;
  }
  textarea.notes:focus { outline: none; border-color: var(--accent); }

  .empty { text-align: center; color: var(--sub); padding: 70px 0; font-family: var(--display); font-size: 18px; }
  .empty small { display: block; font-family: var(--sans); font-size: 13.5px; margin-top: 10px; }
  .loadmore { text-align: center; margin: 32px 0 60px; }
  .pagefoot { height: 60px; }

  /* Pipeline + workspace */
  :root {
    --accent: #155a99; --accent-deep: #104a7f; --paper: #faf8f4; --surface: #fffefa;
    --ink: #211f1a; --sub: #666258; --hair: #e5e0d6; --hair-strong: #d8d3c8;
    --generation: #fff0d4; --generation-ink: #7a4810; --selected: #eaf1f8;
    --weak: #a02929; --weak-soft: rgba(160,41,41,.08); --maxw: 1440px; --pad: clamp(16px, 3vw, 32px);
  }
  html { height: 100%; }
  body { min-height: 100%; font-size: 16px; line-height: 1.5; }
  button, .ghost, select, input, textarea { border-radius: 7px; }
  button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible,
  summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .frame { max-width: var(--maxw); }
  .masthead { padding: 18px 0 14px; border-bottom: 1px solid var(--hair); }
  .topnav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .topnav button { min-height: 40px; padding: 8px 12px; background: transparent; color: var(--ink); }
  .topnav button[aria-current="page"] { color: var(--accent); font-weight: 600; }
  .admin-shell { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--pad) 40px; display: grid;
    grid-template-columns: minmax(300px, 340px) minmax(0, 1fr); min-height: calc(100vh - 76px); }
  .pipeline { border-right: 1px solid var(--hair-strong); min-width: 0; position: sticky; top: 0;
    height: 100vh; display: flex; flex-direction: column; }
  .pipeline-head { position: sticky; top: 0; z-index: 3; padding: 24px 20px 14px 0;
    background: linear-gradient(var(--paper) 86%, rgba(250,248,244,.88)); }
  .pipeline-titlebar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .pipeline h1 { font: 600 24px/1.2 var(--display); margin: 0; }
  .pipeline-controls { display: grid; gap: 8px; }
  .pipeline-controls .searchbox, .pipeline-controls select { width: 100%; min-height: 44px; border: 1px solid var(--hair-strong);
    background-color: var(--surface); border-radius: 7px; font: 400 15px/1.3 var(--sans); letter-spacing: 0; text-transform: none; }
  .pipeline-controls .searchbox { padding: 10px 12px; }
  .pipeline-list { padding: 0 14px 28px 0; display: grid; grid-auto-rows: max-content; gap: 4px; overflow-y: auto; min-height: 0; align-content: start; }
  .pipeline-head, .bulkbar { flex-shrink: 0; }
  .vpreview { flex-basis: 100%; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .pipeline-item { width: 100%; min-height: 64px; padding: 10px 12px; text-align: left; color: var(--ink);
    background: transparent; border: 1px solid transparent; border-radius: 8px; display: block; }
  .pipeline-item:hover { background: var(--surface); border-color: var(--hair); }
  .pipeline-item.selected { background: var(--selected); border-color: var(--accent); }
  .pipeline-line { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .pipeline-company { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .pipeline-score, .pipeline-stage, .pipeline-signal { flex: none; color: var(--sub); font-size: 13px; }
  .pipeline-role { display: block; margin-top: 2px; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
  .pipeline-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .pipeline-empty { padding: 32px 14px 32px 0; color: var(--sub); }
  .pipeline-empty button { margin-top: 12px; }
  .bulkbar { padding: 0 14px 16px 0; }
  .workspace { min-width: 0; padding: 24px clamp(20px, 3vw, 32px) 60px; }
  .workspace-empty { max-width: 540px; padding: 15vh 0; color: var(--sub); }
  .back-pipeline { display: none; min-height: 44px; padding: 6px 0; margin: -8px 0 12px; background: transparent; color: var(--accent); }
  .role-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  .role-kicker { color: var(--accent); font-weight: 600; font-size: 14px; margin-bottom: 3px; }
  .role-header h1 { margin: 0; font: 600 clamp(24px, 3vw, 28px)/1.18 var(--display); letter-spacing: -.02em; }
  .role-sub { color: var(--sub); margin-top: 6px; }
  .stage-control { flex: none; display: grid; gap: 5px; color: var(--sub); font-size: 14px; }
  .stage-control select { min-height: 44px; min-width: 170px; background-color: var(--surface); font: 500 14px var(--sans);
    text-transform: none; letter-spacing: 0; color: var(--ink); border-color: var(--hair-strong); }
  .owed { color: var(--ink); background: var(--surface); border-color: var(--hair-strong); }
  .qa-answer.refused, .qa-count.over { color: var(--weak); }
  .workspace-tabs { display: flex; gap: 6px 24px; flex-wrap: wrap; border-bottom: 1px solid var(--hair-strong); margin-top: 24px; }
  .workspace-tab { min-height: 44px; padding: 9px 0; border-radius: 0; background: transparent; color: var(--ink); }
  .workspace-tab[aria-selected="true"] { color: var(--accent); box-shadow: inset 0 -2px var(--accent); }
  .workspace-tab:hover { background: transparent; color: var(--accent); }
  .workspace-panel { padding-top: 22px; max-width: 920px; }
  .workspace-panel h2 { font: 600 20px var(--display); margin: 28px 0 8px; }
  .workspace-panel h2:first-child { margin-top: 0; }
  .workspace-panel h3 { font: 600 17px var(--display); margin: 0; }
  .notice { border-left: 3px solid var(--hair-strong); padding: 10px 12px; margin: 0 0 18px; color: var(--sub); background: rgba(255,254,250,.55); }
  .stalejd, .archnote { color: var(--sub); }
  .notice.error { border-color: var(--weak); color: var(--weak); }
  .notice a, .notice button { margin-left: 6px; }
  .score-block { display: flex; gap: 14px; align-items: baseline; }
  .score-value { color: var(--accent); font: 600 32px var(--display); }
  .score-details summary { color: var(--accent); cursor: pointer; }
  .score-details p { color: var(--sub); margin: 8px 0 0; }
  .overview-actions, .record-actions { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; margin: 18px 0; }
  .read-link { color: var(--accent); font-weight: 600; text-decoration: none; }
  button.read-link { appearance: none; border: 0; background: transparent; padding: 8px 0; border-radius: 0; }
  .read-link:hover { text-decoration: underline; }
  .primary-link { display: inline-block; padding: 10px 14px; border-radius: 7px; background: var(--accent); color: white; }
  .primary-link:hover { background: var(--accent-deep); text-decoration: none; }

  .qa-bar input[type=number] { min-height: 40px; background: var(--surface); }
  .qa-answer { background: var(--surface); border: 1px solid var(--hair); }
  .activity-group { margin-bottom: 30px; }
  .activity-list { border-top: 1px solid var(--hair); }
  .activity-row { padding: 12px 0; border-bottom: 1px solid var(--hair); display: flex; align-items: center;
    justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .run-state { font-size: 14px; color: var(--sub); }
  .run-state strong { color: var(--ink); }
  .row-status { min-height: 21px; display: inline-block; }
  dialog.review-dialog { width: min(620px, calc(100vw - 32px)); max-height: min(760px, calc(100vh - 32px)); padding: 0;
    border: 1px solid var(--hair-strong); border-radius: 12px; background: var(--surface); color: var(--ink); }
  .review-dialog::backdrop { background: rgba(26,24,20,.48); }
  .review-head, .review-body, .review-actions { padding: 20px 24px; }
  .review-head { border-bottom: 1px solid var(--hair); }
  .review-head h2 { margin: 0; font: 600 24px var(--display); }
  .review-head p { margin: 4px 0 0; color: var(--sub); }
  .review-body { overflow: auto; max-height: calc(100vh - 250px); }
  .review-body h3 { font-size: 16px; margin: 20px 0 6px; }
  .review-body h3:first-child { margin-top: 0; }
  .review-body ol { margin: 6px 0; padding-left: 22px; }
  .review-jobs { max-height: 150px; overflow: auto; border: 1px solid var(--hair); border-radius: 7px; padding: 8px 12px; }
  .review-jobs div { padding: 5px 0; border-bottom: 1px solid var(--hair); }
  .review-jobs div:last-child { border: 0; }
  .review-model { width: 100%; min-height: 44px; background-color: var(--surface); font: 500 15px var(--sans);
    text-transform: none; letter-spacing: 0; }
  .review-actions { position: sticky; bottom: 0; border-top: 1px solid var(--hair); background: var(--surface);
    display: flex; justify-content: flex-end; gap: 10px; }
  .review-actions .ghost, .review-actions .generation { min-height: 44px; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  @media (max-width: 900px) {
    .masthead { display: none; }
    .admin-shell { display: block; min-height: 100vh; padding: 0 16px; }
    .pipeline { border: 0; position: static; height: auto; display: block; }

    .pipeline-item { scroll-margin-top: 190px; }
    .pipeline-head { padding: 18px 0 12px; }
    .pipeline-list, .bulkbar { padding-right: 0; }
    .workspace { display: none; padding: 18px 0 48px; }
    .admin-shell.has-selection .pipeline { display: none; }
    .admin-shell.has-selection .workspace { display: block; }
    .back-pipeline { display: inline-block; }
    .role-header { display: block; }
    .stage-control { margin-top: 16px; max-width: 230px; }
    .workspace-tabs { gap: 2px 20px; }
    .material-row { grid-template-columns: 1fr; gap: 12px; }
    .material-actions { justify-content: flex-start; align-items: stretch; }
    .material-actions > * { width: 100%; text-align: left; min-height: 44px; padding: 10px 0; }
    .material-actions .generation, .material-actions .ghost { padding: 10px 12px; }
    .review-head, .review-body, .review-actions { padding-left: 16px; padding-right: 16px; }
    .review-actions { display: grid; grid-template-columns: 1fr; }
    .review-actions .generation { grid-row: 1; }
  }
  @media (forced-colors: active) {
    .pipeline-item.selected, .generation { border: 2px solid ButtonText; }
    .workspace-tab[aria-selected="true"] { border-bottom: 2px solid LinkText; }
  }
</style>

<body>
  <div class="frame">
    <div class="masthead">
      <div class="mark">bernardo-fit<span class="dot">.</span></div>
      <nav class="topnav" aria-label="Admin views">
        <button type="button" data-collection="active" aria-current="page">Pipeline</button>
        <button type="button" data-collection="archive">Archive</button>
        <button type="button" id="usagebtn">AI activity &amp; usage</button>
      </nav>
    </div>
  </div>
  <main id="app"></main>

<script type="module">
import { subscribeRun, taskToast } from "./assets/task-ui.js";
import { coverCompletion, coverPhaseText, workCompletion, createRunWatcher } from "./admin-run.js";
import { summariseUsage } from "./admin-usage.js";
import { renderAdmin, createAdminDialog, confirmAdmin, notifyAdmin, setButtonLabel, showAdminError } from "./assets/admin-ui.js";
(function () {
  "use strict";

  document.addEventListener("admin:stage", function(e) { if(document.onAdminStage) document.onAdminStage(e.detail); });
  var app = document.getElementById("app");
  var topnav = document.querySelector('.topnav');
  renderAdmin(topnav, topnav.innerHTML);
  var SECRET_KEY = "bfit_admin_secret";
  var secret = sessionStorage.getItem(SECRET_KEY) || "";

  var jobs = [];
  var fieldDrafts = new Map();
  var expandedVersions = new Set();
  document.addEventListener("admin:versions", function(e) { if(e.detail.open) expandedVersions.add(e.detail.key); else expandedVersions.delete(e.detail.key); });
  var listSequence = 0;
  var renderedRole = "", renderedSection = "";
  var renderedScrollKey = "";
  var suppressAutoSelect = false;

  function draftKey(id, field) { return id + ':' + field; }
  function hasPendingEdits(id) {
    return Array.from(fieldDrafts.keys()).some(function (key) { return !id || key.indexOf(id + ':') === 0; });
  }
  var stages = ["new", "reviewing", "applied", "interviewing", "offer", "rejected", "not_interested", "expired"];
  // These archive the row on the server, so they only ever describe archived
  // jobs. Filtering by them in the pipeline view would always come back empty.
  // Which model writes the next analysis, letter or answer. Kept in
  // localStorage so a reload does not quietly send generations back to the
  // default halfway through a comparison.
  var MODELS = [{ id: "gpt-5.6-sol", label: "Sol" }, { id: "gpt-6-astra", label: "Astra" },
    { id: "claude-opus-5", label: "Opus" },
    { id: "claude-sonnet-5", label: "Sonnet" }
  ];
  var MODEL_KEY = "fit.model";
  var model = localStorage.getItem(MODEL_KEY) || "gpt-5.6-sol";
  var economyAnswers = localStorage.getItem("fit.economyAnswers") !== "false";
  if (!MODELS.some(function (m) { return m.id === model; })) model = "gpt-5.6-sol";
  function modelLabel(id) {
    for (var i = 0; i < MODELS.length; i++) if (MODELS[i].id === id) return MODELS[i].label;
    return "";
  }

  function showUsage() {
    var dialog = createAdminDialog({
      title: 'AI activity & usage', description: 'Recorded usage over the last 30 days.', className: 'usage-dialog',
      content: '<button class="ghost" data-close>Close</button><div data-content aria-live="polite">Loading…</div>'
    });
    dialog.querySelector("[data-close]").addEventListener("click", function () { dialog.close(); });
    api("/api/admin/reports?usage=1").then(function (out) {
      if (!dialog.isConnected) return;
      var target = dialog.querySelector("[data-content]");
      if (unauthorised(out)) { dialog.close(); return; }
      if (!out.ok) { target.textContent = "Could not load usage. Close and try again."; return; }
      var usage = summariseUsage(out.d);
      renderAdmin(target, '<p><strong>Estimated $' + usage.estimatedUsd.toFixed(2) + ' USD</strong> across ' + usage.pricedCalls + ' priced calls. ' +
        usage.savedCalls + ' answers used profile facts without a model call.</p>' +
        '<p>' + usage.input.toLocaleString() + ' input tokens · ' + usage.output.toLocaleString() + ' output tokens · ' + usage.cachePercent.toFixed(1) + '% of input read from cache.</p>' +
        '<p>Estimated costs · ' + usage.pricedCalls + ' of ' + usage.calls + ' calls priced.</p>' +
        '<div class="usage-scroll"><table><thead><tr><th>Task</th><th>Model</th><th>Effort</th><th>Calls</th><th>Output tokens</th><th>Errors</th><th>Estimated USD</th></tr></thead><tbody>' +
        usage.groups.map(function (row) { return '<tr><td>' + esc(row.kind) + '</td><td>' + esc(row.source === "profile" ? "Profile facts" : modelLabel(row.model) || row.model) +
          '</td><td>' + esc(row.effort) + '</td><td>' + row.calls + '</td><td>' + row.output.toLocaleString() + '</td><td>' + row.errors + '</td><td>$' + (row.estimatedCostMicros / 1e6).toFixed(3) + '</td></tr>'; }).join("") +
        '</tbody></table></div>' + (!usage.groups.length ? '<p>No detailed usage recorded yet.</p>' : ''));
    });
  }

  var ARCHIVE_ON_STAGE = ["expired", "rejected", "not_interested"];
  var stageFilter = null;
  var searchQuery = "";
  var searchMatches = null;
  var searchRequested = "";
  var searchTimer = null;
  var searchSequence = 0;
  var unlinked = 0;
  var archivedCount = 0;
  var showArchived = false;
  var attachedCoverWatches = {};
  var activeRuns = {};
  var coverDispatchEnabled = true;
  var screenDispatchEnabled = true;
  var jevEnabled = false;
  var selectedId = "";
  var workspaceSection = "overview";
  var detailSequence = 0;
  var selectedMissing = false;
  var searchLoading = false;
  var versionGroup = "";

  var reports = [];
  var total = 0;
  var offset = 0;
  var LIMIT = 20;

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function safeSourceUrl(value) {
    try { var url = new URL(value); return /^https?:$/.test(url.protocol) ? url.href : ''; }
    catch (_) { return ''; }
  }
  function fmtDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }
  function fmtDateTime(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return fmtDate(iso) + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }

  var VALID_SECTIONS = ["overview", "materials", "context", "activity"];
  function readNavigationState() {
    var p = new URLSearchParams(location.search);
    showArchived = p.get("collection") === "archive";
    stageFilter = p.get("stage") || null;
    searchQuery = p.get("q") || "";
    selectedId = p.get("job") || "";
    workspaceSection = VALID_SECTIONS.indexOf(p.get("section")) !== -1 ? p.get("section") : "overview";
  }
  function navigationUrl() {
    var p = new URLSearchParams();
    if (showArchived) p.set("collection", "archive");
    if (stageFilter) p.set("stage", stageFilter);
    if (searchQuery.trim()) p.set("q", searchQuery.trim());
    if (selectedId) p.set("job", selectedId);
    if (selectedId && workspaceSection !== "overview") p.set("section", workspaceSection);
    return location.pathname + (p.toString() ? "?" + p.toString() : "");
  }
  function writeNavigation(mode, state) {
    history[mode === "push" ? "pushState" : "replaceState"](state || { admin: true }, "", navigationUrl());
  }
  function scrollKey() {
    return "fit.pipeline.scroll." + (showArchived ? "archive" : "active") + "." + (stageFilter || "all") + "." + searchQuery.trim().toLowerCase();
  }
  function rememberPipelineScroll() {
    var list = document.querySelector(".pipeline-list");
    if (window.innerWidth <= 900 && document.querySelector('.admin-shell.has-selection')) return;
    if (list) sessionStorage.setItem(renderedScrollKey || scrollKey(), String(window.innerWidth <= 900 ? window.scrollY : list.scrollTop));
  }
  function restorePipelineScroll() {
    var value = parseInt(sessionStorage.getItem(scrollKey()) || "0", 10) || 0;
    requestAnimationFrame(function () {
      var list = document.querySelector(".pipeline-list");
      if (window.innerWidth <= 900) { if (!selectedId) window.scrollTo(0, value); }
      else if (list) list.scrollTop = value;
    });
  }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "x-admin-secret": secret }, opts.headers || {});
    return fetch(path, opts)
      .then(function (res) {
        if (res.status === 204) return { ok: res.ok, status: res.status, d: {} };
        return res.json()
          .catch(function () { return { error: "Unexpected response from server." }; })
          .then(function (d) { return { ok: res.ok, status: res.status, d: d }; });
      })
      .catch(function () {
        return { ok: false, status: 0, d: { error: "Network error — check your connection and try again." } };
      });
  }

  // ---------- Work that outlives the connection ----------

  function newRequestId() {
    return (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now()).replace(/-/g, "");
  }

  var watchRun = createRunWatcher({
    subscribe: subscribeRun,
    request: function (runId, realtime) {
      return api("/api/admin/cover?run=" + encodeURIComponent(runId) + (realtime ? "&realtime=1" : ""), { method: "GET" });
    }
  });

  var pendingActions = new Map();
  var watchedActions = new Map();
  var recoveringActions = new Map();
  var finishedRuns = new Set();
  var actionNames = { cover: 'Cover letter', research: 'Company research', brief: 'Screen brief', 'prepare-screen': 'Interview preparation', analyse: 'Fit analysis', regenerate: 'Fit analysis', answer: 'Application answer', 'jev-score': 'Fit assessment', 'jev-score-all': 'Listed role assessments', adopt: 'Add reports', ingest: 'Import roles' };
  function actionKey(id, kind, questionId) {
    return [id || 'batch', kind === 'regenerate' ? 'analyse' : kind === 'brief' ? 'prepare-screen' : kind, questionId || ''].join(':');
  }
  function actionTitle(id, kind) {
    var job = jobs.find(function (j) { return j.id === id; });
    return (actionNames[kind] || 'Background work') + (job ? ' · ' + (job.company || job.role) : '');
  }
  function actionBusy(id, kind, questionId) {
    return pendingActions.has(actionKey(id, kind, questionId)) ||
      (kind === 'research' && pendingActions.has(actionKey(id, 'prepare-screen'))) ||
      ((kind === 'prepare-screen' || kind === 'brief') && pendingActions.has(actionKey(id, 'research'))) ||
      (kind === 'jev-score' && pendingActions.has(actionKey('batch', 'jev-score-all'))) ||
      (kind === 'jev-score-all' && Array.from(pendingActions.values()).some(function (action) { return action.kind === 'jev-score'; }));
  }
  function applyActionLocks() {
    document.querySelectorAll('.row-item').forEach(function (row) {
      var id = row.getAttribute('data-id');
      var kinds = { cover: 'cover', briefrewrite: 'prepare-screen', researchrefresh: 'research', runfit: 'analyse', regen: 'analyse', jevscore: 'jev-score', qdraft: 'answer' };
      row.querySelectorAll('[data-act]').forEach(function (button) {
        var kind = kinds[button.getAttribute('data-act')];
        if (!kind) return;
        var qa = button.closest('[data-qid]');
        if (actionBusy(id, kind, qa && qa.getAttribute('data-qid'))) {
          button.disabled = true; button.setAttribute('aria-busy', 'true');
        }
      });
    });
    [['adopt', 'adopt'], ['assesslisted', 'jev-score-all']].forEach(function (entry) {
      var button = document.getElementById(entry[0]);
      if (button && actionBusy('batch', entry[1])) { button.disabled = true; button.setAttribute('aria-busy', 'true'); }
    });
  }
  function beginAction(id, kind, questionId) {
    if (actionBusy(id, kind, questionId)) return false;
    var key = actionKey(id, kind, questionId);
    pendingActions.set(key, { id: id, kind: kind, questionId: questionId });
    taskToast(key, { title: actionTitle(id, kind), message: 'Starting…', terminal: false, tone: 'pending', href: undefined });
    applyActionLocks(); return true;
  }
  function persistActions() {
    try { sessionStorage.setItem('fit.activeTasks', JSON.stringify(Array.from(pendingActions.values()).filter(function (a) { return a.runId; }))); } catch (_) {}
  }
  function failAction(id, kind, questionId, message) {
    var key = actionKey(id, kind, questionId);
    pendingActions.delete(key); persistActions();
    taskToast(key, { message: message, terminal: true, tone: 'err' });
    renderJobs();
  }
  function watchCover(id, runId, status, openWhenDone) {
    return watchWork(id, runId, status, 'cover', openWhenDone);
  }
  function watchWork(id, runId, status, kind, openWhenDone, questionId) {
    if (watchedActions.has(runId)) {
      taskToast('run:' + runId, { title: actionTitle(id, kind) });
      return watchedActions.get(runId);
    }
    if (finishedRuns.has(runId)) return Promise.resolve();
    var key = actionKey(id, kind, questionId);
    var toastId = 'run:' + runId;
    pendingActions.set(key, { id: id, kind: kind, questionId: questionId, runId: runId });
    persistActions(); applyActionLocks();
    var href = id && id !== 'batch' ? '/admin?job=' + encodeURIComponent(id) + '&section=' + (kind === 'jev-score' ? 'overview' : 'materials') : '/admin';
    taskToast(toastId, { title: actionTitle(id, kind), message: 'Queued…', terminal: false, tone: 'pending', href: href, linkLabel: id === 'batch' ? 'Open pipeline' : 'Open role' }, key);
    var watching = watchRun(runId, function (run) {
      var message = coverPhaseText(run);
      if (status) status.textContent = message;
      taskToast(toastId, { message: message });
    }).then(function (out) {
      var done = kind === 'cover' ? coverCompletion(out) : workCompletion(out);
      if (status) { status.textContent = done.text; if (status.classList.contains('row-status')) status.className = 'row-status ' + done.tone; }
      if (out.d.result && out.d.result.reportId && done.tone === 'ok') href = '/?r=' + encodeURIComponent(out.d.result.reportId);
      taskToast(toastId, { message: done.text, tone: done.tone, terminal: true, href: href, linkLabel: href.indexOf('/?r=') === 0 ? 'Open analysis' : id === 'batch' ? 'Open pipeline' : 'Open role' });
      finishedRuns.add(runId); watchedActions.delete(runId);
      if (pendingActions.get(key)?.runId === runId) pendingActions.delete(key);
      persistActions();
      if (activeRuns[kind]?.runId === runId) activeRuns[kind] = null;
      loadJobs(false);
      var detailId = kind === 'jev-score-all' ? selectedId : id;
      if (detailId && detailId !== 'batch') api('/api/admin/jobs?id=' + encodeURIComponent(detailId), { method: 'GET' }).then(function (detail) {
        if (!detail.ok) return;
        var index = jobs.findIndex(function (j) { return j.id === detailId; });
        if (index !== -1 && (jobs[index].revision || 0) <= (detail.d.job.revision || 0)) jobs[index] = Object.assign({}, jobs[index], detail.d.job);
        renderJobs();
      });
      return out;
    });
    watchedActions.set(runId, watching);
    return watching;
  }
  function recoverWork(id, runId, status, kind, openWhenDone, questionId) {
    if (watchedActions.has(runId)) return watchedActions.get(runId);
    if (finishedRuns.has(runId)) return Promise.resolve();
    if (recoveringActions.has(runId)) return recoveringActions.get(runId);
    var key = actionKey(id, kind, questionId);
    pendingActions.set(key, { id: id, kind: kind, questionId: questionId, runId: runId });
    persistActions(); applyActionLocks();
    var recovery = api('/api/admin/cover?run=' + encodeURIComponent(runId), { method: 'GET' }).then(function (out) {
      if (out.ok && out.d.terminal) {
        finishedRuns.add(runId);
        if (pendingActions.get(key)?.runId === runId) pendingActions.delete(key);
        persistActions();
        loadJobs(false);
        return out;
      }
      return watchWork(id, runId, status, kind, openWhenDone, questionId);
    }).finally(function () { recoveringActions.delete(runId); });
    recoveringActions.set(runId, recovery);
    return recovery;
  }
  function recoverActions() {
    jobs.forEach(function (job) {
      [['coverRun','cover'],['researchRun','research'],['prepareRun','prepare-screen'],['briefRun','brief'],['analysisRun','analyse'],['jevRun','jev-score']].forEach(function (entry) {
        var run = job[entry[0]];
        if (run && run.runId && ['dispatching','queued'].indexOf(run.status) !== -1) recoverWork(job.id, run.runId, null, entry[1], false);
      });
      (job.answerRuns || []).forEach(function (answer) { recoverWork(job.id, answer.run.runId, null, 'answer', false, answer.questionId); });
    });
  }

  function unauthorised(out, firstTry) {
    if (out.status === 401) {
      sessionStorage.removeItem(SECRET_KEY);
      renderGate(firstTry ? "Wrong secret." : "Session expired.");
      return true;
    }
    return false;
  }

  // ---------- Gate ----------

  function renderGate(err) {
    renderAdmin(app,
      '<div class="frame"><div class="gate">' +
        "<h1>Locked</h1>" +
        "<p>Enter the admin secret to continue.</p>" +
        '<label for="secret">Admin secret</label><input type="password" id="secret" autocomplete="current-password" autofocus />' +
        (err ? '<div class="err">' + esc(err) + "</div>" : "") +
        '<div class="row"><button id="unlock">Unlock</button></div>' +
      "</div></div>");

    var input = document.getElementById("secret");
    function tryUnlock() {
      secret = input.value.trim();
      if (!secret) return;
      loadJobs(true);
    }
    document.getElementById("unlock").addEventListener("click", tryUnlock);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });
  }

  // ---------- Pipeline ----------

  // Extra questions an application form asks. Kept on the row so the whole set
  // can be reread, and so each answer knows what the earlier ones already said.
  // Loaded when the box is opened rather than with the list, since most rows
  // have one version of each and nobody looks at them.
  function versionsHtml(j) {
    var n = j.letterVersionCount != null ? j.letterVersionCount : (j.coverLetterVersions || []).length;
    var label = j.fitReportId || n || j.hasResearch || j.hasBrief ? "Versions" : "";
    if (!label) return "";
    return '<section class="activity-group verbox" data-act="verbox" aria-labelledby="versions-heading">' +
      '<h2 id="versions-heading">Output versions</h2>' +
      '<div class="verlist" aria-live="polite">Loading…</div>' +
    "</section>";
  }

  function versionRow(v, kind, number) {
    var bits = ['Created '+relativeTime(v.at), modelLabel(v.model) || v.model || 'Model not recorded'];
    if (kind === "letter" && v.words) bits.push(v.words + " words");
    if (kind === "research" && v.sources != null) bits.push(v.sources + " sources" + (v.partial ? " · partial" : ""));
    return '<div class="ver">' +
      '<strong>Version '+number+'</strong><span class="vmeta" title="'+esc(fmtDateTime(v.at))+'">' + esc(bits.join(" · ")) + "</span>" +
      '<button class="ghost" data-act="verpreview" data-kind="' + kind + '" data-vid="' + esc(v.vid || '') + '" type="button" aria-expanded="false">Preview content</button>' +
      (v.active || !v.vid
        ? '<span class="vlive">Live</span>'
        : '<button class="ghost" data-act="veruse" data-kind="' + kind + '" data-vid="' + esc(v.vid) + '">Publish live</button>') +
      (v.versionInstructions ? '<details class="version-instructions"><summary>Additional instructions</summary><p>'+esc(v.versionInstructions)+'</p></details>' : '') + '<div class="vpreview" hidden></div>' +
    "</div>";
  }

  function previewHtml(value) {
    if (value == null) return '';
    if (Array.isArray(value)) return '<ul>' + value.map(function (item) { return '<li>' + previewHtml(item) + '</li>'; }).join('') + '</ul>';
    if (typeof value === 'object') return Object.keys(value).filter(function (key) { return key !== 'lead'; }).map(function (key) {
      return '<div><strong>' + esc(key.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/_/g, ' ')) + '</strong>' + previewHtml(value[key]) + '</div>';
    }).join('');
    return '<p>' + esc(value) + '</p>';
  }

  function questionsHtml(j) {
    var qs = j.questions || [];
    var body = qs.map(function (q) {
      var answered = q.a || q.refused;
      var over = q.a && countWords(q.a) > q.limit;
      return '<div class="qa" data-qid="' + esc(q.id) + '">' +
        '<label class="field-label" for="question-' + esc(q.id) + '">Question</label>' +
        '<textarea id="question-' + esc(q.id) + '" class="jd qq" data-act="qtext" placeholder="Paste the question from the application form…">' + esc(q.q || "") + '</textarea>' +
        '<div class="qa-bar">' +
          '<label>max <input type="number" data-act="qlimit" min="20" max="500" step="10" value="' + (q.limit || 120) + '"> words</label>' +
          '<button class="generation" data-act="qdraft">' + (answered ? "Draft again" : "Draft answer") + '</button>' +
          (q.a ? '<button class="ghost" data-act="qcopy">Copy</button>' : "") +
          '<button class="ghost" data-act="qdel">Remove</button>' +
          (q.a ? '<span class="qa-count' + (over ? " over" : "") + '">' + countWords(q.a) + " / " + q.limit + '</span>' : "") +
        '</div>' +
        (q.refused
          ? '<div class="qa-answer refused">Needs you: ' + esc(q.reason || "something my profile does not cover.") + '</div>'
          : q.a ? '<div class="qa-answer">' + esc(q.a) + '</div>' : "") +
      '</div>';
    }).join("");

    var n = qs.filter(function (q) { return q.a; }).length;
    var label = qs.length
      ? "Application questions (" + n + " of " + qs.length + " answered)"
      : "Application questions";
    return '<section class="question-list qabox" aria-labelledby="questions-heading">' +
      '<h2 id="questions-heading">' + label + '</h2>' +
      body +
      '<div class="qa-bar"><button class="ghost" data-act="qadd">Add a question</button></div>' +
    '</section>';
  }

  function countWords(s) {
    return String(s || "").trim().split(/\s+/).filter(Boolean).length;
  }

  function recordJobAction(id, event) {
    api('/api/admin/jobs', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'activity',id:id,event:event})}).catch(function(){});
  }
  function jobUsageHtml(data) {
    var usage = summariseUsage(data || {});
    return '<section class="job-usage"><h2>AI activity &amp; usage</h2>' +
      '<div class="analytics-summary"><div><strong>$'+usage.estimatedUsd.toFixed(3)+'</strong><span>Estimated USD</span></div><div><strong>'+usage.calls+'</strong><span>AI calls</span></div><div><strong>'+usage.input.toLocaleString()+'</strong><span>Input tokens</span></div><div><strong>'+usage.output.toLocaleString()+'</strong><span>Output tokens</span></div></div>' +
      '<p class="field-help">'+usage.pricedCalls+' of '+usage.calls+' calls priced · '+usage.cachePercent.toFixed(1)+'% input cached · '+usage.savedCalls+' answers from profile facts</p>' +
      (usage.groups.length ? '<div class="usage-scroll" role="region" aria-label="AI usage by task and model" tabindex="0"><table><thead><tr><th>Task</th><th>Model</th><th>Effort</th><th>Calls</th><th>Output tokens</th><th>Errors</th><th>Estimated USD</th></tr></thead><tbody>' +
        usage.groups.map(function(row) { return '<tr><td>'+esc(row.kind)+'</td><td>'+esc(row.source === 'profile' ? 'Profile facts' : modelLabel(row.model) || row.model)+'</td><td>'+esc(row.effort)+'</td><td>'+row.calls+'</td><td>'+row.output.toLocaleString()+'</td><td>'+row.errors+'</td><td>$'+(row.estimatedCostMicros/1e6).toFixed(3)+'</td></tr>'; }).join('') + '</tbody></table></div>' : '<p>No AI usage recorded for this job yet.</p>') + '</section>';
  }

  function loadJobActivity(target, id, state) {
    var sequence = target.activitySequence = (target.activitySequence || 0) + 1;
    state = state || { events: [], snapshot: null };
    var offset = state.events.length;
    api('/api/admin/jobs?id='+encodeURIComponent(id)+'&activity=1&offset='+offset+(state.snapshot ? '&snapshot='+state.snapshot : '')).then(function(out) {
      if (!target.isConnected || target.activitySequence !== sequence || selectedId !== id || unauthorised(out)) return;
      if (!out.ok) {
        renderAdmin(target, '<p role="alert">Could not load activity.</p><button class="ghost" data-activity-retry>Retry</button>');
        target.querySelector('[data-activity-retry]').onclick = function() { loadJobActivity(target,id); }; return;
      }
      var data=out.d, stats=data.stats || {};
      state.events=state.events.concat(data.events || []); state.snapshot=data.snapshot;
      renderAdmin(target, '<h2>Analytics summary</h2><div class="analytics-summary engagement-summary">'+[[stats.view || 0,'Fit page views'],[stats.copy_link || 0,'Link copies'],[stats.cv_download || 0,'CV downloads']].map(function(item) { return '<div><strong>'+item[0]+'</strong><span>'+item[1]+'</span></div>'; }).join('')+'</div>' +
        '<section class="job-audit"><div class="audit-heading"><h2>Audit log</h2><button class="ghost" data-activity-refresh>Refresh activity</button></div><p class="field-help">Newest first · timestamps in your local time. Views and downloads are anonymous client-reported events.</p>' +
        '<ol class="audit-log">'+state.events.map(function(event) { return '<li><time datetime="'+esc(event.at)+'" title="'+esc(event.at)+'">'+esc(new Date(event.at).toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}))+'</time><strong title="'+esc(event.title+(event.detail ? ' — '+event.detail : ''))+'">'+esc(event.title)+'</strong></li>'; }).join('')+'</ol>' +
        (!state.events.length ? '<p>No recorded actions yet.</p>' : '') + (data.hasMore ? '<button class="ghost" data-activity-more>Load older actions</button>' : '') + '</section>' + jobUsageHtml(data.usage));
      target.querySelector('[data-activity-refresh]').onclick=function(){loadJobActivity(target,id);};
      var more=target.querySelector('[data-activity-more]');
      if(more) more.onclick=function(){more.disabled=true; more.textContent='Loading…'; loadJobActivity(target,id,state);};
    }).catch(function() {
      if (!target.isConnected || target.activitySequence !== sequence) return;
      renderAdmin(target, '<p role="alert">Could not load activity.</p><button class="ghost" data-activity-retry>Retry</button>');
      target.querySelector('[data-activity-retry]').onclick=function(){loadJobActivity(target,id);};
    });
  }

  function statsHtml(j) {
    if (!j.fitReportId) return "";
    var s = j.stats;
    if (!s || (!s.view && !s.copy_link && !s.cv_download)) {
      return '<div class="stats"><span class="none">No views yet</span></div>';
    }
    var bits = ['<span><b>' + s.view + "</b> view" + (s.view === 1 ? "" : "s") + "</span>"];
    if (s.copy_link) bits.push("<span><b>" + s.copy_link + "</b> link copied</span>");
    if (s.cv_download) bits.push("<span><b>" + s.cv_download + "</b> CV download" + (s.cv_download === 1 ? "" : "s") + "</span>");
    if (s.lastAt) bits.push("<span>last " + fmtDateTime(s.lastAt) + "</span>");
    return '<div class="stats">' + bits.join("") + "</div>";
  }

  // Says what changed and by how much, so the flag can be judged rather than
  // just obeyed. A row whose description grew tenfold is a different case from
  // one that lost its posting and kept a summary, and both show up here.
  function staleHtml(j) {
    if (!j.jd || !j.jd.stale) return "";
    var pct = Math.round(((j.jd.now - j.jd.was) / Math.max(1, j.jd.was)) * 100);
    return '<div class="stalejd"><b>Analysis is out of date.</b> Written from ' +
      fmtChars(j.jd.was) + ", now " + Number(j.jd.now).toLocaleString() +
      " (" + (pct > 0 ? "+" : "") + pct + "%). Generate a new version to update this document.</div>";
  }

  function fmtChars(n) {
    return Number(n || 0).toLocaleString() + " characters";
  }

  function tierClass(t) {
    return "tier-" + String(t || "").toLowerCase().replace(/[^a-z]/g, "");
  }

  function assessmentStatusHtml(j) {
    if (!j.jevAssessment) return '';
    if (!j.jevStale && !j.jevAssessment.blocked && j.jevAssessment.provisional) {
      return '<span class="assessment-status assessment-status-icon" role="img" aria-label="Provisional score; see Fit assessment for details" title="Provisional score; see Fit assessment for details">⚠</span>';
    }
    var label = j.jevStale ? 'Needs reassessment' : j.jevAssessment.blocked ? 'Constraint conflict' : '';
    return label ? '<span class="assessment-status">' + esc(label) + '</span>' : '';
  }

  function stageLabel(value) {
    return String(value || "new").replace(/_/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  function stageOptions(j) {
    return stages.map(function (s) {
      return '<option value="' + esc(s) + '"' + (j.stage === s ? " selected" : "") + ">" + esc(stageLabel(s)) + "</option>";
    }).join("");
  }

  function relativeTime(iso) {
    var stamp = Date.parse(iso); if (!Number.isFinite(stamp)) return 'Date unavailable';
    var seconds = Math.max(0, (Date.now() - stamp) / 1000);
    if (seconds < 60) return 'just now';
    var units = [[31536000,'year'],[2592000,'month'],[86400,'day'],[3600,'hour'],[60,'minute']];
    for (var i=0;i<units.length;i++) if(seconds>=units[i][0]) return new Intl.RelativeTimeFormat(undefined,{numeric:'auto'}).format(-Math.floor(seconds/units[i][0]),units[i][1]);
  }
  function timeHtml(iso, prefix) { return '<time title="'+esc(fmtDateTime(iso))+'"'+(iso?' datetime="'+esc(iso)+'"':'')+'>'+esc(prefix || '')+esc(relativeTime(iso))+'</time>'; }
  function materialRow(title, meta, actions, kind, j) {
    var key = j.id + ':' + kind;
    return '<section class="material-row" data-document="'+kind+'"><div class="document-title"><span class="document-icon" data-icon="file"></span><h3>'+esc(title)+'</h3><span class="document-live" data-live="'+kind+'"></span></div>' +
      '<div class="document-summary" data-summary="'+kind+'">'+meta+'</div>'+((kind==='fit'&&j.jd&&j.jd.stale)||(kind==='brief'&&j.briefStale)||(kind==='research'&&j.researchStale)?'<p class="field-help">Outdated · saved version remains readable</p>':'')+'<div class="material-actions">'+actions+'</div>'+
      '<div class="document-versions" data-act="document-versions" data-key="'+esc(key)+'" data-open="'+expandedVersions.has(key)+'"><button class="versions-trigger" data-act="versions-toggle">Versions <span data-count="'+kind+'"></span><span data-icon="chevron"></span></button><div class="versions-content"><div class="verlist" data-kind="'+kind+'" aria-live="polite">Loading versions…</div></div></div></section>';
  }

  function runStateHtml(j) {
    var rows = [
      ["Fit assessment", j.jevRun], ["Fit analysis", j.analysisRun], ["Cover letter", j.coverRun], ["Research", j.researchRun],
      ["Interview preparation", j.prepareRun || j.briefRun],
    ].filter(function (pair) { return pair[1] && pair[1].status; });
    if (!rows.length) return '<p class="run-state">No recorded role-level run state is available.</p>';
    return '<div class="activity-list">' + rows.map(function (pair) {
      return '<div class="activity-row"><span><strong>' + esc(pair[0]) + '</strong></span><span class="run-state">' +
        esc(stageLabel(pair[1].status)) + (pair[1].startedAt ? ' · ' + esc(fmtDateTime(pair[1].startedAt)) : '') + '</span></div>';
    }).join("") + '</div>';
  }

  function jobHtml(j) {
    var detailed = Object.prototype.hasOwnProperty.call(j, "jobDescription");
    var hasDescription = detailed ? !!j.jobDescription : !!j.hasDescription;
    var hasLetter = !!j.hasCoverLetter;
    var coverActive = !!(j.coverRun && j.coverRun.runId &&
      (j.coverRun.status === "dispatching" || j.coverRun.status === "queued"));
    var screenActive = [j.prepareRun, j.briefRun].some(function (run) { return run && run.runId && ['dispatching', 'queued'].indexOf(run.status) !== -1; });
    var researchActive = !!(j.researchRun && j.researchRun.runId && ['dispatching', 'queued'].indexOf(j.researchRun.status) !== -1);
    var fitLink = j.fitReportId ? location.origin + "/?r=" + encodeURIComponent(j.fitReportId) : "";
    var mailLink = j.threadId ? "https://mail.google.com/mail/u/0/#all/" + encodeURIComponent(j.threadId) : "";
    var headerMeta = [j.location, j.locationMode, j.salary].filter(Boolean).map(esc).join(" · ") || "Location and salary not recorded";

    var owed = "";
    if (j.replyOwed && j.recruiter) {
      owed = '<div class="owed">' + esc(j.recruiter.name) +
        " at " + esc(j.recruiter.org) + " has been waiting " +
        (j.recruiter.daysWaiting != null ? j.recruiter.daysWaiting + " days" : "a while") + "</div>";
    } else if (j.replyOwed) {
      owed = '<div class="owed">Reply owed</div>';
    }

    var fitActions = fitLink
      ? '<a class="read-link" href="' + esc(fitLink) + '" target="_blank" rel="noopener">Open fit page</a>' +

        '<button class="generation generation-outline" data-act="regen">Generate new version</button>'
      : '<button class="generation" data-act="runfit"' + (hasDescription ? "" : " disabled") + '>Generate analysis</button>';
    var letterActions = (hasLetter ? '<button class="read-link" data-act="letteropen">Open letter</button>' +
      '<button class="read-link" data-act="lettercv">Open CV + letter</button>' : '') +
      '<button class="generation' + (hasLetter ? ' generation-outline' : '') + '" data-act="cover"' + (coverActive || !coverDispatchEnabled || !j.fitReportId ? ' disabled' : '') + '>' +
      (coverActive ? 'Writing…' : hasLetter ? 'Generate new version' : 'Generate letter') + '</button>';
    var briefActions = (j.hasBrief ? '<button class="read-link" data-act="briefopen">Open ' + (j.briefStale ? 'previous ' : '') + 'brief</button>' : '') +
      '<button class="generation' + (j.hasBrief ? ' generation-outline' : '') + '" data-act="briefrewrite"' + (screenActive || !screenDispatchEnabled || !j.fitReportId ? ' disabled' : '') + '>' +
      (screenActive ? 'Preparing…' : j.hasBrief ? 'Generate new version' : 'Generate brief') + '</button>';
    var researchActions = (j.hasResearch ? '<button class="read-link" data-act="researchopen">Open research</button>' : '') +
      '<button class="generation' + (j.hasResearch ? ' generation-outline' : '') + '" data-act="researchrefresh"' + (!screenDispatchEnabled || researchActive ? ' disabled' : '') + '>' +
      (researchActive ? 'Researching…' : j.hasResearch ? 'Generate new version' : 'Generate research') + '</button>';

    var panel = '';
    if (!detailed) {
      panel = '<div class="workspace-panel"><p aria-live="polite">Loading role details…</p></div>';
    } else if (workspaceSection === "overview") {
      panel = '<section class="workspace-panel" id="panel-overview" role="tabpanel">' +
        jevAssessmentHtml(j) +
        '<button class="generation" data-act="jevscore"' + (!jevEnabled || j.archived || (j.jevRun && ["dispatching", "queued"].indexOf(j.jevRun.status) !== -1) ? ' disabled' : '') + '>Assess fit</button>' +
        (!jevEnabled ? '<p class="field-help">Fit assessment is unavailable.</p>' : '') +
        (j.jevRun && j.jevRun.status === 'failed' ? '<p class="notice error">Assessment failed. Try again.</p>' : '') +
        '<section class="overview-summary"><h2>Summary</h2>' +
          (j.overviewSummary && !j.jevStale && j.jevAssessment && j.overviewSummary.fingerprint === j.jevAssessment.fingerprint && j.overviewSummary.assessedAt === j.jevAssessment.assessedAt ? '<h3>The position</h3><p>' + esc(j.overviewSummary.position) + '</p><h3>Your fit</h3><p>' + esc(j.overviewSummary.fit) + '</p>' :
            '<p class="field-help">' + (j.jevRun && ['dispatching', 'queued'].indexOf(j.jevRun.status) !== -1 ? 'Preparing summary…' : j.jevStale ? 'Reassess fit to update the summary.' : 'Assess fit to add a summary.') + '</p>') + '</section>' +
        owed +
        '</section>';
    } else if (workspaceSection === "materials") {
      panel = '<section class="workspace-panel" id="panel-materials" role="tabpanel"><h2>Documents</h2>' +
        '<div class="material-list" data-act="verbox">' +
          materialRow('Fit analysis', j.fitReportId ? 'Shareable page' + (j.jd && j.jd.stale ? ' · Outdated after description change' : ' · Current') : 'Not generated', fitActions, 'fit', j) +
          materialRow('Cover letter', 'Private · ' + (hasLetter ? 'Saved ' + (j.coverLetterAt ? ' · ' + esc(fmtDate(j.coverLetterAt)) : '') + (j.coverLetterModel ? ' · ' + esc(modelLabel(j.coverLetterModel) || j.coverLetterModel) : '') : 'Not generated' + (!j.fitReportId ? ' · Generate fit analysis first' : '')), letterActions, 'letter', j) +
          materialRow('Interview brief', 'Private · ' + (j.hasBrief ? (j.briefStale ? 'Outdated · previous brief remains readable' : 'Current') + (j.briefAt ? ' · ' + esc(fmtDate(j.briefAt)) : '') : 'Not generated' + (!j.fitReportId ? ' · Generate fit analysis first' : '')), briefActions, 'brief', j) +
          materialRow('Company research', 'Private · ' + (j.hasResearch ? (j.researchStale ? 'Outdated' : 'Current') + ' · ' + Number(j.researchSourceCount || 0) + ' sources' : 'Not generated'), researchActions, 'research', j) +
        '</div>' + questionsHtml(j) + '</section>';
    } else if (workspaceSection === "context") {
      panel = '<section class="workspace-panel context-grid" id="panel-context" role="tabpanel">' +
        '<div class="field"><label for="company">Company</label><input id="company" type="text" data-field="company" value="' + esc(j.company || '') + '"><div class="field-status" data-save-for="company"></div></div>' +
        '<div class="field"><label for="role">Role title</label><input id="role" type="text" data-field="role" value="' + esc(j.role || '') + '"><div class="field-status" data-save-for="role"></div></div>' +
        '<div class="field"><label for="location">Location</label><input id="location" type="text" data-field="location" value="' + esc(j.location || '') + '"><div class="field-status" data-save-for="location"></div></div>' +
        '<div class="field"><label for="salary">Salary</label><input id="salary" type="text" data-field="salary" value="' + esc(j.salary || '') + '"><div class="field-status" data-save-for="salary"></div></div>' +
        '<div class="field"><label for="sourceUrl">Posting or source URL</label><input id="sourceUrl" type="url" data-field="sourceUrl" value="' + esc(j.sourceUrl || '') + '"><div class="field-status" data-save-for="sourceUrl"></div></div>' +
        '<div class="field"><label for="jobDescription">Job description</label><p class="field-help">Changes make the current fit analysis and interview brief outdated.</p><textarea id="jobDescription" class="tall" data-field="jobDescription">' + esc(j.jobDescription || '') + '</textarea><div class="field-status" data-save-for="jobDescription"></div></div>' +
        '<div class="field"><label for="notes">Private notes</label><p class="field-help">Hidden from public pages. These notes may be used as context when preparing interview materials.</p><textarea id="notes" data-field="notes">' + esc(j.notes || '') + '</textarea><div class="field-status" data-save-for="notes"></div></div>' +
        '<div class="field"><label for="instructions">AI instructions</label><p class="field-help">Tell generation what to emphasise or avoid. Saving does not run AI.</p><textarea id="instructions" data-field="instructions">' + esc(j.instructions || '') + '</textarea><div class="field-status" data-save-for="instructions"></div></div>' +
        '<div class="overview-actions">' + (safeSourceUrl(j.sourceUrl) ? '<a class="read-link" href="' + esc(safeSourceUrl(j.sourceUrl)) + '" target="_blank" rel="noopener">View posting ↗</a>' : '') +
          (mailLink ? '<a class="read-link" href="' + esc(mailLink) + '" target="_blank" rel="noopener">Open email ↗</a>' : '') + '</div></section>';
    } else {
      panel = '<section class="workspace-panel" id="panel-activity" role="tabpanel"><div data-job-activity="'+esc(j.id)+'" aria-live="polite"><p>Loading activity…</p></div>' +
        '<section class="activity-group"><h2>Record management</h2><div class="record-actions">' +
        (j.archived ? '<button class="ghost" data-act="restore">Restore to pipeline</button><button class="ghost danger" data-act="delete">Delete permanently</button>' : '<button class="ghost" data-act="archive">Archive</button>') +
        '</div></section></section>';
    }

    return '<article class="row-item" data-id="' + esc(j.id) + '"><button class="back-pipeline" data-act="back">← Back to pipeline</button>' +
      '<header class="role-header"><div class="role-identity"><div class="role-kicker">' + esc(j.company || 'No company') + '</div><h1>' + esc(j.role || 'Untitled role') +
      '</h1><div class="role-sub">' + headerMeta + (j.closed ? ' · Posting closed' : '') + '</div><div class="role-added">'+timeHtml(j.createdAt,'Added ')+'</div>' +
      '<div class="role-stage"><span class="pipeline-stage stage-'+esc(j.stage)+'">'+esc(stageLabel(j.stage))+'</span><div class="stage-control"><button class="ghost status-edit" aria-label="Change status" title="Change status"><span data-icon="settings"></span></button><div class="stage-popover"><label for="job-stage">Change status</label><select id="job-stage" data-act="stage" aria-label="Stage for ' + esc(j.role || 'role') + '">' + stageOptions(j) + '</select></div></div></div></div>' +
      '<div class="score-actions"><span class="score-tile" aria-label="'+(j.score!=null?esc(j.score)+' out of 100 fit score'+(j.jevStale?', from an outdated assessment':''):'Not scored')+'">'+(j.score!=null?esc(j.score):'—')+'</span>'+assessmentStatusHtml(j)+'</div>'+ (safeSourceUrl(j.sourceUrl)?'<a class="listing-link" href="'+esc(safeSourceUrl(j.sourceUrl))+'" target="_blank" rel="noopener">View original listing <span data-icon="external"></span></a>':'<span class="listing-unavailable field-help">No listing URL</span>')+'</header>' +
      '<nav class="workspace-tabs" role="tablist" aria-label="Role sections">' +
      [["overview","Overview"],["materials","Documents"],["context","Role details"],["activity","Activity"]].map(function (item) {
        return '<button class="workspace-tab" role="tab" data-section="' + item[0] + '" aria-selected="' + (workspaceSection === item[0]) + '">' + item[1] + '</button>';
      }).join('') + '</nav><span class="row-status" role="status" aria-live="polite"></span>' + panel + '</article>';
  }

  // Everything a search term is allowed to hit. Job descriptions are included
  // so searching a technology finds roles that mention it, not just ones with
  // it in the title.
  function haystack(j) {
    return [
      j.company, j.role, j.source, j.location, j.locationMode, j.salary,
      j.notes, j.rationale, j.jobDescription, j.tier, j.stage,
      j.recruiter && j.recruiter.name, j.recruiter && j.recruiter.org,
    ].filter(Boolean).join(" ").toLowerCase();
  }

  // Splits a query into terms, keeping "quoted phrases" whole. Without this,
  // searching design system matches any row with "design" and "systems" in
  // separate sentences, which is most of them.
  function searchTerms(q) {
    var terms = [];
    var re = /"([^"]*)"|(\S+)/g;
    var m;
    while ((m = re.exec(q)) !== null) {
      var t = (m[1] !== undefined ? m[1] : m[2]).trim();
      if (t) terms.push(t);
    }
    return terms;
  }

  // Every term has to appear somewhere, so "remote ai" narrows rather than
  // widens, and "design system" in quotes matches the phrase.
  function matchesSearch(j, q) {
    if (!q) return true;
    var hay = haystack(j);
    return searchTerms(q).every(function (term) { return hay.indexOf(term) !== -1; });
  }

  // The list response deliberately omits descriptions and notes. Search those
  // fields on the server and return IDs only, keeping the normal response small.
  function applySearch() {
    var q = searchQuery.trim().toLowerCase();
    if (!q) {
      searchMatches = null;
      searchRequested = "";
      searchLoading = false;
      searchSequence++;
      if (searchTimer) clearTimeout(searchTimer);
      renderJobs();
    } else if (searchRequested !== q) {
      if (searchTimer) clearTimeout(searchTimer);
      searchSequence++;
      searchMatches = null;
      searchLoading = true;
      searchTimer = setTimeout(function () {
        var requested = q;
        var requestedArchive = showArchived;
        var sequence = ++searchSequence;
        searchRequested = requested;
        var prefix = showArchived ? "?archived=1&" : "?";
        api("/api/admin/jobs" + prefix + "q=" + encodeURIComponent(requested), { method: "GET" }).then(function (out) {
          if (sequence !== searchSequence || requestedArchive !== showArchived || requested !== searchQuery.trim().toLowerCase()) return;
          searchLoading = false;
          if (unauthorised(out) || !out.ok) { renderJobs(); return; }
          searchMatches = new Set(out.d.matchingIds || []);
          paintSearch();
        });
      }, 180);
    } else {
      renderJobs();
    }
  }

  function paintSearch() {
    renderJobs();
  }

  // Opens an already-written letter in a new tab, fetching a fresh
