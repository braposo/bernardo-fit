<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bernardo Raposo — where I'd fit</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" href="/favicon.svg" sizes="any" />
<meta name="description" content="Paste a role and I'll tell you, honestly, where I'd fit." />
<meta name="referrer" content="no-referrer" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: oklch(0.52 0.14 250);
    --accent-deep: oklch(0.42 0.14 250);
    --accent-soft: oklch(0.52 0.14 250 / 0.10);
    --good: oklch(0.52 0.11 155);
    --weak: oklch(0.54 0.15 25);
    --weak-soft: oklch(0.54 0.15 25 / 0.10);
    --paper: #faf8f4;
    --ink: #211f1a;
    --sub: #78746a;
    --body2: #45423a;
    --hair: rgba(33, 31, 26, 0.11);
    --hair-strong: rgba(33, 31, 26, 0.2);
    --sheet: #ffffff;
    --line: #e9e5dc;
    --sans: 'IBM Plex Sans', 'Helvetica Neue', sans-serif;
    --display: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
    --maxw: 1080px;
    --pad: clamp(24px, 7vw, 100px);
    --ease: cubic-bezier(0.22, 0.68, 0.24, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--hair-strong); transition: border-color 0.2s var(--ease), color 0.2s var(--ease); }
  a:hover { color: var(--accent-deep); border-color: var(--accent); }
  ::selection { background: var(--accent-soft); }

  .frame { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--pad); }

  /* Masthead — light, airy */
  .masthead {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: clamp(22px, 4vw, 34px) 0 clamp(18px, 3vw, 24px); flex-wrap: wrap;
  }
  .mark { font-family: var(--display); font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
  .mark .dot { color: var(--accent); }
  .kicker {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--sub);
  }

  /* Input */
  .lede {
    font-family: var(--display); font-size: clamp(40px, 9vw, 88px); font-weight: 600;
    line-height: 1.0; letter-spacing: -0.035em; margin: clamp(48px, 12vw, 120px) 0 0; max-width: 15ch;
    text-wrap: balance;
  }
  .lede em { font-style: normal; color: var(--accent); }
  .sub { margin: 26px 0 0; font-size: clamp(16px, 2.2vw, 18px); line-height: 1.62; color: var(--sub); max-width: 44ch; }

  .composer { margin-top: clamp(32px, 5vw, 48px); }
  textarea {
    width: 100%; min-height: 176px; resize: vertical; background: transparent;
    border: none; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair);
    padding: 20px 2px; font-family: var(--sans); font-size: 16px; line-height: 1.6; color: var(--ink);
    transition: border-color 0.25s var(--ease);
  }
  textarea::placeholder { color: #aaa498; }
  textarea:focus { outline: none; border-bottom-color: var(--accent); }

  .row { display: flex; align-items: center; gap: 20px; margin-top: 26px; flex-wrap: wrap; }
  /* The role button and the hero actions share one pill: same height, radius and type. */
  button.primary, .cta {
    appearance: none; border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    font-family: var(--sans); font-weight: 500; font-size: 15px; line-height: 1.2; letter-spacing: 0.01em;
    min-height: 50px; padding: 0 30px; border-radius: 100px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.22s var(--ease), border-color 0.22s var(--ease), color 0.22s var(--ease), transform 0.14s var(--ease), box-shadow 0.22s var(--ease);
    width: 100%; box-shadow: 0 1px 2px rgba(33,31,26,0.08);
  }
  @media (min-width: 480px) { button.primary, .cta { width: auto; } }
  button.primary:hover, .cta:hover { background: var(--accent-deep); border-color: var(--accent-deep); color: var(--paper); box-shadow: 0 6px 20px oklch(0.42 0.14 250 / 0.28); transform: translateY(-1px); }
  button.primary:active, .cta:active { transform: translateY(0); }
  .cta.outline { background: transparent; color: var(--ink); border-color: var(--hair-strong); box-shadow: none; }
  .cta.outline:hover { background: transparent; color: var(--accent-deep); border-color: var(--accent); box-shadow: none; }
  .hint { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.04em; color: var(--sub); }

  .loading {
    margin-top: clamp(60px, 14vw, 120px); font-family: var(--display); font-size: clamp(22px, 4vw, 30px);
    font-weight: 500; color: var(--sub); display: flex; align-items: center; gap: 12px; letter-spacing: -0.01em;
  }
  .loading .pen { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:0.2;transform:scale(0.7);} 50%{opacity:1;transform:scale(1.1);} }

  .error {
    margin-top: 22px; padding: 13px 0 13px 16px; border-left: 2px solid var(--weak);
    color: var(--weak); font-size: 14px;
  }

  /* Report — fluid, unboxed */
  .report > * { animation: rise 0.6s var(--ease) both; }
  .report > *:nth-child(2) { animation-delay: 0.04s; }
  .report > *:nth-child(3) { animation-delay: 0.08s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .to-line { margin-top: clamp(18px, 3vw, 32px); font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--sub); }
  .role-title {
    font-family: var(--display); font-size: clamp(28px, 4.2vw, 44px); line-height: 1.12;
    letter-spacing: -0.035em; margin: 12px 0 0; font-weight: 600; text-wrap: balance;
  }
  .role-title .company { color: var(--accent); }

  /* Pitch — open composition, no box; carries the hero */
  .pitch-block {
    margin-top: 24px; padding-bottom: 24px;
    border-bottom: 1px solid var(--hair);
  }
  .pitch-block .pitch {
    font-family: var(--display); font-size: clamp(19px, 2.2vw, 24px); font-weight: 400; line-height: 1.5;
    letter-spacing: -0.02em; margin: 0; color: var(--ink); text-wrap: pretty; max-width: 60ch;
  }
  .report-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
  .report-contact { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; color: var(--body2); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }

  /* Section label */
  .section-label {
    margin: 32px 0 18px; font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--sub);
  }

  /* Categories — editorial list, no boxes */
  .cats { display: flex; flex-direction: column; }
  .cat {
    display: grid; grid-template-columns: minmax(0, 20ch) 1fr; column-gap: clamp(20px, 4.5vw, 56px); row-gap: 12px;
    padding: 22px 0; border-top: 1px solid var(--hair); align-items: start;
  }
  .cat:last-child { border-bottom: 1px solid var(--hair); }
  .cat-name, .diff-headline { font-family: var(--display); font-weight: 600; font-size: clamp(16px, 2.2vw, 21px); letter-spacing: -0.01em; line-height: 1.3; }
  .cat-note, .diff-detail { font-size: 16px; line-height: 1.65; color: var(--body2); text-wrap: pretty; max-width: 62ch; }

  /* Differentiators */
  .diffs { display: flex; flex-direction: column; }
  .diff {
    display: grid; grid-template-columns: clamp(54px, 9vw, 96px) 1fr; column-gap: clamp(20px, 4.5vw, 56px); row-gap: 8px;
    padding: 22px 0; border-top: 1px solid var(--hair); align-items: start;
  }
  .diff:last-child { border-bottom: 1px solid var(--hair); }
  .diff-idx {
    font-family: var(--display); font-size: clamp(30px, 5vw, 50px); color: var(--accent); font-weight: 500;
    grid-row: span 2; line-height: 0.85; letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
  }
  .diff-detail { margin-top: 10px; }

  /* Closing — open, no band */
  .closing-wrap { margin-top: 32px; }
  .closing {
    font-family: var(--display); font-size: clamp(19px, 2.2vw, 24px); font-weight: 500; line-height: 1.4;
    margin: 0; letter-spacing: -0.02em; text-wrap: pretty;
  }
  .closing .accent { color: var(--accent); }
  .sign { margin-top: 24px; font-family: var(--display); font-weight: 600; font-size: 17px; }
  .sign small { display: block; font-family: var(--mono); font-size: 11px; color: var(--sub); margin-top: 6px; font-weight: 400; letter-spacing: 0.06em; }

  /* Share row — minimal, inline */
  .sharebar {
    margin-top: clamp(40px, 7vw, 60px); padding-top: clamp(24px, 4vw, 32px); border-top: 1px solid var(--hair);
    display: flex; align-items: center; gap: 14px 20px; flex-wrap: wrap;
  }
  .sharebar .lbl { font-size: 13.5px; color: var(--sub); flex: 1; min-width: 180px; line-height: 1.5; }
  .sharebar .lbl b { color: var(--ink); font-weight: 600; }
  .sharebar-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .linkbtn {
    appearance: none; border: 1px solid var(--hair-strong); background: transparent; color: var(--ink);
    font-family: var(--sans); font-weight: 500; font-size: 13.5px; padding: 10px 18px; border-radius: 100px;
    cursor: pointer; transition: border-color 0.2s var(--ease), color 0.2s var(--ease), background 0.2s var(--ease);
    line-height: 1.3; min-height: 44px; display: inline-flex; align-items: center;
  }
  .linkbtn:hover { border-color: var(--accent); color: var(--accent-deep); }
  .linkbtn.done { border-color: var(--good); color: var(--good); }

  .footer {
    margin: clamp(56px, 9vw, 90px) 0 clamp(40px, 6vw, 56px); padding-top: 22px; border-top: 1px solid var(--hair);
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.03em; color: var(--sub);
    display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  }

  /* Homepage introduction, from the published general CV */
  .nav { display: flex; gap: 6px 22px; flex-wrap: wrap; font-size: 14px; }
  .hero { padding-top: clamp(40px, 10vw, 104px); }
  .hero .kicker { display: block; }
  .hero-lede {
    font-family: var(--display); font-size: clamp(38px, 7vw, 76px); font-weight: 600;
    line-height: 1.02; letter-spacing: -0.035em; margin: 18px 0 0; max-width: 17ch; text-wrap: balance;
  }
  .hero-lede strong { font-weight: inherit; color: var(--accent); }
  .hero .sub { max-width: 52ch; }
  .sub strong, .prose strong, .feature strong { color: var(--ink); font-weight: 600; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: clamp(28px, 4vw, 36px); }
  .intro-section { margin-top: clamp(64px, 10vw, 112px); }
  .intro-section > .section-label { margin-top: 0; }
  .prose { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px clamp(24px, 4.5vw, 56px); }
  .prose p { margin: 0; font-size: 16px; line-height: 1.7; color: var(--body2); text-wrap: pretty; }
  .bring { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .bring-card { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 22px 22px 24px; }
  .bring-card h3 { margin: 0 0 10px; font-family: var(--display); font-weight: 600; font-size: clamp(16px, 2.2vw, 21px); letter-spacing: -0.01em; line-height: 1.3; }
  .bring-card p { margin: 0; font-size: 15px; line-height: 1.65; color: var(--body2); }
  .timeline { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hair); }
  .timeline li {
    display: grid; grid-template-columns: minmax(0, 15ch) 1fr auto; gap: 4px clamp(20px, 4vw, 48px);
    align-items: baseline; padding: 16px 0; border-bottom: 1px solid var(--hair);
  }
  .timeline .dates { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 0.02em; }
  .timeline .role { font-size: 15px; line-height: 1.5; color: var(--body2); }
  .timeline .role strong { font-family: var(--display); font-weight: 600; color: var(--ink); }
  .timeline .role .company { color: var(--accent); }
  .timeline .field { font-size: 13px; color: var(--sub); text-align: right; }
  .feature { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: clamp(22px, 4vw, 32px); }
  .feature-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .feature h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(22px, 3vw, 28px); letter-spacing: -0.02em; }
  .feature .dates { font-family: var(--mono); font-size: 12px; color: var(--sub); }
  .feature p { margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: var(--body2); max-width: 68ch; text-wrap: pretty; }
  .entry-links { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; font-size: 13.5px; }
  .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px clamp(24px, 4vw, 40px); margin-top: 28px; }
  .projects-intro { margin: 28px 0 0; font-size: 15px; line-height: 1.65; color: var(--sub); max-width: 68ch; }
  .project { padding-left: 12px; border-left: 2px solid var(--line); }
  .project h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
  .project p { margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: var(--body2); text-wrap: pretty; }
  .fit-check {
    margin-top: clamp(64px, 10vw, 112px); scroll-margin-top: 24px; background: var(--sheet); border: 1px solid var(--line);
    border-radius: 18px; padding: clamp(24px, 5.5vw, 56px); box-shadow: 0 1px 2px #211f1a08, 0 12px 32px -18px #211f1a26;
  }
  .fit-check .section-label { margin-top: 0; }
  .fit-check h2 {
    font-family: var(--display); font-size: clamp(30px, 4.6vw, 50px); font-weight: 600; line-height: 1.08;
    letter-spacing: -0.035em; margin: 0; max-width: 20ch; text-wrap: balance;
  }
  .fit-check h2 em { font-style: normal; color: var(--accent); }
  .fit-check .sub { margin-top: 18px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

  @media (max-width: 700px) {
    .timeline li { grid-template-columns: 1fr; gap: 2px; }
    .timeline .field { text-align: left; }
    .fit-check { border-radius: 14px; }
  }
  @media (max-width: 560px) {
    .cat { grid-template-columns: 1fr; row-gap: 8px; }
    .diff { grid-template-columns: 1fr; row-gap: 4px; }
    .diff-idx { grid-row: auto; font-size: 26px; }
    .diff-detail { margin-top: 8px; }
  }
</style>
<link rel="stylesheet" href="/task-ui.css">
</head>
<body>
  <main id="app"></main>

<script type="module">
import { subscribeRun, taskToast } from "/assets/task-ui.js";
import { createRunWatcher, coverPhaseText } from "/admin-run.js";
/* SANITY_PUBLIC_CONTENT */
(function () {
  "use strict";

  var app = document.getElementById("app");
  var content = window.PUBLIC_CONTENT;
  var defaultTitle = document.title;
  var state = { view: "input", jd: "", report: null, id: null, error: null, cached: false, phase: "queued" };
  var watchNonce = 0;
  var DEMO = new URLSearchParams(location.search).get("demo") === "1";

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Aggregate counters only, and never in demo mode. Fire-and-forget: if it
  // fails, the visitor should never know or care.
  var tracked = {};
  function track(event, id) {
    if (DEMO || !id) return;
    if (event === "view") {
      if (tracked[id]) return; // once per page load
      tracked[id] = true;
    }
    try {
      fetch("/api/track", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: id, event: event }),
        keepalive: true,
      }).catch(function () {});
    } catch (e) { /* ignore */ }
  }

  var MASTHEAD =
    '<div class="frame"><div class="masthead">' +
      '<div class="mark">' + esc(content.name) + '<span class="dot">.</span></div>' +
    '</div></div>';

  var MASTHEAD_NAV =
    '<div class="frame"><div class="masthead">' +
      '<div class="mark">' + esc(content.name) + '<span class="dot">.</span></div>' +
      '<nav class="nav" aria-label="Site"><a href="/cv">CV</a><a href="#fit">Check a role</a></nav>' +
    '</div></div>';

  var FOOTER =
    '<div class="frame"><div class="footer" style="justify-content: flex-end">' +
      '<span>' + content.contactsHtml + '</span>' +
    '</div></div>';

  // Approved CV copy marks key phrases with **double asterisks**.
  function rich(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
  function attr(s) { return esc(s).replace(/"/g, "&quot;"); }
  function linksHtml(links) {
    return links && links.length ? '<div class="entry-links">' + links.map(function (l) {
      return '<a href="' + attr(l.href) + '" rel="noopener">' + esc(l.label) + '</a>';
    }).join("") + '</div>' : "";
  }

  // An introduction from the published general CV, then the role input.
  function showcaseHtml(sc) {
    var first = String(sc.profile[0] || ""), split = first.match(/^(.+?[.!?])\s+([\s\S]+)$/);
    var lede = split ? split[1] : first, rest = split ? split[2] : "";
    var skills = sc.skills.map(function (g) {
      return '<div class="bring-card"><h3>' + esc(g.label) + '</h3><p>' + esc(g.items.join(", ")) + '</p></div>';
    }).join("");
    var career = sc.career.map(function (r) {
      return '<li><span class="dates">' + esc(r.dates) + '</span>' +
        '<span class="role"><strong>' + esc(r.title) + '</strong>' + (r.company ? ' <span class="company">· ' + esc(r.company) + '</span>' : '') + '</span>' +
        '<span class="field">' + esc(r.field) + '</span></li>';
    }).join("");
    var featured = sc.featured.map(function (f) {
      return '<div class="feature"><div class="feature-head"><h3>' + esc(f.title) + '</h3><span class="dates">' + esc(f.dates) + '</span></div>' +
        (f.scope ? '<p>' + rich(f.scope) + '</p>' : '') + linksHtml(f.links) + '</div>';
    }).join("");
    var projects = sc.projects.map(function (p) {
      return '<div class="project"><h3>' + esc(p.title) + '</h3>' + (p.text ? '<p>' + rich(p.text) + '</p>' : '') + linksHtml(p.links) + '</div>';
    }).join("");
    var more = sc.profile.slice(1).map(function (para) { return '<p>' + rich(para) + '</p>'; }).join("");
    return (
      '<section class="hero">' +
        (sc.headline ? '<span class="kicker">' + esc(sc.headline.replace(/\s*\|\s*/g, " · ")) + '</span>' : '') +
        '<h1 class="hero-lede">' + rich(lede) + '</h1>' +
        (rest ? '<p class="sub">' + rich(rest) + '</p>' : '') +
        '<div class="actions">' +
          '<a class="cta" href="#fit">' + esc(content.buttonLabel) + '</a>' +
          '<a class="cta outline" href="/cv">Read my CV</a>' +
        '</div>' +
      '</section>' +
      (more ? '<section class="intro-section"><div class="section-label">About</div><div class="prose">' + more + '</div></section>' : '') +
      (skills ? '<section class="intro-section"><div class="section-label">What I bring</div><div class="bring">' + skills + '</div></section>' : '') +
      (career ? '<section class="intro-section"><div class="section-label">Career</div><ol class="timeline">' + career + '</ol></section>' : '') +
      (featured || projects ? '<section class="intro-section"><div class="section-label">Now building</div>' + featured +
        (sc.projectsIntro && projects ? '<p class="projects-intro">' + esc(sc.projectsIntro) + '</p>' : '') +
        (projects ? '<div class="projects">' + projects + '</div>' : '') + '</section>' : '')
    );
  }

  function renderInput() {
    if (pendingAnalysis) { state.view = "loading"; return renderLoading(); }
    document.title = defaultTitle;
    var sc = content.showcase;
    app.innerHTML =
      (sc ? MASTHEAD_NAV : MASTHEAD) +
      '<div class="frame">' +
        (sc ? showcaseHtml(sc) + '<section class="fit-check" id="fit"><div class="section-label">Check a role</div><h2>' + content.headingHtml + '</h2>'
          : '<h1 class="lede">' + content.headingHtml + '</h1>') +
        '<p class="sub">' + content.introductionHtml + '</p>' +
        '<div class="composer">' +
          '<textarea id="jd" placeholder="' + esc(content.placeholder).replace(/"/g, '&quot;') + '" aria-label="Job description">' + esc(state.jd) + '</textarea>' +
          (state.error ? '<div class="error">' + esc(state.error) + '</div>' : '') +
          '<div class="row">' +
            '<button class="primary" id="go">' + esc(content.buttonLabel) + '</button>' +
            '<span class="hint">' + (DEMO ? 'Demo mode — no API call' : esc(content.hint)) + '</span>' +
          '</div>' +
        '</div>' +
        (sc ? '</section>' : '') +
      '</div>' +
      FOOTER;

    document.getElementById("go").addEventListener("click", runAnalyze);
    var ta = document.getElementById("jd");
    Array.prototype.forEach.call(document.querySelectorAll('a[href="#fit"]'), function (a) {
      a.addEventListener("click", function () { setTimeout(function () { ta.focus({ preventScroll: true }); }, 0); });
    });
    ta.addEventListener("input", function () { state.jd = ta.value; });
    ta.addEventListener("keydown", function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") runAnalyze();
    });
  }

  function renderLoading() {
    document.title = defaultTitle;
    var labels = { queued: "Your analysis is queued", analysing: "Reading the role, thinking it through", saving: "Saving your report" };
    app.innerHTML = MASTHEAD + '<div class="frame"><div class="loading">' + esc(labels[state.phase] || labels.queued) + '<span class="pen"></span></div></div>';
  }

  function renderReport(r, id) {
    var titleRole = String(r.job_title || "").trim();
    var titleCompany = String(r.company || "").trim();
    var titleContext = titleRole + (titleCompany ? (titleRole ? " at " : "") + titleCompany : "");
    document.title = (titleContext || "Fit report") + " — Fit · " + content.identity.name + (id ? " · " + id : "");
    var cats = (r.categories || []).map(function (c) {
      return (
        '<div class="cat">' +
          '<div class="cat-name">' + esc(c.name) + '</div>' +
          '<div class="cat-note">' + esc(c.note) + '</div>' +
        '</div>'
      );
    }).join("");

    var diffs = (r.differentiators || []).map(function (d, i) {
      return (
        '<div class="diff">' +
          '<div class="diff-idx">' + String(i + 1).padStart(2, "0") + '</div>' +
          '<div class="diff-headline">' + esc(d.headline) + '</div>' +
          '<div class="diff-detail">' + esc(d.detail) + '</div>' +
        '</div>'
      );
    }).join("");

    var roleLine = esc(r.job_title || "This role");
    if (r.company) roleLine += ' <span class="company">at ' + esc(r.company) + '</span>';

    app.innerHTML =
      MASTHEAD +
      '<div class="frame"><div class="report">' +
        '<div class="to-line">On fit for</div>' +
        '<h1 class="role-title">' + roleLine + '</h1>' +

        '<div class="report-contact">' + content.identity.contactsHtml + '</div>' +

        '<div class="pitch-block">' +
          '<p class="pitch">' + esc(r.pitch) + '</p>' +
          '<div class="report-actions"><a class="linkbtn" id="cv" href="/bernardo-raposo-cv.pdf" target="_blank" rel="noopener">Download CV</a></div>' +
        '</div>' +

        '<div class="section-label">Where I land</div>' +
        '<div class="cats">' + cats + '</div>' +

        (diffs ? '<div class="section-label">What sets me apart</div><div class="diffs">' + diffs + '</div>' : '') +

        '<div class="closing-wrap">' +
          (r.closing ? '<p class="closing">' + esc(r.closing) + '</p>' : '') +
          '<div class="sign">' + esc(content.identity.name) + '</div>' +
        '</div>' +

        '<div class="sharebar">' +
          '<span class="lbl">' + (state.cached ? '<b>Already analysed.</b> This role was run before — this is its published read.' : '<b>Keep this link.</b> It will show the current published version.') + '</span>' +
          '<div class="sharebar-actions">' +
            '<button class="linkbtn" id="copy">Copy link</button>' +
            '<button class="linkbtn" id="new">New role</button>' +
          '</div>' +
        '</div>' +
      '</div></div>' +
      FOOTER;

    track("view", id);

    var copyBtn = document.getElementById("copy");
    copyBtn.addEventListener("click", function () {
      var url = location.origin + location.pathname + "?r=" + encodeURIComponent(id);
      track("copy_link", id);
      navigator.clipboard.writeText(url).then(function () {
        copyBtn.textContent = "Link copied";
        copyBtn.classList.add("done");
        setTimeout(function () { copyBtn.textContent = "Copy link"; copyBtn.classList.remove("done"); }, 2200);
      });
    });
    document.getElementById("cv").addEventListener("click", function () {
      track("cv_download", id);
    });
    document.getElementById("new").addEventListener("click", function () {
      history.pushState({}, "", location.pathname + (DEMO ? "?demo=1" : ""));
      state.view = "input"; state.report = null; state.id = null; state.error = null; state.jd = ""; state.cached = false;
      renderInput();
    });
  }

  function render() {
    if (state.view === "loading") return renderLoading();
    if (state.view === "report" && state.report) return renderReport(state.report, state.id);
    return renderInput();
  }

  var DEMO_REPORT = window.PUBLIC_DEMO;

  function requestId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, "");
    return String(Date.now()) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  }

  function responseJson(res) {
    return res.json().catch(function () { return {}; }).then(function (d) { return { ok: res.ok, status: res.status, d: d }; });
  }

  function finishReport(id, cached) {
    fetch("/api/report?id=" + encodeURIComponent(id))
      .then(responseJson)
      .then(function (out) {
        if (!out.ok) throw new Error("Your report was saved but could not be loaded. Refresh to try again.");
        // The server renders shared reports in the fit page design; open it there.
        if (!DEMO) return location.replace(location.pathname + "?r=" + encodeURIComponent(id));
        state.report = out.d.report; state.id = id; state.cached = !!cached; state.view = "report";
        history.replaceState({}, "", location.pathname + "?r=" + encodeURIComponent(id));
        render();
      })
      .catch(function (err) {
        state.view = "input"; state.error = err.message || "Something went wrong. Try again."; render();
      });
  }

  var publicWatchers = new Map();
  var pendingAnalysis = null;
  function watchAnalysis(id, token) {
    pendingAnalysis = { id: id, token: token };
    if (publicWatchers.has(id)) return;
    var nonce = watchNonce;
    taskToast('public-analysis', { title: 'Fit analysis', message: 'Queued…', terminal: false, tone: 'pending', href: undefined });
    var watch = createRunWatcher({ subscribe: subscribeRun, request: function (_, realtime) {
      return fetch('/api/analyze?request=' + encodeURIComponent(id) + '&token=' + encodeURIComponent(token) + (realtime ? '&realtime=1' : '')).then(responseJson);
    }});
    var watching = watch(id, function (run) {
      taskToast('public-analysis', { message: coverPhaseText(run) });
      if (nonce === watchNonce && state.view === 'loading') { state.phase = run.phase || 'queued'; renderLoading(); }
    }).then(function (out) {
      publicWatchers.delete(id); pendingAnalysis = null;
      var data = out.d;
      taskToast('public-analysis', { message: data.reportId ? 'Your analysis is ready.' : data.error || 'The analysis did not finish.',
        terminal: true, tone: data.reportId ? 'ok' : 'err', href: data.reportId ? '/?r=' + encodeURIComponent(data.reportId) : undefined, linkLabel: 'Open analysis' });
      if (nonce !== watchNonce && state.view === 'report') return;
      if (data.reportId) return finishReport(data.reportId, data.cached);
      history.replaceState({}, '', location.pathname);
      state.view = 'input'; state.error = data.error || 'The analysis did not finish. Please try again.'; render();
    });
    publicWatchers.set(id, watching);
  }

  function runAnalyze() {
    if (pendingAnalysis || state.view === "loading") return;
    var jd = (state.jd || "").trim();
    if (jd.length < 20) { state.error = "Paste a bit more of the role so I can give you a real read."; return render(); }
    state.error = null;
    state.view = "loading";
    render();

    if (DEMO) {
      setTimeout(function () {
        state.report = DEMO_REPORT; state.id = "demo"; state.cached = false; state.view = "report";
        history.pushState({}, "", location.pathname + "?demo=1&r=demo");
        render();
      }, 700);
      return;
    }

    var id = requestId();
    pendingAnalysis = { id: id };
    taskToast("public-analysis", { title: "Fit analysis", message: "Starting…", terminal: false, tone: "pending", href: undefined });
    function admit(attempt) { return fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jobDescription: jd, requestId: id }),
    }).catch(function (err) {
      if (!attempt) return admit(1);
      throw err;
    }); }
    admit(0)
      .then(responseJson)
      .then(function (out) {
        if (!out.ok) throw new Error(out.d && out.d.error ? out.d.error : "Something went wrong.");
        if (out.status === 200 && out.d.report) {
          pendingAnalysis = null;
          taskToast("public-analysis", { message: "Your analysis is ready.", terminal: true, tone: "ok", href: "/?r=" + encodeURIComponent(out.d.id), linkLabel: "Open analysis" });
          state.report = out.d.report; state.id = out.d.id; state.cached = true; state.view = "report";
          history.pushState({}, "", location.pathname + "?r=" + encodeURIComponent(out.d.id)); return render();
        }
        if (!out.d.requestId || !out.d.token) throw new Error("The analysis could not start.");
        state.phase = "queued";
        history.pushState({}, "", location.pathname + "?p=" + encodeURIComponent(out.d.requestId) + "&t=" + encodeURIComponent(out.d.token));
        watchNonce++; watchAnalysis(out.d.requestId, out.d.token, 0);
      })
      .catch(function (err) {
        pendingAnalysis = null;
        taskToast("public-analysis", { message: err.message || "Could not start analysis.", terminal: true, tone: "err" });
        state.view = "input"; state.error = err.message || "Something went wrong. Try again."; render();
      });
  }

  function loadFromPermalink(id) {
    if (DEMO) { state.report = DEMO_REPORT; state.id = "demo"; state.view = "report"; render(); return; }
    state.view = "loading"; render();
    fetch("/api/report?id=" + encodeURIComponent(id))
      .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, d: d }; }); })
      .then(function (out) {
        if (!out.ok) throw new Error("This link couldn't be found.");
        state.report = out.d.report; state.id = id; state.cached = false; state.view = "report"; render();
      })
      .catch(function () {
        state.view = "input"; state.error = "That link couldn't be found — it may have expired. You can run a fresh one below."; render();
      });
  }

  var params = new URLSearchParams(location.search);
  var rid = params.get("r");
  var pendingId = params.get("p"); var pendingToken = params.get("t");
  if (rid) loadFromPermalink(rid);
  else if (pendingId && pendingToken) {
    state.view = "loading"; state.phase = "queued"; render(); watchNonce++; watchAnalysis(pendingId, pendingToken, 0);
  }
  else renderInput();

  window.addEventListener("popstate", function () {
    watchNonce++;
    var next = new URLSearchParams(location.search); var p = next.get("r");
    if (p) loadFromPermalink(p);
    else if (next.get("p") && next.get("t")) { state.view = "loading"; state.phase = "queued"; render(); watchAnalysis(next.get("p"), next.get("t"), 0); }
    else { state.view = "input"; renderInput(); }
  });
})();
</script>
</body>
</html>
