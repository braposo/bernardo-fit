<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title><!-- TITLE --></title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--accent:oklch(0.52 0.14 250);--paper:#faf8f4;--ink:#211f1a;--sub:#78746a;--body:#45423a;--sans:'IBM Plex Sans',sans-serif;--display:'Schibsted Grotesk',sans-serif;--mono:'IBM Plex Mono',monospace}
  *{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none;border-bottom:1px solid var(--accent)}a:hover{color:var(--accent)}
  .frame{max-width:1080px;margin:auto;padding:0 clamp(24px,7vw,100px)}
  .masthead{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(22px,4vw,34px) 0 24px;flex-wrap:wrap}
  .mark{font:600 28px var(--display);letter-spacing:-.01em;border:0}.dot{color:var(--accent)}
  .kicker,.section-label{font:11px var(--mono);letter-spacing:.19em;text-transform:uppercase;color:var(--sub)}
  .report{padding-top:clamp(18px,3vw,32px)}
  h1{font:600 clamp(28px,4.2vw,44px)/1.12 var(--display);letter-spacing:-.035em;margin:12px 0 0;text-wrap:balance}
  h1 span{color:var(--accent)}
  .pitch{font:400 clamp(19px,2.2vw,24px)/1.5 var(--display);letter-spacing:-.02em;max-width:60ch;margin:24px 0}
  .section-label{margin:34px 0 18px}
  .rows{display:grid;gap:24px}
  .row{display:grid;grid-template-columns:minmax(0,20ch) 1fr;gap:12px clamp(20px,4.5vw,56px)}
  .row h3{font:600 clamp(16px,2.2vw,21px)/1.3 var(--display);margin:0}
  .row p{font:16px/1.65 var(--sans);color:var(--body);margin:0;max-width:62ch}
  .cv{margin-top:clamp(46px,7vw,70px)}
  .cv-title{display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap}
  .cv-title h2{font:600 clamp(25px,3.5vw,34px)/1.2 var(--display);letter-spacing:-.03em;margin:0}
  .cv .headline{color:var(--body);margin:6px 0 0}
  .contacts{display:flex;gap:8px 18px;flex-wrap:wrap;margin:14px 0 24px;font-size:13px}
  .download{display:inline-block;border:1px solid var(--ink);border-radius:999px;padding:12px 20px;font:500 14px var(--sans);min-height:44px}
  .download:hover{border-color:var(--accent)}
  .cv-summary{max-width:72ch;font-size:15px;line-height:1.7}
  .experience{margin-top:30px}
  .role{padding:0}
  .role+.role{margin-top:24px}
  .role-head{display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap}
  .role h3{font:600 18px/1.35 var(--display);margin:0}
  .dates,.place{font-size:13px;color:var(--sub)}
  .entry-details{display:grid;gap:4px;margin:12px 0 0}
  .entry-detail{font:15px/1.65 var(--sans);color:var(--body);margin:0;max-width:76ch}
  .entry-links{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:8px;font-size:13px}
  .footer{margin:50px 0 48px;font:11px var(--mono);color:var(--sub)}
  @media(max-width:560px){.row{grid-template-columns:1fr;gap:7px}.rows{gap:20px}.role+.role{margin-top:22px}.role-head{display:block}.dates{display:block;margin-top:4px}}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style></head><body><div class="frame"><header class="masthead"><a class="mark" href="/">Bernardo Raposo<span class="dot">.</span></a><span class="kicker">A fit report and application CV</span></header><main>
<!-- REPORT -->
<!-- CV -->
</main><footer class="footer">Bernardo Raposo · Engineering, design and product</footer></div></body></html>
