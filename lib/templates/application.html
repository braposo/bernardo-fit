<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title><!-- TITLE --></title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--accent:oklch(0.52 0.14 250);--accent-soft:oklch(0.52 0.14 250 / .1);--paper:#faf8f4;--sheet:#ffffff;--ink:#211f1a;--sub:#6b675c;--body:#45423a;--line:#e9e5dc;--sans:'IBM Plex Sans',sans-serif;--display:'Schibsted Grotesk',sans-serif;--mono:'IBM Plex Mono',monospace}
  *{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none;border-bottom:1px solid var(--accent)}a:hover{color:var(--accent)}
  .frame{max-width:1080px;margin:auto;padding:0 clamp(16px,6vw,88px)}
  .masthead{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(22px,4vw,34px) 0 24px;flex-wrap:wrap}
  .mark{font:600 28px var(--display);letter-spacing:-.01em;border:0}.dot{color:var(--accent)}
  .kicker,.section-label{font:500 11.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--sub)}
  .report{padding-top:clamp(18px,3vw,36px)}
  h1{font:600 clamp(30px,4.6vw,50px)/1.08 var(--display);letter-spacing:-.035em;margin:14px 0 0;text-wrap:balance;max-width:20ch}
  h1 span{color:var(--accent)}
  .pitch{font:400 clamp(19px,2.2vw,24px)/1.5 var(--display);letter-spacing:-.015em;max-width:54ch;margin:26px 0 0;color:var(--ink);text-wrap:pretty}
  .report .section-label{margin:clamp(44px,6vw,64px) 0 22px}
  .rows{display:grid;gap:28px}
  .row{display:grid;grid-template-columns:minmax(0,22ch) 1fr;gap:12px clamp(20px,4.5vw,56px)}
  .row h3{font:600 clamp(16px,2.2vw,21px)/1.3 var(--display);letter-spacing:-.01em;margin:0}
  .row p{font:16px/1.65 var(--sans);color:var(--body);margin:0;max-width:62ch;text-wrap:pretty}
  .rows.bring{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  .rows.bring .row{display:block;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:22px 22px 24px}
  .rows.bring .row h3{margin-bottom:10px}
  .cv{margin-top:clamp(56px,8vw,88px);background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:clamp(24px,5.5vw,56px);box-shadow:0 1px 2px #211f1a08,0 12px 32px -18px #211f1a26}
  .cv-title{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}
  .cv-title .section-label{margin:0 0 14px}
  .cv-title h2{font:700 clamp(28px,3.8vw,38px)/1.1 var(--display);letter-spacing:-.03em;margin:0}
  .cv .headline{font:600 16px/1.45 var(--display);color:var(--ink);margin:8px 0 0}
  .contacts{display:flex;gap:8px 18px;flex-wrap:wrap;margin:14px 0 0;font-size:13.5px;color:var(--body)}
  .download{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:12px 20px;font:500 14px/1.2 var(--sans);min-height:44px;white-space:nowrap}
  .download:hover{background:var(--accent);color:#fff}
  .download::before{content:"";width:10px;height:10px;background:currentColor;clip-path:polygon(35% 0,65% 0,65% 45%,90% 45%,50% 85%,10% 45%,35% 45%)}
  .cv-summary{max-width:68ch;font-size:16px;line-height:1.7;color:var(--body);margin:24px 0 0;text-wrap:pretty}
  .experience{margin-top:clamp(28px,4vw,40px)}
  .experience>.section-label{margin:clamp(36px,5vw,48px) 0 20px;color:var(--accent)}
  .experience>.section-label:first-child{margin-top:0}
  .role{display:grid;grid-template-columns:minmax(0,15ch) 1fr;gap:4px clamp(20px,4vw,48px)}
  .role+.role{margin-top:28px}
  .role-meta{display:flex;flex-direction:column;gap:2px;padding-top:3px}
  .dates{font:500 12px/1.5 var(--mono);letter-spacing:.02em;color:var(--ink)}
  .place{font-size:13px;line-height:1.4;color:var(--sub)}
  .role h3{font:600 18px/1.35 var(--display);margin:0;letter-spacing:-.005em}
  .role h3 .company{font-weight:500;color:var(--accent)}
  .entry-details{display:grid;gap:8px;margin:10px 0 0}
  .entry-detail{font:15px/1.65 var(--sans);color:var(--body);margin:0;max-width:72ch;text-wrap:pretty;padding-left:12px;border-left:2px solid var(--line)}
  .entry-links{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:13px}
  .cv-summary+.cv-summary{margin-top:14px}
  .detailed .entry-scope{font:15px/1.65 var(--sans);color:var(--body);margin:8px 0 0;max-width:72ch;text-wrap:pretty}
  .detailed .entry-detail:not(.entry-highlight)+.entry-highlight{margin-top:8px}.em{color:var(--ink);font-weight:600}.jobs .role+.role{margin-top:40px}
  .entry-facts{font-size:14px;line-height:1.55;color:var(--body);margin:10px 0 0;max-width:72ch}.entry-facts+.entry-facts{margin-top:4px}.entry-facts+.entry-details{margin-top:14px}
  .role-more{margin:12px 0 0}.role-more>summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;list-style:none;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);padding:8px 0;min-height:24px}
  .role-more>summary::-webkit-details-marker{display:none}.role-more>summary::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .15s}
  .role-more[open]>summary::after{transform:translateY(1px) rotate(-135deg)}.role-more>summary:hover{color:var(--ink)}.role-more>summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
  .role-more>.entry-facts{margin-top:4px}@media(prefers-reduced-motion:reduce){.role-more>summary::after{transition:none}}
  .facts-label{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-right:6px}
  .skills,.contributions{display:grid;gap:10px}.skill,.contribution{font:15px/1.65 var(--sans);color:var(--body);margin:0;max-width:80ch;text-wrap:pretty}.skill strong,.contribution strong{color:var(--ink);font-weight:600}
  .contribution a{margin-left:8px;font-size:13px;white-space:nowrap}.section-intro{font:15px/1.65 var(--sans);color:var(--body);margin:0 0 16px;max-width:72ch}
  .footer{margin:44px 0 48px;font:11px var(--mono);color:var(--sub)}
  @media(max-width:700px){.row{grid-template-columns:1fr;gap:7px}.rows{gap:22px}.role{grid-template-columns:1fr}.role-meta{order:2;flex-direction:row;flex-wrap:wrap;gap:0 10px;padding:4px 0 0}.role-meta .place::before{content:"· ";color:var(--sub)}.role-body{display:contents}.role h3{order:1}.entry-details,.entry-links,.entry-scope,.entry-facts,.role-more{order:3}.role+.role{margin-top:26px}.cv{border-radius:14px}.cv-title{flex-direction:column}}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style></head><body><div class="frame"><header class="masthead"><a class="mark" href="/">Bernardo Raposo<span class="dot">.</span></a><span class="kicker">A fit report and application CV</span></header><main>
<!-- REPORT -->
<!-- CV -->
</main><footer class="footer">Bernardo Raposo · Engineering, design and product</footer></div></body></html>
