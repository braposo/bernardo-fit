<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"></meta>
<meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
<meta name="referrer" content="no-referrer"></meta>
<title>Bernardo Raposo · CV</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" href="/favicon.svg" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com"></link>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"></link>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"></link>
<style>
  :root {
    --accent: oklch(0.52 0.14 250);
    --paper: #ffffff;
    --ink: #26241f;
    --sub: #6b675c;
    --body2: #45423a;
    --hair: rgba(38, 36, 31, 0.16);
  }
  html, body { margin: 0; padding: 0; background: #e8e6e1; }
  .page {
    width: 794px;
    height: 1123px;
    box-sizing: border-box;
    margin: 24px auto;
    background: var(--paper);
    color: var(--ink);
    padding: 36px 50px 30px 50px;
    font-family: 'IBM Plex Sans', 'Helvetica Neue', sans-serif;
    font-size: 10.6px;
    line-height: 1.5;
    box-shadow: 0 2px 24px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
  }
  a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--accent); }

  /* Header — matches the cover letter */
  h1 {
    font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif;
    font-size: 3.05em; font-weight: 700; margin: 0;
    line-height: 1; letter-spacing: -0.025em;
  }
  h1 .dot { color: var(--accent); }
  .headline {
    margin: 0.7em 0 0 0; font-size: 1.1em;
    font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif; font-weight: 600;
  }
  .contact {
    display: flex; flex-wrap: wrap; gap: 0.35em 1.4em; margin-top: 0.6em;
    font-family: 'IBM Plex Mono', monospace; font-size: 0.84em; color: var(--sub);
  }
  .contact .status { color: var(--accent); }

  /* Body: a label column and a content column, like the original */
  .body { margin-top: 1.05em; border-top: 1px solid var(--hair); padding-top: 1.05em; flex: 1; }
  section { display: grid; grid-template-columns: 96px 1fr; gap: 18px; margin-bottom: 0.55em; }
  section + section { border-top: 1px solid var(--hair); padding-top: 0.55em; }
  section:last-child { margin-bottom: 0; }
  .label {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.78em; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--accent); line-height: 1.5; padding-top: 0.15em;
  }
  .content > p { margin: 0 0 0.42em 0; text-wrap: pretty; }
  .content > p:last-child { margin-bottom: 0; }

  .role { margin-bottom: 0.62em; }
  .role:last-child { margin-bottom: 0; }
  .role-head {
    font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif; font-weight: 600;
    font-size: 1.08em; display: flex; justify-content: space-between; gap: 1em; align-items: baseline;
  }
  .role-head .when {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.78em; color: var(--sub);
    font-weight: 400; white-space: nowrap;
  }
  .role-where {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.8em; color: var(--sub);
    margin: 0.1em 0 0.3em 0;
  }
  ul { margin: 0; padding-left: 1.05em; }
  li { margin-bottom: 0.18em; text-wrap: pretty; }
  li:last-child { margin-bottom: 0; }
  li::marker { color: var(--accent); }
  b { font-weight: 600; }
  .skill { margin-bottom: 0.28em; }
  .skill:last-child { margin-bottom: 0; }
  .skill .k { font-weight: 600; }

  .printbar {
    width: 794px; max-width: calc(100% - 32px); margin: 26px auto 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .printbar .what {
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em;
    text-transform: uppercase; color: #8a867b;
  }
  .printbar button {
    appearance: none; border: 1px solid rgba(38,36,31,0.2); background: transparent;
    color: #26241f; font-family: 'IBM Plex Sans', 'Helvetica Neue', sans-serif;
    font-weight: 500; font-size: 13px; line-height: 1; padding: 10px 18px;
    border-radius: 100px; cursor: pointer; white-space: nowrap; flex-shrink: 0; min-height: 44px;
    transition: border-color 0.2s, color 0.2s;
  }
  .printbar button:hover { border-color: var(--accent); color: var(--accent); }
  .overflow-warning {
    max-width: 794px; margin: 16px auto -8px auto; padding: 10px 14px;
    background: oklch(0.54 0.15 25 / 0.10); color: oklch(0.54 0.15 25);
    border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  }
  .letter-page { padding: 38px 50px 32px; font-size: 11.4px; line-height: 1.54; }
  .letter-page[hidden] { display: none; }
  .letter-page .headline { margin-top: 0.7em; }
  .letter-page .contact { gap: 0.4em 1.5em; margin-top: 0.65em; font-size: 0.82em; }
  .letter-page .letter {
    padding-top: 1.1em; margin-top: 1.1em; border-top: 1px solid var(--hair);
    display: flex; flex-direction: column; gap: 0.72em; flex: 1;
  }
  .letter-page .letter p { margin: 0; text-wrap: pretty; }
  .letter-page .salute { font-weight: 600; }
  .letter-page .lead {
    font-size: 1.16em; line-height: 1.5; font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif;
    font-weight: 500; color: var(--ink);
  }
  .letter-page .lead .em { color: var(--accent); }
  .letter-page em { font-style: normal; font-weight: 600; }
  .letter-page .sign { margin-top: 0.4em; display: flex; flex-direction: column; gap: 0.15em; }
  .letter-page .sign .name {
    font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif;
    font-weight: 700; font-size: 1.25em; letter-spacing: -0.01em;
  }
  .letter-page .sign .role { margin: 0; color: var(--sub); font-family: 'IBM Plex Mono', monospace; font-size: 0.82em; }

  @media print {
    .printbar, .overflow-warning { display: none !important; }
    @page { size: A4; margin: 0; }
    html, body { background: #ffffff; }
    .page {
      margin: 0; box-shadow: none;
      width: 210mm; height: 296mm;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .page:first-of-type { break-after: page; }
    *, *::before, *::after { transition-duration: 0s !important; }
  }
</style>
</head>
<body>
  <div class="printbar">
    <span class="what">A4 · one page · print with headers off</span>
    <button id="print">Save as PDF</button>
  </div>

  <main class="page" id="page">
<!-- SANITY_CV -->
</main>

  <main class="page letter-page" id="letter-page" hidden>
<!-- SANITY_LETTER_HEADER -->
    <div class="letter" id="letter"></div>
  </main>

  <script>
/* SANITY_CV_CONTENT */
    document.getElementById("print").addEventListener("click", function () { window.print(); });

    // The letter page does the same, so a link can go straight to the dialog.
    var params = new URLSearchParams(location.search);
    if (params.get("print") === "1" && params.get("combined") !== "1") {
      window.addEventListener("load", function () { setTimeout(function () { window.print(); }, 400); });
    }

    if (params.get("combined") === "1") {
      (function () {
        var j = params.get("j"), t = params.get("t");
        var page = document.getElementById("letter-page");
        var letter = document.getElementById("letter");
        var bar = document.querySelector(".printbar .what");
        var printButton = document.getElementById("print");
        printButton.disabled = true;
        bar.textContent = "A4 · two pages · CV then cover letter · print with headers off";
        function esc(s) {
          return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
        function safe(html) {
          return esc(html)
            .replace(/&lt;em&gt;/g, "<em>").replace(/&lt;\/em&gt;/g, "</em>")
            .replace(/&lt;span class="em"&gt;/g, '<span class="em">').replace(/&lt;\/span&gt;/g, "</span>")
            .replace(/&lt;a href="([^"]+)"&gt;/g, '<a href="$1">').replace(/&lt;\/a&gt;/g, "</a>");
        }
        function fail(message) {
          bar.textContent = message;
          printButton.disabled = true;
        }
        if (!j || !t) { fail("Open the combined document from the dashboard."); return; }
        fetch("/api/letter?j=" + encodeURIComponent(j) + "&t=" + encodeURIComponent(t))
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (out) {
            if (!out.ok) { fail(out.d.error || "Could not load this letter."); return; }
            var html = '<p class="salute">' + esc(out.d.salutation || "Dear Hiring Team,") + "</p>";
            (out.d.paragraphs || []).forEach(function (p) {
              html += "<p" + (p.lead ? ' class="lead"' : "") + ">" + safe(p.html) + "</p>";
            });
            html += '<div class="sign"><p>Best regards,</p><span class="name">' + esc(window.PUBLIC_CV.name) + '</span>' +
              '<span class="role">' + esc(window.PUBLIC_CV.signature) + '</span></div>';
            letter.innerHTML = html;
            page.hidden = false;
            printButton.disabled = false;
            document.title = window.PUBLIC_CV.name + " — CV and Cover Letter" + (out.d.company ? " — " + out.d.company : "");
            if (document.fonts && document.fonts.ready) return document.fonts.ready;
          })
          .then(function () {
            if (page.hidden) return;
            if (page.scrollHeight > page.clientHeight + 2) {
              var warn = document.createElement("div");
              warn.className = "overflow-warning";
              warn.textContent = "The letter overflows page two. Regenerate it before exporting.";
              document.body.insertBefore(warn, page);
            }
            if (params.get("print") === "1") window.print();
          })
          .catch(function () { fail("Network error loading this letter."); });
        window.addEventListener("beforeprint", function () {
          if (page.hidden) return;
          fetch("/api/track", { method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
            body: JSON.stringify({ id: j, token: t, event: "document_print", kind: "cover" }) }).catch(function () {});
        });
      })();
    }

    // The page is a fixed A4 box, so content that overruns is silently clipped
    // in the PDF. Say so on screen rather than letting it print short.
    (function () {
      function check() {
        var page = document.getElementById("page");
        var sections = page.querySelectorAll("section");
        var last = sections[sections.length - 1];
        if (!last) return;
        var padBottom = parseFloat(getComputedStyle(page).paddingBottom) || 0;
        var over = Math.round(last.getBoundingClientRect().bottom - (page.getBoundingClientRect().bottom - padBottom));
        var existing = document.querySelector(".overflow-warning");
        if (over > 2) {
          if (!existing) {
            var d = document.createElement("div");
            d.className = "overflow-warning";
            d.textContent = "Content overflows the page by about " + over + "px. Trim it, or it will be cut off in the PDF.";
            document.body.insertBefore(d, document.body.firstChild);
          }
        } else if (existing) {
          existing.remove();
        }
      }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(check);
      window.addEventListener("load", check);
      setTimeout(check, 600);
    })();
  </script>
</body>
</html>
